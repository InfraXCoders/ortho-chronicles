<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a0e04"/>
<title>Egg Climb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a0e04;overflow:hidden;touch-action:none;user-select:none;}
canvas{display:block;position:fixed;top:0;left:0;will-change:transform;transform:translateZ(0);image-rendering:auto;}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
/* Menu */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(12,7,2,.78);pointer-events:all;z-index:40;}
#menuBox{background:linear-gradient(155deg,#f5e8cc,#e8d4a8);
  border:3px solid #c8a050;border-radius:18px;padding:42px 30px;max-width:290px;
  width:88%;text-align:center;box-shadow:0 12px 55px rgba(0,0,0,.65);}
.mTitle{color:#5a2e08;font-size:2rem;font-weight:900;letter-spacing:3px;
  margin-bottom:6px;font-family:Georgia,serif;text-shadow:0 2px 6px rgba(0,0,0,.2);}
.mSub{color:#8a5828;font-size:.78rem;margin-bottom:10px;line-height:1.7;font-family:Georgia,serif;}
.mScore{color:#7a4018;font-size:.82rem;margin-bottom:22px;font-family:Georgia,serif;}
#playBtn{width:100%;padding:15px;background:linear-gradient(150deg,#8b4a18,#5a2c0a);
  color:#f8e090;border:2px solid #c87830;border-radius:12px;font-size:1.15rem;
  font-weight:800;cursor:pointer;letter-spacing:2px;font-family:Georgia,serif;
  box-shadow:0 5px 20px rgba(0,0,0,.4);pointer-events:all;}
#playBtn:active{transform:scale(.97);}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:none;pointer-events:none;
  justify-content:space-between;align-items:center;padding:10px 18px;
  background:rgba(0,0,0,.62);border-bottom:1px solid rgba(255,255,255,.12);z-index:20;}
#hud span{color:#ffffff;font-size:.88rem;font-weight:800;
  text-shadow:0 0 6px rgba(0,0,0,1),0 1px 3px rgba(0,0,0,1),0 -1px 3px rgba(0,0,0,.8);
  font-family:Georgia,serif;transition:color 0.15s ease,text-shadow 0.15s ease;}
#scoreFx{position:fixed;pointer-events:none;z-index:25;text-align:center;
  font-size:1.1rem;font-weight:900;font-family:Georgia,serif;display:none;
  text-shadow:0 2px 8px rgba(0,0,0,.6);}
#themeLabel{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  color:rgba(200,160,70,.6);font-size:.66rem;pointer-events:none;z-index:20;
  text-shadow:0 1px 3px #000;letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif;}
/* Game over */
#gameover{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.82);z-index:40;pointer-events:all;}
#goBox{background:linear-gradient(155deg,#f5e8cc,#e8d4a8);border:2px solid #c8a050;
  border-radius:16px;padding:38px 28px;text-align:center;max-width:280px;}
#goBox h2{color:#6a2808;font-size:1.6rem;font-family:Georgia,serif;margin-bottom:8px;}
#goBox p{color:#7a4820;margin-bottom:6px;font-size:.88rem;font-family:Georgia,serif;}
#goBox .goScore{color:#4a8018;font-size:1.1rem;font-weight:700;margin-bottom:20px;font-family:Georgia,serif;}
#goBox button{padding:12px 28px;background:#6a3010;color:#f8e090;
  border:2px solid #c87830;border-radius:8px;font-size:.95rem;font-weight:800;
  cursor:pointer;font-family:Georgia,serif;margin:4px;}
/* Toast */
#toast{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);
  background:rgba(15,8,2,.92);color:#d8a838;padding:8px 22px;border-radius:20px;
  font-weight:700;font-size:.8rem;display:none;pointer-events:none;z-index:25;
  white-space:nowrap;border:1px solid rgba(160,90,30,.5);font-family:Georgia,serif;}
/* Mute button */
#muteBtn{position:fixed;top:10px;right:14px;z-index:30;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.2);border-radius:50%;width:36px;height:36px;
  font-size:1.1rem;cursor:pointer;display:none;align-items:center;justify-content:center;
  pointer-events:all;color:#fff;line-height:1;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="splash" style="position:fixed;inset:0;background:#1a0e04;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.6s ease;">
  <img src="assets/egg-logo.png" style="width:72%;max-width:320px;border-radius:28px;box-shadow:0 8px 40px rgba(0,0,0,0.7);" />
  <div style="color:#d8a838;font-family:Georgia,serif;font-size:.8rem;margin-top:24px;letter-spacing:3px;opacity:0.7;">LOADING…</div>
</div>

<div id="menu">
  <div id="menuBox">
    <div class="mTitle">🥚 EGG CLIMB</div>
    <div class="mSub">Tap to toss the egg into the bowl.<br>Time it right — bowls keep moving!</div>
    <div class="mScore" id="menuHi"></div>
    <button id="playBtn" onclick="startGame()">▶ PLAY</button>
  </div>
</div>

<div id="hud">
  <span id="lvlTxt">LVL 1</span>
  <span id="scoreTxt">0</span>
  <span id="livesTxt">❤️❤️❤️</span>
</div>
<div id="themeLabel"></div>
<div id="scoreFx"></div>

<div id="gameover">
  <div id="goBox">
    <h2>💔 GAME OVER</h2>
    <p id="goMsg"></p>
    <p class="goScore" id="goScore"></p>
    <button id="watchAdBtn" onclick="watchAdContinue()" style="background:linear-gradient(135deg,#f5a623,#e8821a);display:none;">📺 Watch Ad to Continue</button>
    <button onclick="startGame()">↺ Retry</button>
    <button onclick="showMenu()">☰ Menu</button>
  </div>
</div>
<div id="toast"></div>
<button id="muteBtn" onclick="toggleMute()">🔊</button>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   EGG CLIMB  ·  Authentic physics · Rotating egg · Rolling in bowl
   Half-egg visible · Beige wood · 3 moving bowls · Competitive scoring
   ═══════════════════════════════════════════════════════════════════════ */

/* ── Canvas / layout ──────────────────────────────────────────────────── */
let cv, ctx, W, H, DPR=1;
const BOWL_W=54, BOWL_H=26, EGG_R=11;
const G=0.26;          // slow gravity → big arcs
let FL=0, FW;          // field left=0 (full width), field width=W
let YPOS;              // [bottom, mid, top] fixed Y for bowl rims

/* ── Sprite caches (pre-rendered offscreen canvases) ─────────────────── */
let _wingBright=null,_wingDim=null,_bowlBodySprite=null;
let _rimBackSprite=null,_rimFrontSprite=null;
let _bowlDimSprite=null,_bowlBrightSprite=null; // bowl body + wings combined
let _eggBodySprite=null,_eggBodyType=null;
let _eggGlowFly=null,_eggGlowSit=null;
// Fixed-timestep loop. The physics is fixed-step (no delta-time), so the game
// speed used to be tied to how many frames the phone could actually draw — on a
// slow phone that couldn't sustain the cap, the whole game ran in slow motion.
// The accumulator runs update() the right number of 24 Hz steps for the real
// elapsed time, so the game always plays at the intended speed; rendering is
// throttled separately (≈32fps) to spare phone fill-rate.
let _acc=0, _prevTs=0, _lastDraw=0;
const STEP_MS=1000/24;    // logic step — keeps the original tuning/feel
const DRAW_MS=1000/32;    // render cap (independent of game speed)
const MAX_STEPS=5;        // clamp catch-up so a stall can't spiral

function initCv(){
  cv=document.getElementById('c');
  DPR=1; // force 1× — 4× fewer pixels for Android WebView to process
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx=cv.getContext('2d',{alpha:false}); // opaque — skips alpha compositing pass
  ctx.scale(DPR,DPR);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  FW=W; FL=0;
  YPOS=[Math.round(H*.76), Math.round(H*.48), Math.round(H*.21)];
  // Pre-render sprites (eliminates gradient creation every frame)
  // Guard: sprites have fixed pixel sizes, bake once across restarts
  if(!_wingBright){ _wingBright=_bakeWingSprite(true); }
  if(!_wingDim){ _wingDim=_bakeWingSprite(false); }
  if(!_bowlBodySprite){ _bowlBodySprite=_bakeBowlBodySprite(); }
  if(!_rimBackSprite){ _rimBackSprite=_bakeRimBackSprite(); }
  if(!_rimFrontSprite){ _rimFrontSprite=_bakeRimFrontSprite(); }
  if(!_bowlDimSprite){ _bowlDimSprite=_bakeBowlFullSprite(false); }
  if(!_bowlBrightSprite){ _bowlBrightSprite=_bakeBowlFullSprite(true); }
  _eggBodySprite=null; _eggBodyType=null; // lazy on first draw
}
window.addEventListener('resize',()=>{if(running){initCv();bgCache={};}});

/* ── Wing sprite baker ───────────────────────────────────────────────── */
function _bakeWingSprite(bright){
  const OW=72,OH=58,OX=38,OY=30;
  const oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
  const c=oc.getContext('2d');
  c.translate(OX,OY); c.scale(0.72,0.72);
  _paintWingFeathers(c,bright);
  return {canvas:oc,ox:OX,oy:OY};
}

function _paintWingFeathers(c,bright){
  const base=bright?'rgba(255,255,255,0.95)':'rgba(220,210,190,0.85)';
  const mid=bright?'rgba(240,235,210,0.90)':'rgba(190,178,155,0.80)';
  const tip=bright?'rgba(255,248,220,0.80)':'rgba(160,148,120,0.70)';
  const shade=bright?'rgba(180,160,100,0.25)':'rgba(120,100,60,0.20)';
  const quill=bright?'rgba(200,180,120,0.50)':'rgba(130,110,70,0.40)';
  if(bright){
    const gl=c.createRadialGradient(-14,-18,2,-14,-18,28);
    gl.addColorStop(0,'rgba(255,240,160,0.30)');gl.addColorStop(1,'rgba(255,240,160,0)');
    c.fillStyle=gl;c.beginPath();c.ellipse(-14,-18,28,22,-.3,0,Math.PI*2);c.fill();
  }
  c.beginPath();c.moveTo(0,0);
  c.bezierCurveTo(-4,-12,-16,-26,-24,-24);c.bezierCurveTo(-30,-22,-28,-10,-20,-4);
  c.bezierCurveTo(-12,0,-4,2,0,0);c.closePath();
  const g1=c.createLinearGradient(-28,-26,0,0);
  g1.addColorStop(0,mid);g1.addColorStop(0.5,base);g1.addColorStop(1,'rgba(255,255,255,0.6)');
  c.fillStyle=g1;c.fill();c.strokeStyle=shade;c.lineWidth=0.6;c.stroke();
  const midF=[
    [[-2,2],[-10,-4],[-22,-8],[-18,2]],
    [[-4,4],[-14,0],[-24,-2],[-18,6]],
    [[-6,5],[-16,4],[-24,6],[-16,10]],
  ];
  midF.forEach(([p0,p1,p2,p3])=>{
    c.beginPath();c.moveTo(...p0);c.bezierCurveTo(...p1,...p2,...p3);c.lineTo(...p0);c.closePath();
    const gm=c.createLinearGradient(p2[0],p2[1],p0[0],p0[1]);
    gm.addColorStop(0,tip);gm.addColorStop(0.6,base);gm.addColorStop(1,'rgba(255,255,255,0.5)');
    c.fillStyle=gm;c.fill();c.strokeStyle=quill;c.lineWidth=0.5;c.stroke();
  });
  [{ox:-2,oy:3,dx:-14,dy:16},{ox:-6,oy:5,dx:-20,dy:18},
   {ox:-10,oy:6,dx:-25,dy:16},{ox:-14,oy:6,dx:-28,dy:12},{ox:-17,oy:4,dx:-28,dy:7}
  ].forEach(({ox,oy,dx,dy},i)=>{
    const w=4-i*0.3;
    c.beginPath();c.moveTo(ox,oy);c.bezierCurveTo(ox-4,oy+4,dx+3,dy-4,dx,dy);
    c.bezierCurveTo(dx-w*0.5,dy+1,ox-w,oy+3,ox,oy);c.closePath();
    const gp=c.createLinearGradient(ox,oy,dx,dy);
    gp.addColorStop(0,'rgba(255,255,255,0.9)');gp.addColorStop(0.4,base);gp.addColorStop(1,tip);
    c.fillStyle=gp;c.fill();c.strokeStyle=quill;c.lineWidth=0.5;c.stroke();
    c.beginPath();c.moveTo(ox,oy);c.lineTo(dx,dy);c.strokeStyle=quill;c.lineWidth=0.7;c.stroke();
  });
  const gr=c.createRadialGradient(-2,1,0,-2,1,12);
  gr.addColorStop(0,'rgba(200,180,120,0.18)');gr.addColorStop(1,'rgba(200,180,120,0)');
  c.fillStyle=gr;c.beginPath();c.arc(-2,1,12,0,Math.PI*2);c.fill();
}

/* ── Bowl body sprite baker ──────────────────────────────────────────── */
function _bakeBowlBodySprite(){
  const bw=BOWL_W,bh=BOWL_H,pad=2;
  const OW=bw+pad*2,OH=bh+pad*2+6;
  const oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
  const c=oc.getContext('2d');
  const x=pad,y=pad,cx=x+bw/2;
  const bp=()=>{
    c.beginPath();c.moveTo(x+5,y);c.lineTo(x+bw-5,y);
    c.bezierCurveTo(x+bw+bw*.10,y+bh*.55,cx+bw*.12,y+bh,cx,y+bh);
    c.bezierCurveTo(cx-bw*.12,y+bh,x-bw*.10,y+bh*.55,x+5,y);c.closePath();
  };
  bp();
  const bg=c.createLinearGradient(x,y,cx,y+bh);
  bg.addColorStop(0,'#3d1d08');bg.addColorStop(.3,'#200e03');
  bg.addColorStop(.7,'#140800');bg.addColorStop(1,'#0a0400');
  c.fillStyle=bg;c.fill();
  bp();
  const ig=c.createRadialGradient(cx,y+bh*.25,1,cx,y+bh*.25,bw*.38);
  ig.addColorStop(0,'rgba(90,45,12,.10)');ig.addColorStop(.5,'rgba(5,2,0,.38)');
  ig.addColorStop(1,'rgba(0,0,0,.62)');
  c.fillStyle=ig;c.fill();
  const lh=c.createLinearGradient(x+4,y,x+14,y);
  lh.addColorStop(0,'rgba(160,80,28,.22)');lh.addColorStop(1,'rgba(160,80,28,0)');
  bp();c.fillStyle=lh;c.fill();
  c.fillStyle='rgba(0,0,0,.14)';
  c.beginPath();c.ellipse(cx,y+bh+4,bw*.28,3,0,0,Math.PI*2);c.fill();
  return {canvas:oc,ox:pad,oy:pad};
}

/* ── Bowl rim sprite bakers ──────────────────────────────────────────── */
// Back rim = upper half of ellipse (drawn BEHIND the egg)
function _bakeRimBackSprite(){
  const rw=27,rh=5.2,pad=3;
  const OW=BOWL_W+pad*2,OH=Math.ceil(rh+pad+4);
  const oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
  const c=oc.getContext('2d');
  const cx=OW/2,cy=OH-pad; // ellipse center near bottom of sprite (upper half extends upward)
  c.lineCap='round';
  c.strokeStyle='#5a2c0a';c.lineWidth=3.5;
  c.beginPath();c.ellipse(cx,cy,rw,rh,0,Math.PI,Math.PI*2);c.stroke();
  c.strokeStyle='rgba(180,100,40,.60)';c.lineWidth=1.2;
  c.beginPath();c.ellipse(cx,cy-0.5,BOWL_W*.43/2,BOWL_H*.12,0,Math.PI*.06,Math.PI*.94,true);c.stroke();
  return {canvas:oc,cx,cy};
}
// Front rim = lower half of ellipse (drawn IN FRONT of the egg)
function _bakeRimFrontSprite(){
  const rw=27,rh=5.2,pad=3;
  const OW=BOWL_W+pad*2,OH=Math.ceil(rh+pad+4);
  const oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
  const c=oc.getContext('2d');
  const cx=OW/2,cy=pad; // ellipse center near top of sprite (lower half extends downward)
  c.lineCap='round';
  c.strokeStyle='#5a2c0a';c.lineWidth=3.5;
  c.beginPath();c.ellipse(cx,cy,rw,rh,0,0,Math.PI);c.stroke();
  return {canvas:oc,cx,cy};
}

/* ── Combined bowl body + wings sprite baker ─────────────────────────── */
function _bakeBowlFullSprite(bright){
  const wsp=bright?_wingBright:_wingDim;
  const bw=BOWL_W,bh=BOWL_H;
  const lPad=40,rPad=40,tPad=22,bPad=6;
  const OW=bw+lPad+rPad,OH=bh+tPad+bPad+8;
  const oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
  const c=oc.getContext('2d');
  const bx=lPad,by=tPad,bcx=bx+bw/2;
  // Bowl body
  const bp=()=>{
    c.beginPath();c.moveTo(bx+5,by);c.lineTo(bx+bw-5,by);
    c.bezierCurveTo(bx+bw+bw*.10,by+bh*.55,bcx+bw*.12,by+bh,bcx,by+bh);
    c.bezierCurveTo(bcx-bw*.12,by+bh,bx-bw*.10,by+bh*.55,bx+5,by);c.closePath();
  };
  bp();
  const bg=c.createLinearGradient(bx,by,bcx,by+bh);
  bg.addColorStop(0,'#3d1d08');bg.addColorStop(.3,'#200e03');
  bg.addColorStop(.7,'#140800');bg.addColorStop(1,'#0a0400');
  c.fillStyle=bg;c.fill();
  bp();
  const ig=c.createRadialGradient(bcx,by+bh*.25,1,bcx,by+bh*.25,bw*.38);
  ig.addColorStop(0,'rgba(90,45,12,.10)');ig.addColorStop(.5,'rgba(5,2,0,.38)');
  ig.addColorStop(1,'rgba(0,0,0,.62)');
  c.fillStyle=ig;c.fill();
  const lh=c.createLinearGradient(bx+4,by,bx+14,by);
  lh.addColorStop(0,'rgba(160,80,28,.22)');lh.addColorStop(1,'rgba(160,80,28,0)');
  bp();c.fillStyle=lh;c.fill();
  c.fillStyle='rgba(0,0,0,.14)';
  c.beginPath();c.ellipse(bcx,by+bh+4,bw*.28,3,0,0,Math.PI*2);c.fill();
  // Wings baked into sprite (no per-frame rotation)
  if(wsp){
    const lwy=by+bh*.35;
    c.save();c.translate(bx-1,lwy);c.drawImage(wsp.canvas,-wsp.ox,-wsp.oy);c.restore();
    c.save();c.translate(bx+bw+1,lwy);c.scale(-1,1);c.drawImage(wsp.canvas,-wsp.ox,-wsp.oy);c.restore();
  }
  return {canvas:oc,bx,by};
}

/* ── Egg body + glow sprite baker ────────────────────────────────────── */
function _bakeEggBodySprite(type){
  const r=EGG_R,pad=4;
  const OW=Math.ceil(r*2+pad*2),OH=Math.ceil(r*2*1.26+pad*2);
  const oc=document.createElement('canvas');oc.width=OW;oc.height=OH;
  const c=oc.getContext('2d');
  c.translate(OW/2,OH/2);c.scale(1,1.26);
  const[c1,c2,c3,c4]=_eggColorsStatic(type);
  const eg=c.createRadialGradient(-r*.25,-r*.30,0.8,r*.06,r*.08,r*1.02);
  eg.addColorStop(0,c1);eg.addColorStop(.25,c2);eg.addColorStop(.60,c3);eg.addColorStop(1,c4);
  c.fillStyle=eg;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
  const ss=c.createRadialGradient(r*.08,r*.14,r*.22,r*.08,r*.14,r*.96);
  ss.addColorStop(0,'rgba(0,0,0,0)');ss.addColorStop(.6,'rgba(0,0,0,.03)');ss.addColorStop(1,'rgba(0,0,0,.18)');
  c.fillStyle=ss;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
  c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=1.4/1.26;
  c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();
  const sp1=c.createRadialGradient(-r*.22,-r*.28,0,-r*.22,-r*.28,r*.30);
  sp1.addColorStop(0,'rgba(255,255,255,.92)');sp1.addColorStop(.5,'rgba(255,255,255,.55)');sp1.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=sp1;c.beginPath();c.arc(-r*.22,-r*.28,r*.30,0,Math.PI*2);c.fill();
  c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.arc(-r*.06,-r*.50,r*.07,0,Math.PI*2);c.fill();
  c.fillStyle='rgba(255,255,255,.10)';c.beginPath();c.arc(r*.12,r*.50,r*.14,0,Math.PI*2);c.fill();
  // Also bake glow sprites
  const col=_eggGlowColorStatic(type);
  const fr=Math.ceil(r*2.6)+2,fd=fr*2;
  const fc=document.createElement('canvas');fc.width=fd;fc.height=fd;
  const fg=fc.getContext('2d');
  const fgg=fg.createRadialGradient(fd/2,fd/2,r*.15,fd/2,fd/2,fr);
  fgg.addColorStop(0,col);fgg.addColorStop(1,'rgba(0,0,0,0)');
  fg.fillStyle=fgg;fg.fillRect(0,0,fd,fd);
  _eggGlowFly={canvas:fc,half:fd/2};
  const sr=Math.ceil(r*1.6)+2,sd=sr*2;
  const sc=document.createElement('canvas');sc.width=sd;sc.height=sd;
  const sg=sc.getContext('2d');
  const sgg=sg.createRadialGradient(sd/2,sd/2,r*.3,sd/2,sd/2,sr);
  sgg.addColorStop(0,col);sgg.addColorStop(1,'rgba(0,0,0,0)');
  sg.fillStyle=sgg;sg.fillRect(0,0,sd,sd);
  _eggGlowSit={canvas:sc,half:sd/2};
  return {canvas:oc,w:OW,h:OH};
}
function _eggColorsStatic(type){
  return ({
    white:   ['#ffffff','#f5f5f2','#dddbd4','#b0aea8'],
    bronze:  ['#faba6e','#d87e2c','#9a5010','#5a2802'],
    silver:  ['#f8f8ff','#c8c8d8','#9898b2','#606076'],
    gold:    ['#fffaaa','#ffd600','#c88000','#7a4600'],

/* ── Game state ───────────────────────────────────────────────────────── */
let running=false, animId, dying=false;
let level=1, lives=3, score=0, hiScore=0, combo=0;
let milestonesEarned=new Set();
const MILESTONES=[{l:25,v:1},{l:50,v:2},{l:100,v:3},{l:500,v:5},{l:1000,v:10},{l:2000,v:5},{l:5000,v:10}];

// 3 bowls always visible at YPOS[0..2]
let bowls=[], curIdx=0, tgtIdx=1;

/* ── Egg ─────────────────────────────────────────────────────────────── */
let egg={
  x:0, y:0,            // position (y = center of egg)
  vx:0, vy:0,
  angle:0,             // rotation (radians)
  angV:0,              // angular velocity
  offsetX:0,           // rolling offset from bowl center
  missed:false
};
// States: 'sitting' | 'flying' | 'approach' | 'rolling'
let eggState='sitting';

/* ── Slide animation ─────────────────────────────────────────────────── */
let slideAnim=null;   // {t, total, bgStart}

/* ── Hen intro animation ─────────────────────────────────────────────── */
let henAnim=null;     // {t} counts up; null = not playing

/* ── Background / FX ─────────────────────────────────────────────────── */
let bgCache={}, particles=[], curTheme='';
let scoreFxQueue=[];  // [{txt, col, x, y, life}]
let squishT=0;        // landing squish countdown

/* ── Speed helpers ───────────────────────────────────────────────────── */
const SPD_MULTS=[0.4, 0.55, 0.75, 0.95, 1.2, 1.55, 1.95, 2.4];
function randSpd(base){ return base*SPD_MULTS[Math.floor(Math.random()*SPD_MULTS.length)]; }
// Speed grows until L500 (cap 3.5), beyond that stays constant
function baseSpd(l){ return l<=5 ? 0.9 : Math.min(0.9+(l-5)*0.006, 3.5); }

function mkBowl(y, stat){
  const spd = stat ? 0 : randSpd(baseSpd(level));
  return{
    x: stat ? FL+FW/2-BOWL_W/2 : FL+Math.random()*(FW-BOWL_W),
    y, w:BOWL_W, h:BOWL_H,
    speed:spd, dir:Math.random()<.5?1:-1
  };
}

/* ── Egg sit position: center AT rim so bottom half is inside bowl ───── */
function seatY(b){ return b.y; }

/* ── Theme / egg ─────────────────────────────────────────────────────── */
function getTheme(l){
  if(l<10)   return 'beigewood';
  if(l<25)   return 'stones';
  if(l<50)   return 'forest';
  if(l<100)  return 'flowers';
  if(l<200)  return 'mountains';
  if(l<250)  return 'clouds';
  if(l<275)  return 'fog';
  if(l<325)  return 'snow';
  if(l<400)  return 'rain';
  if(l<500)  return 'space';
  if(l<550)  return 'moon';
  // Planets cycle every 50 levels from 550 onwards; sun every 100, universe every 100
  const cycle=['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune','sun','universe'];
  return cycle[Math.floor((l-550)/50)%cycle.length];
}
const THEME_LABELS={
  beigewood:'🪵 Old Woodland',stones:'🪨 Stone Ruins',forest:'🌲 Forest',flowers:'🌸 Flower Fields',
  mountains:'⛰️ Mountains',clouds:'☁️ Above Clouds',fog:'🌫️ Foggy Valley',
  snow:'❄️ Snowfall',rain:'🌧️ Rainstorm',space:'🌌 Space Nebula',
  moon:'🌙 Moon',sun:'☀️ The Sun',universe:'🌌 Universe',
  mercury:'🪐 Mercury',venus:'🪐 Venus',earth:'🌍 Earth',mars:'🔴 Mars',
  jupiter:'🪐 Jupiter',saturn:'🪐 Saturn',uranus:'🪐 Uranus',neptune:'🔵 Neptune'
};
function getEggType(l){
  if(l>=5000) return 'cosmic';
  if(l>=2000) return 'rainbow';
  if(l>=1000) return 'diamond';
  if(l>=200)  return 'platinum';
  if(l>=100)  return 'gold';
  if(l>=50)   return 'silver';
  if(l>=25)   return 'bronze';
  return 'white';
}

/* ── Start ───────────────────────────────────────────────────────────── */
/* ── AUDIO ────────────────────────────────────────────────────────────── */
let _ac=null, _muted=false;
function _getAC(){
  if(!_ac) _ac=new(window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==='suspended') _ac.resume();
  return _ac;
}
function toggleMute(){
  _muted=!_muted;
  document.getElementById('muteBtn').textContent=_muted?'🔇':'🔊';
}
function startMusic(){}
function stopMusic(){}

function sfxTap(){
  if(_muted) return;
  const a=_getAC(),o=a.createOscillator(),g=a.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(500,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(950,a.currentTime+0.07);
  g.gain.setValueAtTime(0.22,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.13);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+0.14);
}
function sfxLand(){
  if(_muted) return;
  const a=_getAC();
  [[240,.8],[160,.5],[100,.3]].forEach(([f,v])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*.42,a.currentTime+0.22);
    g.gain.setValueAtTime(v*.48,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.28);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+0.3);
  });
}
function sfxMiss(){
  if(_muted) return;
  const a=_getAC();
  [[440,0],[300,.12],[180,.24]].forEach(([f,t])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(f,a.currentTime+t);
    o.frequency.exponentialRampToValueAtTime(f*.45,a.currentTime+t+.12);
    g.gain.setValueAtTime(.17,a.currentTime+t);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t+.15);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime+t); o.stop(a.currentTime+t+.17);
  });
}

function startGame(){
  initCv();
  if(score>hiScore) hiScore=score;
  _adUsedThisRun=false;
  level=1; lives=3; score=0; combo=0;
  milestonesEarned=new Set();
  bgCache={}; particles=[]; curTheme='';
  slideAnim=null; squishT=0; scoreFxQueue=[];

  document.getElementById('menu').style.display='none';
  document.getElementById('gameover').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('muteBtn').style.display='flex';
  stopMusic(); startMusic();

  bowls=[
    mkBowl(YPOS[0], true),
    mkBowl(YPOS[1], true),   // stationary until level > 10
    mkBowl(YPOS[2], true),   // stationary until level > 10
  ];
  curIdx=0; tgtIdx=1;

  egg.x=bowls[0].x+BOWL_W/2; egg.y=seatY(bowls[0]);
  egg.vx=0; egg.vy=0; egg.angle=0; egg.angV=0;
  egg.offsetX=0; egg.missed=false;
  eggState='intro';   // blocked until hen anim completes
  dying=false;
  henAnim={t:0};

  running=true;
  _prevTs=0; _acc=0;
  if(animId) cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
  updateHUD(); themeCheck(true);
}
function showMenu(){
  running=false; cancelAnimationFrame(animId);
  if(score>hiScore) hiScore=score;
  document.getElementById('menuHi').textContent=hiScore>0?'Best: '+hiScore:'';
  document.getElementById('gameover').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('muteBtn').style.display='none';
  document.getElementById('menu').style.display='flex';
}

/* ── Main loop ───────────────────────────────────────────────────────── */
function loop(ts){
  if(!running) return;
  animId=requestAnimationFrame(loop);
  if(!_prevTs){ _prevTs=ts; _lastDraw=ts-DRAW_MS; }
  let dt=ts-_prevTs; _prevTs=ts;
  if(dt>200) dt=200;                     // after a tab/app suspend, don't fast-forward
  _acc+=dt;
  let steps=0;
  while(_acc>=STEP_MS && steps<MAX_STEPS){ try{update();}catch(e){console.error(e);} _acc-=STEP_MS; steps++; }
  if(steps>=MAX_STEPS) _acc=0;           // drop a backlog we couldn't catch up on
  if(ts-_lastDraw>=DRAW_MS){ _lastDraw=ts; try{render();}catch(e){console.error(e);} }
}

/* ── Update ──────────────────────────────────────────────────────────── */
function update(){
  squishT=Math.max(0,squishT-1);
  updateParticles();
  updateScoreFx();

  // ── Hen intro animation ──
  if(henAnim){
    henAnim.t++;
    if(henAnim.t>=200){ henAnim=null; eggState='sitting'; }
    return; // freeze game during intro
  }

  // ── Slide animation ──
  if(slideAnim){
    slideAnim.t++;
    const p=easeOut(slideAnim.t/slideAnim.total);
    bowls[0].y=YPOS[0]+p*(H*.25);
    bowls[1].y=YPOS[1]+p*(YPOS[0]-YPOS[1]);
    bowls[2].y=YPOS[2]+p*(YPOS[1]-YPOS[2]);
    // egg rides on curIdx bowl (was bowl[2] when top caught)
    const rb=bowls[curIdx];
    egg.y=rb.y; egg.x=rb.x+BOWL_W/2+egg.offsetX;
    if(slideAnim.t>=slideAnim.total) finishSlide();
    return;
  }

  // ── All bowls move ──
  bowls.forEach(b=>{
    if(!b.speed) return;
    b.x+=b.speed*b.dir;
    if(b.x+b.w>FL+FW){b.x=FL+FW-b.w;b.dir=-1;}
    if(b.x<FL){b.x=FL;b.dir=1;}
  });

  // ── States ──
  if(eggState==='sitting'){
    const cb=bowls[curIdx];
    egg.x=cb.x+BOWL_W/2;
    egg.y=seatY(cb);
    // Idle gentle sway
    egg.angle=Math.sin(Date.now()*.0018)*0.04;
    egg.angV=0;
  }

  else if(eggState==='flying'){
    const tb=bowls[tgtIdx];

    // Pure physics — no deceleration
    egg.vy+=G;
    egg.x+=egg.vx; egg.y+=egg.vy;
    egg.angle+=egg.angV;

    // Field wall bounce
    if(egg.x-EGG_R<FL){egg.x=FL+EGG_R;egg.vx=Math.abs(egg.vx)*0.45;}
    if(egg.x+EGG_R>FL+FW){egg.x=FL+FW-EGG_R;egg.vx=-Math.abs(egg.vx)*0.45;}

    // ── Catch: egg falling into bowl ──
    const catchW=tb.w-14;
    const catchL=tb.x+7;
    const inX=egg.x>=catchL && egg.x<=catchL+catchW;
    const inY=egg.y+EGG_R>=tb.y-4 && egg.y-EGG_R<=tb.y+tb.h*.5;
    if(inX && inY && egg.vy>0){ catchBowl(); return; }

    // ── Miss: fell past bowl while descending ──
    if(!egg.missed && egg.vy>0 && egg.y>tb.y+tb.h+16){
      egg.missed=true;
      egg.vx+=(Math.random()-0.5)*3;
      egg.angV=egg.vx*0.12;
      onMiss();
    }

    if(egg.missed){
      if(egg.y>H+60){
        const cb=bowls[curIdx];
        egg.x=cb.x+BOWL_W/2; egg.y=seatY(cb);
        egg.vx=0; egg.vy=0; egg.angV=0; egg.angle=0;
        egg.missed=false;
        eggState='sitting';
      }
      return;
    }
  }

  else if(eggState==='rolling'){
    const cb=bowls[curIdx];
    // Egg rolls to center of current bowl
    egg.offsetX*=0.82;
    egg.angV=egg.offsetX*0.038;
    egg.angle+=egg.angV;
    egg.x=cb.x+BOWL_W/2+egg.offsetX;
    egg.y=seatY(cb);

    if(Math.abs(egg.offsetX)<0.5){
      egg.offsetX=0; egg.angle=0;
      eggState='sitting';
      if(tgtIdx>2) startSlide();
    }
  }
}

function easeOut(t){return 1-(1-t)*(1-t)*(1-t);}

/* ── Catch ───────────────────────────────────────────────────────────── */
function catchBowl(){
  sfxLand();
  const tb=bowls[tgtIdx];
  const cx=tb.x+BOWL_W/2;
  const off=Math.abs(egg.x-cx)/(BOWL_W/2-7);  // 0=center,1=edge
  combo++;
  let pts, label, col;
  if(off<=0.25){pts=150;label='PERFECT ✦';col='#7af08a';}
  else if(off<=0.60){pts=80;label='GOOD ✓';col='#ffe46a';}
  else{pts=30;label='NICE';col='#f8c858';}
  const earned=pts*combo;
  score+=earned;
  hiScore=Math.max(hiScore,score);
  // Flash HUD colour based on catch quality
  if(off<=0.25)      flashHUD('#7af08a','rgba(100,255,120,0.8)');
  else if(off<=0.60) flashHUD('#ffe46a','rgba(255,220,80,0.8)');
  else               flashHUD('#f8c858','rgba(255,180,60,0.8)');
  // Score fly-up FX
  addScoreFx((combo>1?'×'+combo+' ':'')+label+' +'+earned, col, W/2, tb.y-45);
  if(combo>=3) addScoreFx('COMBO ×'+combo+'!','#ff9a40',W/2,tb.y-75);

  egg.x=cx; egg.y=seatY(tb);
  egg.offsetX=egg.x-(tb.x+BOWL_W/2)+( egg.vx*2); // inertia into roll
  egg.vx=0; egg.vy=0;
  squishT=14; eggState='rolling';
  curIdx=tgtIdx; tgtIdx++;
  updateHUD();
}

/* ── Slide (top bowl caught → shift everything down) ─────────────────── */
function startSlide(){
  slideAnim={t:0, total:52};
}
function finishSlide(){
  const nextL=level+1;
  let b1moves=false, b2moves=false; // b1=egg's bowl, b2=target bowl

  if(nextL<=1){
    b1moves=false; b2moves=false;
  } else if(nextL<=10){
    b1moves=false; b2moves=true;   // only target moves
  } else {
    // Progressive difficulty: more b1 movement (egg inside) as levels rise
    const d=Math.min((nextL-10)/30,1); // 0 at L11 → 1 at L40+
    const pBreather=Math.max(0.12-d*0.10,0.02);
    const pTopOnly =Math.max(0.42-d*0.28,0.08);
    const r=Math.random();
    if(r<pBreather){            b1moves=false; b2moves=false; } // breather
    else if(r<pBreather+pTopOnly){ b1moves=false; b2moves=true; } // top only
    else{                       b1moves=true;  b2moves=true;  } // egg bowl + top
  }

  const b0={...bowls[1],y:YPOS[0],speed:0,x:FL+FW/2-BOWL_W/2}; // always stationary
  const b1spd=b1moves?randSpd(baseSpd(nextL)):0;
  const b1x=b1moves?FL+Math.random()*(FW-BOWL_W):FL+FW/2-BOWL_W/2;
  const b1={y:YPOS[1],w:BOWL_W,h:BOWL_H,x:b1x,speed:b1spd,dir:Math.random()<.5?1:-1};
  const b2=mkBowl(YPOS[2],!b2moves);
  bowls=[b0,b1,b2];
  curIdx=1; tgtIdx=2;
  egg.y=seatY(bowls[1]); egg.x=bowls[1].x+BOWL_W/2;
  egg.offsetX=0; egg.angV=0;
  eggState='sitting'; slideAnim=null;
  level++; checkMilestones(); updateHUD(); themeCheck(false);
}

/* ── Miss / death ────────────────────────────────────────────────────── */
function onMiss(){
  sfxMiss();
  lives--; combo=0; updateHUD();
  // Guard: tgtIdx may be 3 after top-bowl catch sequence, use mid-Y as fallback
  const missY = bowls[tgtIdx] ? bowls[tgtIdx].y-40 : H*0.4;
  addScoreFx('MISSED','#ff4444',W/2,missY);
  if(lives<=0){
    dying=true; // prevent further taps immediately
    setTimeout(()=>{
      stopMusic();
      if(score>hiScore) hiScore=score;
      document.getElementById('goMsg').textContent='Reached Level '+level;
      document.getElementById('goScore').textContent='Score: '+score+(hiScore>0?' · Best: '+hiScore:'');
      // Show rewarded ad button only if ad ready and not used this run
      const adBtn=document.getElementById('watchAdBtn');
      if(_adReady && !_adUsedThisRun){
        adBtn.style.display='block';
        adBtn.disabled=false;
        adBtn.textContent='📺 Watch Ad to Continue';
      } else {
        adBtn.style.display='none';
      }
      document.getElementById('gameover').style.display='flex';
      document.getElementById('muteBtn').style.display='none';
      running=false;
    },900);
  }
}

/* ── Milestones ──────────────────────────────────────────────────────── */
function checkMilestones(){
  for(const m of MILESTONES){
    if(level>=m.l&&!milestonesEarned.has(m.l)){
      milestonesEarned.add(m.l);
      lives=Math.min(lives+m.v,10);
      showToast('+'+m.v+' '+(m.v>1?'Lives':'Life')+'! Level '+m.l+' Bonus 🎉');
      updateHUD();
    }
  }
}
function themeCheck(force){
  const t=getTheme(level);
  if(t!==curTheme||force){
    curTheme=t;
    document.getElementById('themeLabel').textContent=THEME_LABELS[t]||t;
    spawnParticles(t);
    if(!bgCache[t]) bgCache[t]=makeBg(t);
  }
}

/* ── Input ───────────────────────────────────────────────────────────── */
document.addEventListener('touchstart',e=>{if(running){e.preventDefault();tap();}},{passive:false});
document.addEventListener('mousedown',()=>{if(running)tap();});
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&running){e.preventDefault();tap();}});

function tap(){
  if(eggState!=='sitting'||slideAnim||dying||henAnim) return;
  const tb=bowls[tgtIdx]; if(!tb) return;
  const dy=tb.y-egg.y; if(dy>=0) return;
  // Arc ABOVE bowl — egg goes straight up, bowl must be aligned at landing
  const OVERSHOOT=90;
  const peakY=tb.y-OVERSHOOT;
  const peakDy=peakY-egg.y;
  const vy=-Math.sqrt(2*G*Math.abs(peakDy));
  egg.vx=0;          // straight up — player must time tap for alignment
  egg.vy=vy;
  egg.angV=0.04;     // small aesthetic spin
  egg.missed=false;
  eggState='flying';
  sfxTap();
}

/* ── Score FX ────────────────────────────────────────────────────────── */
function addScoreFx(txt,col,x,y){
  scoreFxQueue.push({txt,col,x,y,life:52,vy:-0.9});
}
function updateScoreFx(){
  scoreFxQueue.forEach(f=>{f.y+=f.vy;f.life--;});
  scoreFxQueue=scoreFxQueue.filter(f=>f.life>0);
}

/* ── Particles ───────────────────────────────────────────────────────── */
function spawnParticles(t){
  particles=[];
  if(t==='snow') for(let i=0;i<15;i++) particles.push({x:Math.random()*W,y:Math.random()*H,r:1.2+Math.random()*2.0,sy:.55+Math.random()*1.0,sx:(Math.random()-.5)*.35});
  if(t==='rain') for(let i=0;i<22;i++) particles.push({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*8,sy:9+Math.random()*5});
  if(t==='fog')  for(let i=0;i<8;i++)  particles.push({x:Math.random()*W,y:Math.random()*H,r:55+Math.random()*80,a:.04+Math.random()*.04,sx:.30+Math.random()*.35});
}
function updateParticles(){
  if(curTheme==='snow') particles.forEach(p=>{p.y+=p.sy;p.x+=p.sx;if(p.y>H)p.y=-4;if(p.x>W)p.x=0;if(p.x<0)p.x=W;});
  if(curTheme==='rain') particles.forEach(p=>{p.y+=p.sy;p.x-=1.6;if(p.y>H){p.y=-p.l;p.x=Math.random()*W;}});
  if(curTheme==='fog')  particles.forEach(p=>{p.x+=p.sx;if(p.x>W+p.r)p.x=-p.r;});
}

/* ── Background maker ────────────────────────────────────────────────── */
function makeBg(theme){
  const bc=document.createElement('canvas'); bc.width=W; bc.height=H;
  const bx=bc.getContext('2d',{alpha:false}); const w=bc.width,h=bc.height;
  const gfill=(a,b)=>{const g=bx.createLinearGradient(0,0,0,h);g.addColorStop(0,a);g.addColorStop(1,b);bx.fillStyle=g;bx.fillRect(0,0,w,h);};

  else if(theme==='forest'){

    for(let i=0;i<14;i++){const tx=w*i/13,ty=h*.14+Math.random()*h*.18,th=h*.26+Math.random()*h*.14;bx.fillStyle=`hsl(${114+Math.random()*32},${36+Math.random()*20}%,${11+Math.random()*11}%)`;bx.beginPath();bx.moveTo(tx,ty);bx.lineTo(tx-30,ty+th);bx.lineTo(tx+30,ty+th);bx.closePath();bx.fill();bx.fillStyle='#1c0c04';bx.fillRect(tx-5,ty+th,10,h*.05);}

  else if(theme==='mountains'){gfill('#f04e14','#f09a28');[[h*.58,'#3e2614'],[h*.42,'#2e1c0e'],[h*.30,'#4c3824']].forEach(([my,c])=>{bx.fillStyle=c;bx.beginPath();bx.moveTo(0,h);for(let x=0;x<=w;x+=w/6)bx.lineTo(x,my-Math.random()*h*.10);bx.lineTo(w,h);bx.closePath();bx.fill();});bx.fillStyle='rgba(255,255,255,.62)';[[w*.18,h*.30,w*.06,h*.08],[w*.64,h*.22,w*.07,h*.09]].forEach(([px,py,pw,ph])=>{bx.beginPath();bx.moveTo(px,py);bx.lineTo(px+pw,py+ph);bx.lineTo(px-pw,py+ph);bx.closePath();bx.fill();});}
  else if(theme==='clouds'){gfill('#9cc6e6','#c6e2f5');for(let i=0;i<26;i++){const cx=Math.random()*w,cy=Math.random()*h,cw=56+Math.random()*115,ch=22+Math.random()*42;bx.fillStyle=`rgba(255,255,255,${.26+Math.random()*.52})`;bx.beginPath();bx.ellipse(cx,cy,cw/2,ch/2,0,0,Math.PI*2);bx.fill();bx.beginPath();bx.ellipse(cx-cw*.18,cy+5,cw*.28,ch*.34,0,0,Math.PI*2);bx.fill();bx.beginPath();bx.ellipse(cx+cw*.18,cy+5,cw*.28,ch*.34,0,0,Math.PI*2);bx.fill();}}
  else if(theme==='fog'){gfill('#869298','#9eb0b8');for(let i=0;i<12;i++){const fg=bx.createRadialGradient(w/2,h*i/11,0,w/2,h*i/11,w*.58);fg.addColorStop(0,`rgba(186,198,208,${.08+Math.random()*.07})`);fg.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=fg;bx.fillRect(0,0,w,h);}}
  else if(theme==='snow'){gfill('#b6c6d6','#dce8f4');bx.fillStyle='rgba(255,255,255,.86)';bx.beginPath();bx.moveTo(0,h);bx.quadraticCurveTo(w*.25,h*.82,w*.5,h*.86);bx.quadraticCurveTo(w*.78,h*.90,w,h*.84);bx.lineTo(w,h);bx.closePath();bx.fill();}
  else if(theme==='rain'){gfill('#0c1826','#182434');bx.fillStyle='rgba(26,34,46,.86)';for(let i=0;i<7;i++){bx.beginPath();bx.ellipse(w*i/6,h*.08,54+Math.random()*33,16,0,0,Math.PI*2);bx.fill();}}
  else if(theme==='space'){gfill('#020006','#040012');bStars(bx,w,h,155);[['rgba(100,0,180,.12)',w*.3,h*.3],['rgba(0,65,175,.10)',w*.7,h*.6],['rgba(175,0,55,.08)',w*.2,h*.7]].forEach(([c,nx,ny])=>{const g=bx.createRadialGradient(nx,ny,0,nx,ny,w*.52);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=g;bx.fillRect(0,0,w,h);});}
  else if(theme==='moon'){gfill('#050a10','#0a1416');bStars(bx,w,h,120);const eg=bx.createRadialGradient(w*.15,h*.09,0,w*.15,h*.09,34);eg.addColorStop(0,'#1466b8');eg.addColorStop(.4,'#145c12');eg.addColorStop(1,'#073280');bx.fillStyle=eg;bx.beginPath();bx.arc(w*.15,h*.09,34,0,Math.PI*2);bx.fill();bx.fillStyle='#888a8e';bx.fillRect(0,h*.84,w,h*.16);}
  else if(theme==='sun'){gfill('#f01600','#f05800');for(let i=0;i<6;i++){const sg=bx.createRadialGradient(w*.5,h*.08,10,w*.5,h*.08,w*(.28+i*.09));sg.addColorStop(0,`rgba(255,${118-i*18},0,.17)`);sg.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=sg;bx.fillRect(0,0,w,h);}}
  else if(theme==='universe'){gfill('#000002','#000009');bStars(bx,w,h,235);[['rgba(148,68,255,.12)',w*.2,h*.2],['rgba(38,128,255,.10)',w*.76,h*.56],['rgba(255,58,128,.08)',w*.42,h*.8],['rgba(0,178,132,.09)',w*.85,h*.28]].forEach(([c,nx,ny])=>{const g=bx.createRadialGradient(nx,ny,0,nx,ny,85);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=g;bx.fillRect(0,0,w,h);});}
  else{
    const pd={mercury:['#141414','#222222'],venus:['#bc5e12','#da801c'],earth:['#144caa','#206ec5'],mars:['#7c1c00','#b63214'],jupiter:['#bc6a28','#d89635'],saturn:['#ac8635','#d0a64e'],uranus:['#30a6bc','#4accd8'],neptune:['#0a1650','#1230a8']};
    const d=pd[theme]||['#111','#222']; gfill(d[0],d[1]);
    if(theme==='jupiter'){['#904618','#c47624','#904618','#b66820'].forEach((s,i)=>{bx.fillStyle=s;bx.fillRect(0,h*i/4,w,h/4+1);});}
    if(theme==='saturn'){bx.strokeStyle='rgba(176,152,65,.44)';bx.lineWidth=9;bx.beginPath();bx.moveTo(0,h*.30);bx.bezierCurveTo(w*.28,h*.20,w*.72,h*.20,w,h*.30);bx.stroke();}
    if(theme==='earth'){bx.fillStyle='rgba(14,58,145,.5)';bx.fillRect(0,h*.62,w,h*.12);bClouds(bx,w,h,'rgba(255,255,255,.36)');}
    bStars(bx,w,h,22);
  }
  return bc;
}
function bClouds(bx,w,h,col){for(let i=0;i<6;i++){const cx=Math.random()*w,cy=h*(.04+Math.random()*.18),cw=44+Math.random()*78;bx.fillStyle=col;bx.beginPath();bx.ellipse(cx,cy,cw/2,10,0,0,Math.PI*2);bx.fill();bx.beginPath();bx.ellipse(cx-cw*.17,cy+5,cw*.26,7,0,0,Math.PI*2);bx.fill();bx.beginPath();bx.ellipse(cx+cw*.17,cy+5,cw*.26,7,0,0,Math.PI*2);bx.fill();}}
function bStars(bx,w,h,n){for(let i=0;i<n;i++){bx.fillStyle=`rgba(255,255,255,${.14+Math.random()*.86})`;bx.beginPath();bx.arc(Math.random()*w,Math.random()*h,.3+Math.random()*1.4,0,Math.PI*2);bx.fill();}}

/* ── Render ──────────────────────────────────────────────────────────── */
function render(){
  if(!ctx) return;
  // No clearRect — background drawImage covers the full canvas

  // Background — static W×H blit (no scroll, no offset math)
  const t=getTheme(level);
  if(!bgCache[t]) bgCache[t]=makeBg(t);
  ctx.drawImage(bgCache[t],0,0);

  // Particles
  renderParticles();

  // ── Bowl bodies (behind egg) ──
  bowls.forEach((b,i)=>drawBowlBody(b,i===tgtIdx));

  // ── Aim arc ──
  if(eggState==='sitting'&&!slideAnim) drawAim();

  // ── Bowl rim BACK arc (behind egg) — top half of ellipse ──
  bowls.forEach((b,i)=>drawBowlRimArc(b,i===tgtIdx,false));

  // ── Hen intro (replaces egg during intro) ──
  if(henAnim){ renderHenIntro(); }

  // ── EGG (hidden during intro) ──
  if(!henAnim&&(eggState==='sitting'||eggState==='rolling')){
    // Draw egg freely, then overdraw bowl body on top to hide the submerged bottom half
    drawEgg(egg.x,egg.y);
    const cb=bowls[curIdx];
    if(_bowlBodySprite) ctx.drawImage(_bowlBodySprite.canvas,cb.x-_bowlBodySprite.ox,cb.y-_bowlBodySprite.oy);
  } else if(!henAnim){
    if(egg.missed && egg.y > H - 55){
      // Splat on the floor — squish flat and stay put
      const splat=Math.min(1,(egg.y-(H-55))/40);
      ctx.save();
      ctx.translate(egg.x, H-18);
      ctx.scale(1+splat*0.8, 1-splat*0.7);
      drawScrambledEgg(0, 0, egg.angle);
      ctx.restore();
    } else {
      drawEgg(egg.x, egg.y);
    }
  }

  // ── Bowl rim FRONT arc (in front of egg) — bottom half of ellipse ──
  bowls.forEach((b,i)=>drawBowlRimArc(b,i===tgtIdx,true));

  // ── Score FX ── (no shadowBlur — too slow on Android)
  // Score FX — fillText only (strokeText is slow on Android)
  ctx.save();
  ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
  scoreFxQueue.forEach(f=>{
    const a=Math.min(1,f.life/20);
    ctx.globalAlpha=a;
    ctx.fillStyle=f.col;
    ctx.fillText(f.txt,f.x,f.y);
  });
  ctx.globalAlpha=1; ctx.restore();

  // ── Combo display ──
  if(combo>=2){
    ctx.save(); ctx.font='bold 15px sans-serif'; ctx.textAlign='right';
    ctx.fillStyle='rgba(255,200,80,.90)';
    ctx.fillText('COMBO ×'+combo,W-8,bowls[tgtIdx]?bowls[tgtIdx].y-12:H*.18);
    ctx.restore();
  }
}

function renderParticles(){
  if(curTheme==='snow'){ctx.fillStyle='rgba(255,255,255,.88)';particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});}
  if(curTheme==='rain'){ctx.strokeStyle='rgba(130,175,220,.50)';ctx.lineWidth=1;particles.forEach(p=>{ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-1.6,p.y+p.l);ctx.stroke();});}
  if(curTheme==='fog'){particles.forEach(p=>{ctx.fillStyle=`rgba(170,184,194,${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});}
}

/* ── BOWL BODY ────────────────────────────────────────────────────────── */
function drawBowlBody(b,isTarget){
  const{x,y,w,h}=b, cx=x+w/2;
  // Single drawImage: bowl body + wings pre-baked into one sprite
  const sp=isTarget?_bowlBrightSprite:_bowlDimSprite;
  if(sp) ctx.drawImage(sp.canvas,x-sp.bx,y-sp.by);
  // Target-only: pulsing glow + gold rim shimmer (2 ellipses, no save/restore needed)
  if(isTarget){
    const p=.5+.5*Math.sin(Date.now()*.007);
    ctx.fillStyle=`rgba(255,210,60,${p*0.18})`;
    ctx.beginPath();ctx.ellipse(cx,y+h/2,w*.72,h*.8,0,0,Math.PI*2);ctx.fill();
    const pa=.5+.5*Math.sin(Date.now()*.008);
    ctx.strokeStyle=`rgba(230,185,55,${pa})`;ctx.lineWidth=1.8;ctx.lineCap='round';
    ctx.beginPath();ctx.ellipse(cx,y,w*.48,h*.19,0,0,Math.PI*2);ctx.stroke();
  }
}

/* ── BOWL RIM ─────────────────────────────────────────────────────────── */
function drawBowlRimArc(b,isTarget,front){
  const cx=b.x+b.w/2;
  if(front){
    if(_rimFrontSprite){
      const sp=_rimFrontSprite;
      ctx.drawImage(sp.canvas,cx-sp.cx,b.y-sp.cy);
    }
  } else {
    if(_rimBackSprite){
      const sp=_rimBackSprite;
      ctx.drawImage(sp.canvas,cx-sp.cx,b.y-sp.cy);
    }
  }
}

function drawWing(c,wx,wy,flipX,bright){
  const sp=bright?_wingBright:_wingDim;
  if(sp){
    const flap=Math.sin(Date.now()*.003)*0.12;
    c.save();c.translate(wx,wy);if(flipX)c.scale(-1,1);
    c.rotate(flap);c.drawImage(sp.canvas,-sp.ox,-sp.oy);c.restore();
    return;
  }
  // Fallback (sprite not ready yet)
  c.save(); c.translate(wx,wy); if(flipX) c.scale(-1,1);
  c.scale(0.72,0.72);
  const flap=Math.sin(Date.now()*.003)*0.12;
  c.rotate(flap);

  const base  = bright?'rgba(255,255,255,0.95)':'rgba(220,210,190,0.85)';
  const mid   = bright?'rgba(240,235,210,0.90)':'rgba(190,178,155,0.80)';
  const tip   = bright?'rgba(255,248,220,0.80)':'rgba(160,148,120,0.70)';
  const shade = bright?'rgba(180,160,100,0.25)':'rgba(120,100,60,0.20)';
  const quill = bright?'rgba(200,180,120,0.50)':'rgba(130,110,70,0.40)';
  const glow  = bright?'rgba(255,240,160,0.55)':'rgba(180,160,80,0.25)';

  // Soft glow behind wing
  if(bright){
    const gl=c.createRadialGradient(-14,-18,2,-14,-18,28);
    gl.addColorStop(0,'rgba(255,240,160,0.30)'); gl.addColorStop(1,'rgba(255,240,160,0)');
    c.fillStyle=gl; c.beginPath(); c.ellipse(-14,-18,28,22,-.3,0,Math.PI*2); c.fill();
  }

  // ── Layer 1: main upper wing ──────────────────────────────────────────
  c.beginPath();
  c.moveTo(0,0);
  c.bezierCurveTo(-4,-12,-16,-26,-24,-24);
  c.bezierCurveTo(-30,-22,-28,-10,-20,-4);
  c.bezierCurveTo(-12,0,-4,2,0,0);
  c.closePath();
  const g1=c.createLinearGradient(-28,-26,0,0);
  g1.addColorStop(0,mid); g1.addColorStop(0.5,base); g1.addColorStop(1,'rgba(255,255,255,0.6)');
  c.fillStyle=g1; c.fill();
  c.strokeStyle=shade; c.lineWidth=0.6; c.stroke();

  // ── Layer 2: mid feather row ──────────────────────────────────────────
  const midFeathers=[
    [[-2,2],[-10,-4],[-22,-8],[-18,2]],
    [[-4,4],[-14,0],[-24,-2],[-18,6]],
    [[-6,5],[-16,4],[-24,6],[-16,10]],
  ];
  midFeathers.forEach(([p0,p1,p2,p3],i)=>{
    c.beginPath();
    c.moveTo(...p0);
    c.bezierCurveTo(...p1,...p2,...p3);
    c.lineTo(...p0); c.closePath();
    const gm=c.createLinearGradient(p2[0],p2[1],p0[0],p0[1]);
    gm.addColorStop(0,tip); gm.addColorStop(0.6,base); gm.addColorStop(1,'rgba(255,255,255,0.5)');
    c.fillStyle=gm; c.fill();
    c.strokeStyle=quill; c.lineWidth=0.5; c.stroke();
  });

  // ── Layer 3: primary flight feathers (bottom, pointed tips) ──────────
  const primaries=[
    {ox:-2, oy:3,  dx:-14, dy:16},
    {ox:-6, oy:5,  dx:-20, dy:18},
    {ox:-10,oy:6,  dx:-25, dy:16},
    {ox:-14,oy:6,  dx:-28, dy:12},
    {ox:-17,oy:4,  dx:-28, dy:7 },
  ];
  primaries.forEach(({ox,oy,dx,dy},i)=>{
    const w=4-i*0.3;
    c.beginPath();
    c.moveTo(ox,oy);
    c.bezierCurveTo(ox-4,oy+4, dx+3,dy-4, dx,dy);
    c.bezierCurveTo(dx-w*0.5,dy+1, ox-w,oy+3, ox,oy);
    c.closePath();
    const gp=c.createLinearGradient(ox,oy,dx,dy);
    gp.addColorStop(0,'rgba(255,255,255,0.9)');
    gp.addColorStop(0.4,base);
    gp.addColorStop(1,tip);
    c.fillStyle=gp; c.fill();
    c.strokeStyle=quill; c.lineWidth=0.5; c.stroke();
    // quill spine
    c.beginPath(); c.moveTo(ox,oy); c.lineTo(dx,dy);
    c.strokeStyle=quill; c.lineWidth=0.7; c.stroke();
  });

  // ── Wing root shading ─────────────────────────────────────────────────
  const gr=c.createRadialGradient(-2,1,0,-2,1,12);
  gr.addColorStop(0,'rgba(200,180,120,0.18)'); gr.addColorStop(1,'rgba(200,180,120,0)');
  c.fillStyle=gr; c.beginPath(); c.arc(-2,1,12,0,Math.PI*2); c.fill();

  c.restore();
}

/* ── SCRAMBLED EGG (on miss) ──────────────────────────────────────────── */
function drawScrambledEgg(sx, sy, angle){
  const c=ctx, r=EGG_R;
  c.save();
  c.translate(sx, sy);
  c.rotate(angle);

  // White splat — irregular blob
  c.save(); c.scale(1.4, 1.0);
  const wg=c.createRadialGradient(0,0,1,0,0,r*1.6);
  wg.addColorStop(0,'#fffef0'); wg.addColorStop(0.7,'#f5f0d0'); wg.addColorStop(1,'rgba(245,240,200,0)');
  c.fillStyle=wg;
  c.beginPath();
  // Irregular splat shape
  const pts=[[r*1.5,0],[r*1.2,-r*0.9],[0,-r*1.4],[-r*1.1,-r*0.8],
             [-r*1.6,0.2],[-r*0.9,r*1.1],[0,r*1.5],[r*1.0,r*1.0]];
  c.moveTo(pts[0][0],pts[0][1]);
  for(let i=0;i<pts.length;i++){
    const n=pts[(i+1)%pts.length];
    const mx=(pts[i][0]+n[0])/2, my=(pts[i][1]+n[1])/2;
    c.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);
  }
  c.closePath(); c.fill();
  c.restore();

  // Shell fragments (two curved shards)
  [[-0.3, -r*0.3, '#e8e0c0','#c8c0a0'],
   [ 0.4,  r*0.2, '#ede5c5','#cdc5a5']].forEach(([rot,ty,c1,c2])=>{
    c.save(); c.translate(0, ty); c.rotate(rot);
    const sg=c.createLinearGradient(-r*0.7,-r*0.5,r*0.7,r*0.5);
    sg.addColorStop(0,c1); sg.addColorStop(1,c2);
    c.fillStyle=sg;
    c.beginPath();
    c.moveTo(-r*0.7, 0);
    c.bezierCurveTo(-r*0.4,-r*0.9, r*0.4,-r*0.9, r*0.7, 0);
    c.bezierCurveTo( r*0.3, r*0.15,-r*0.3, r*0.15,-r*0.7, 0);
    c.closePath(); c.fill();
    // Crack line on shard
    c.strokeStyle='rgba(160,140,90,.5)'; c.lineWidth=0.8;
    c.beginPath(); c.moveTo(-r*0.2,-r*0.5); c.lineTo(r*0.1,-r*0.2); c.lineTo(-r*0.05,0); c.stroke();
    c.restore();
  });

  // Yolk — bright orange circle
  const yg=c.createRadialGradient(-r*0.15,-r*0.15,r*0.05,0,0,r*0.62);
  yg.addColorStop(0,'#ffe84a'); yg.addColorStop(0.6,'#f5a800'); yg.addColorStop(1,'#d07000');
  c.fillStyle=yg;
  c.beginPath(); c.arc(0, 0, r*0.62, 0, Math.PI*2); c.fill();
  // Yolk highlight
  c.fillStyle='rgba(255,255,180,.55)';
  c.beginPath(); c.arc(-r*0.18,-r*0.22, r*0.22, 0, Math.PI*2); c.fill();

  c.restore();
}

/* ── DRAW EGG ─────────────────────────────────────────────────────────── */
function drawEgg(sx,sy){
  const r=EGG_R;
  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(egg.angle);

  // Squish on landing
  let sX=1, sY=1;
  if(squishT>0){ const s=squishT/14; sX=1+s*.13; sY=1-s*.10; }

  const et=getEggType(level);
  const isAnimated=(et==='rainbow'||et==='cosmic');

  // Glow — use cached sprite for static types
  if(isAnimated){
    if(eggState==='flying'){
      const gw=ctx.createRadialGradient(0,0,r*.15,0,0,r*2.6);
      gw.addColorStop(0,eggGlowColor()); gw.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gw; ctx.beginPath(); ctx.arc(0,0,r*2.6,0,Math.PI*2); ctx.fill();
    } else {
      const gw=ctx.createRadialGradient(0,0,r*.3,0,0,r*1.6);
      gw.addColorStop(0,eggGlowColor()); gw.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gw; ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.fill();
    }
  } else {
    if(_eggBodyType!==et){ _eggBodySprite=_bakeEggBodySprite(et); _eggBodyType=et; }
    const gl=eggState==='flying'?_eggGlowFly:_eggGlowSit;
    if(gl) ctx.drawImage(gl.canvas,-gl.half,-gl.half);
  }

  // Egg oval body
  ctx.save();
  ctx.scale(sX, sY);

  if(isAnimated){
    // Animated egg types — must draw per frame
    ctx.scale(1, 1.26);
    const [c1,c2,c3,c4]=eggColors();
    const eg=ctx.createRadialGradient(-r*.25,-r*.30,0.8, r*.06,r*.08,r*1.02);
    eg.addColorStop(0,c1); eg.addColorStop(.25,c2); eg.addColorStop(.60,c3); eg.addColorStop(1,c4);
    ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    const ss=ctx.createRadialGradient(r*.08,r*.14,r*.22,r*.08,r*.14,r*.96);
    ss.addColorStop(0,'rgba(0,0,0,0)'); ss.addColorStop(.6,'rgba(0,0,0,.03)'); ss.addColorStop(1,'rgba(0,0,0,.18)');
    ctx.fillStyle=ss; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=1.4/1.26;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    const sp1=ctx.createRadialGradient(-r*.22,-r*.28,0,-r*.22,-r*.28,r*.30);
    sp1.addColorStop(0,'rgba(255,255,255,.92)'); sp1.addColorStop(.5,'rgba(255,255,255,.55)'); sp1.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sp1; ctx.beginPath(); ctx.arc(-r*.22,-r*.28,r*.30,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(-r*.06,-r*.50,r*.07,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.beginPath(); ctx.arc(r*.12,r*.50,r*.14,0,Math.PI*2); ctx.fill();
  } else if(_eggBodySprite) {
    // Static egg — single drawImage blit (no gradient creation)
    const sp=_eggBodySprite;
    ctx.drawImage(sp.canvas,-sp.w/2,-sp.h/2);
  }

  // Diamond sparkles (just arc fills, no gradients)
  if(et==='diamond'){
    ctx.scale(1,1.26);
    ['rgba(0,255,255,.85)','rgba(255,0,255,.70)','rgba(255,255,0,.75)'].forEach((dc,i)=>{
      const a=i*Math.PI*2/3+Date.now()*.003;
      ctx.fillStyle=dc; ctx.beginPath(); ctx.arc(Math.cos(a)*r*.40,Math.sin(a)*r*.30,2.5,0,Math.PI*2); ctx.fill();
    });
  }
  ctx.restore(); // undo scale
  ctx.restore(); // undo translate+rotate
}

function eggColors(){
  const t=Date.now();
  if(getEggType(level)==='rainbow'){
    const h=t/20%360;
    return [`hsl(${h},100%,92%)`,`hsl(${(h+30)%360},100%,70%)`,`hsl(${(h+60)%360},90%,50%)`,`hsl(${(h+90)%360},80%,30%)`];
  }
  if(getEggType(level)==='cosmic'){
    const h=t/8%360;
    return [`hsl(${h},100%,96%)`,`hsl(${(h+45)%360},100%,75%)`,`hsl(${(h+90)%360},100%,55%)`,`hsl(${(h+180)%360},100%,35%)`];
  }
  return ({
    white:   ['#ffffff','#f5f5f2','#dddbd4','#b0aea8'],
    bronze:  ['#faba6e','#d87e2c','#9a5010','#5a2802'],
    silver:  ['#f8f8ff','#c8c8d8','#9898b2','#606076'],
    gold:    ['#fffaaa','#ffd600','#c88000','#7a4600'],
    platinum:['#f0f5fc','#d0d8e8','#98aac0','#606e80'],
    diamond: ['#e6fcff','#aeecff','#44bef5','#1878c0']
  })[getEggType(level)]||['#fff','#f0ead0','#c0b898','#888068'];
}
function eggGlowColor(){
  if(getEggType(level)==='rainbow') return `rgba(255,128,255,.70)`;
  if(getEggType(level)==='cosmic')  return `rgba(200,100,255,.85)`;
  return ({white:'rgba(255,248,205,.26)',bronze:'rgba(215,128,48,.55)',silver:'rgba(198,198,255,.40)',
    gold:'rgba(255,215,0,.56)',platinum:'rgba(198,222,240,.44)',diamond:'rgba(0,244,255,.62)'})[getEggType(level)]||'rgba(255,255,255,.24)';
}
function eggTrailRGB(){
  if(getEggType(level)==='rainbow') return '255,128,255';
  if(getEggType(level)==='cosmic')  return '180,80,255';
  return ({white:'255,248,205',bronze:'215,128,48',silver:'195,195,228',
    gold:'255,215,0',platinum:'198,224,240',diamond:'0,226,255'})[getEggType(level)]||'255,248,205';
}

/* ── Hen intro ───────────────────────────────────────────────────────── */
function drawHen(hx, hy, t, flying){
  const c=ctx;
  c.save();
  c.translate(hx, hy);

  // Wings: slow gentle float when airborne, tiny idle sway when perched
  const wingAngle = flying
    ? Math.sin(t * 0.07) * 0.55   // slow soaring float
    : Math.sin(t * 0.10) * 0.10;  // barely-moving idle

  // Body
  c.save(); c.scale(1, 0.78);
  const bg=c.createRadialGradient(-4,-4,2,0,0,22);
  bg.addColorStop(0,'#d4621a'); bg.addColorStop(1,'#7a2c05');
  c.fillStyle=bg;
  c.beginPath(); c.ellipse(0,0,22,20,0,0,Math.PI*2); c.fill();
  c.restore();

  // Wing — pivots at shoulder point
  c.save();
  c.translate(-4, 2);
  c.rotate(wingAngle);
  c.beginPath();
  c.moveTo(0,0);
  c.bezierCurveTo(-20,-4,-28,8,-18,20);
  c.bezierCurveTo(-8,26,10,14,6,4);
  c.closePath();
  const wg=c.createLinearGradient(-28,0,6,20);
  wg.addColorStop(0,'#c8500e'); wg.addColorStop(1,'#5a1a02');
  c.fillStyle=wg; c.fill();
  c.restore();

  // Tail feathers
  [[-0.5,0.9],[-0.3,0.7],[0,0.55]].forEach(([ra,rb])=>{
    c.save(); c.rotate(ra);
    c.beginPath(); c.moveTo(16,-2);
    c.quadraticCurveTo(32+rb*8,-14,28,-20);
    c.quadraticCurveTo(22,-14,16,-2);
    c.fillStyle='#a03008'; c.fill();
    c.restore();
  });

  // Head
  c.save(); c.translate(-14,-14);
  const hg=c.createRadialGradient(-2,-2,1,0,0,10);
  hg.addColorStop(0,'#e07030'); hg.addColorStop(1,'#8a2c08');
  c.fillStyle=hg;
  c.beginPath(); c.ellipse(0,0,10,9,0,0,Math.PI*2); c.fill();
  // Comb
  c.fillStyle='#e02020';
  [[0,-10,4,5],[4,-9,3.5,5],[-4,-9,3.5,5]].forEach(([cx2,cy2,rx2,ry2])=>{
    c.beginPath(); c.ellipse(cx2,cy2,rx2,ry2,0,0,Math.PI*2); c.fill();
  });
  // Wattle
  c.fillStyle='#d01818';
  c.beginPath(); c.ellipse(3,5,3.5,5,0.3,0,Math.PI*2); c.fill();
  // Beak
  c.fillStyle='#e8a020';
  c.beginPath(); c.moveTo(8,-2); c.lineTo(16,0); c.lineTo(8,3); c.closePath(); c.fill();
  // Eye
  c.fillStyle='#111'; c.beginPath(); c.arc(3,-3,2.2,0,Math.PI*2); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(4,-4,0.9,0,Math.PI*2); c.fill();
  c.restore();

  c.restore();
}

function renderHenIntro(){
  if(!henAnim) return;
  const t=henAnim.t;
  const bowl=bowls[0];
  const bx=bowl.x+BOWL_W/2, by=bowl.y;

  // Timeline (200 frames total):
  //  0-50  : hen glides in from left and lands on bowl
  // 50-130 : hen crouches slowly, egg grows out from underneath
  // 130-200: hen gently rises upward with floating wings

  let hx, hy, flying=false;

  if(t < 50){
    const p=easeOut(t/50);
    hx = FL - 10 + (bx - FL + 10)*p;
    hy = by - 30;
  } else if(t < 130){
    const p=(t-50)/80;
    hx = bx;
    hy = by - 30 + p*10; // slow squat
  } else {
    flying=true;
    const p=easeOut((t-130)/70);
    hx = bx;
    hy = by - 20 - p*(by + 80); // smooth ascent off top of screen
  }

  // Egg: grows slowly from t=70 to t=130 (60 frames = 1 second)
  if(t >= 70 && t < 200){
    const ep=Math.min(1,(t-70)/60);
    const ey=by - 2;
    ctx.save();
    ctx.globalAlpha=Math.min(1, ep);
    ctx.save(); ctx.translate(bx, ey); ctx.scale(1, 1.28);
    const eg=ctx.createRadialGradient(-EGG_R*.25,-EGG_R*.3,1,0,0,EGG_R*ep);
    eg.addColorStop(0,'#fffdf8'); eg.addColorStop(1,'#d8caa8');
    ctx.fillStyle=eg;
    ctx.beginPath(); ctx.arc(0, 0, EGG_R*ep, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // Fade hen out in last 20 frames
  if(t > 180) ctx.globalAlpha=(200-t)/20;
  drawHen(hx, hy, t, flying);
  ctx.globalAlpha=1;
}

/* ── Aim arc ─────────────────────────────────────────────────────────── */
function drawAim(){
  const tb=bowls[tgtIdx]; if(!tb) return;
  const dy=tb.y-egg.y; if(dy>=0) return;
  const vy=-Math.sqrt(2*G*Math.abs(dy)*1.08), tUp=-vy/G, vx=(tb.x+BOWL_W/2-egg.x)/tUp;
  // 4 dots along arc — no setLineDash, no path, just 4 arc fills
  ctx.fillStyle='rgba(255,235,100,.28)';
  let px=egg.x,py=egg.y,pvx=vx,pvy=vy,step=tUp/5;
  for(let i=1;i<=4;i++){
    px+=pvx*step;py+=pvy*step;pvy+=G*step;
    if(py<0) break;
    ctx.beginPath();ctx.arc(px,py,2.5,0,Math.PI*2);ctx.fill();
  }
}

/* ── HUD ─────────────────────────────────────────────────────────────── */
let _hudFlashTimer=null;
function flashHUD(col,glow){
  const spans=document.querySelectorAll('#hud span');
  spans.forEach(s=>{s.style.color=col;s.style.textShadow=`0 0 12px ${glow},0 0 6px rgba(0,0,0,1),0 1px 3px rgba(0,0,0,1)`;});
  if(_hudFlashTimer) clearTimeout(_hudFlashTimer);
  _hudFlashTimer=setTimeout(()=>{
    spans.forEach(s=>{s.style.color='#ffffff';s.style.textShadow='0 0 6px rgba(0,0,0,1),0 1px 3px rgba(0,0,0,1),0 -1px 3px rgba(0,0,0,.8)';});
  },500);
}
function updateHUD(){
  document.getElementById('lvlTxt').textContent='LVL '+level;
  document.getElementById('scoreTxt').textContent=score.toLocaleString();
  document.getElementById('livesTxt').textContent='❤️'.repeat(Math.min(lives,10));
}
function showToast(m){
  const el=document.getElementById('toast');
  el.textContent=m; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',3200);
}

/* ── Boot ────────────────────────────────────────────────────────────── */
window.addEventListener('load',()=>{
  initCv();
  // Warm beige wood on menu
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#eeddb8'); g.addColorStop(1,'#c89e60');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(75,40,10,.28)'; ctx.lineWidth=.7;
  for(let y=8;y<H;y+=11){ctx.beginPath();ctx.moveTo(0,y);for(let x=0;x<=W;x+=32)ctx.lineTo(x,y+(Math.random()-.5)*1.8);ctx.stroke();}
  for(let y=54;y<H;y+=54){ctx.fillStyle='rgba(72,38,10,.30)';ctx.fillRect(0,y-1,W,2);}

  // Splash screen — show logo for 2.5s then fade out
  const splash=document.getElementById('splash');
  setTimeout(()=>{
    splash.style.opacity='0';
    setTimeout(()=>{ splash.style.display='none'; },650);
  },2500);
});
