<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Egg Climb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a0e04;overflow:hidden;touch-action:none;user-select:none;}
canvas{display:block;position:fixed;top:0;left:0;}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
/* Menu */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(12,7,2,.78);pointer-events:all;z-index:40;}
#menuBox{background:linear-gradient(155deg,#f5e8cc,#e8d4a8);
  border:3px solid #c8a050;border-radius:18px;padding:42px 30px;max-width:290px;
  width:88%;text-align:center;box-shadow:0 12px 55px rgba(0,0,0,.65);}
.mTitle{color:#5a2e08;font-size:2rem;font-weight:900;letter-spacing:3px;
  margin-bottom:6px;font-family:Georgia,serif;text-shadow:0 2px 6px rgba(0,0,0,.2);}
.mSub{color:#8a5828;font-size:.78rem;margin-bottom:10px;line-height:1.7;font-family:Georgia,serif;}
.mScore{color:#7a4018;font-size:.82rem;margin-bottom:22px;font-family:Georgia,serif;}
#playBtn{width:100%;padding:15px;background:linear-gradient(150deg,#8b4a18,#5a2c0a);
  color:#f8e090;border:2px solid #c87830;border-radius:12px;font-size:1.15rem;
  font-weight:800;cursor:pointer;letter-spacing:2px;font-family:Georgia,serif;
  box-shadow:0 5px 20px rgba(0,0,0,.4);pointer-events:all;}
#playBtn:active{transform:scale(.97);}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:none;pointer-events:none;
  justify-content:space-between;align-items:center;padding:10px 18px;
  background:rgba(0,0,0,.5);border-bottom:1px solid rgba(120,70,20,.3);z-index:20;}
#hud span{color:#d8a838;font-size:.88rem;font-weight:800;text-shadow:0 1px 4px #000;
  font-family:Georgia,serif;}
#scoreFx{position:fixed;pointer-events:none;z-index:25;text-align:center;
  font-size:1.1rem;font-weight:900;font-family:Georgia,serif;display:none;
  text-shadow:0 2px 8px rgba(0,0,0,.6);}
#themeLabel{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  color:rgba(200,160,70,.6);font-size:.66rem;pointer-events:none;z-index:20;
  text-shadow:0 1px 3px #000;letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif;}
/* Game over */
#gameover{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.82);z-index:40;pointer-events:all;}
#goBox{background:linear-gradient(155deg,#f5e8cc,#e8d4a8);border:2px solid #c8a050;
  border-radius:16px;padding:38px 28px;text-align:center;max-width:280px;}
#goBox h2{color:#6a2808;font-size:1.6rem;font-family:Georgia,serif;margin-bottom:8px;}
#goBox p{color:#7a4820;margin-bottom:6px;font-size:.88rem;font-family:Georgia,serif;}
#goBox .goScore{color:#4a8018;font-size:1.1rem;font-weight:700;margin-bottom:20px;font-family:Georgia,serif;}
#goBox button{padding:12px 28px;background:#6a3010;color:#f8e090;
  border:2px solid #c87830;border-radius:8px;font-size:.95rem;font-weight:800;
  cursor:pointer;font-family:Georgia,serif;margin:4px;}
/* Toast */
#toast{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);
  background:rgba(15,8,2,.92);color:#d8a838;padding:8px 22px;border-radius:20px;
  font-weight:700;font-size:.8rem;display:none;pointer-events:none;z-index:25;
  white-space:nowrap;border:1px solid rgba(160,90,30,.5);font-family:Georgia,serif;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div id="menuBox">
    <div class="mTitle">🥚 EGG CLIMB</div>
    <div class="mSub">Tap to toss the egg into the bowl.<br>Time it right — bowls keep moving!</div>
    <div class="mScore" id="menuHi"></div>
    <button id="playBtn" onclick="startGame()">▶ PLAY</button>
  </div>
</div>

<div id="hud">
  <span id="lvlTxt">LVL 1</span>
  <span id="scoreTxt">0</span>
  <span id="livesTxt">❤️❤️❤️</span>
</div>
<div id="themeLabel"></div>
<div id="scoreFx"></div>

<div id="gameover">
  <div id="goBox">
    <h2>💔 GAME OVER</h2>
    <p id="goMsg"></p>
    <p class="goScore" id="goScore"></p>
    <button onclick="startGame()">↺ Retry</button>
    <button onclick="showMenu()">☰ Menu</button>
  </div>
</div>
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   EGG CLIMB  ·  Authentic physics · Rotating egg · Rolling in bowl
   Half-egg visible · Beige wood · 3 moving bowls · Competitive scoring
   ═══════════════════════════════════════════════════════════════════════ */

/* ── Canvas / layout ──────────────────────────────────────────────────── */
let cv, ctx, W, H;
const BOWL_W=72, BOWL_H=34, EGG_R=16;
const G=0.26;          // slow gravity → big arcs
let FL, FW;            // field left, field width (narrow)
let YPOS;              // [bottom, mid, top] fixed Y for bowl rims

function initCv(){
  cv=document.getElementById('c');
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W; cv.height=H;
  ctx=cv.getContext('2d');
  FW=Math.round(W*0.58); FL=Math.round((W-FW)/2);
  YPOS=[Math.round(H*.76), Math.round(H*.48), Math.round(H*.21)];
}
window.addEventListener('resize',()=>{if(running){initCv();bgCache={};}});

/* ── Game state ───────────────────────────────────────────────────────── */
let running=false, animId, dying=false;
let level=1, lives=3, score=0, hiScore=0, combo=0;
let milestonesEarned=new Set();
const MILESTONES=[{l:25,v:1},{l:50,v:2},{l:100,v:3},{l:500,v:5},{l:1000,v:10},{l:2000,v:5},{l:5000,v:10}];

// 3 bowls always visible at YPOS[0..2]
let bowls=[], curIdx=0, tgtIdx=1;

/* ── Egg ─────────────────────────────────────────────────────────────── */
let egg={
  x:0, y:0,            // position (y = center of egg)
  vx:0, vy:0,
  angle:0,             // rotation (radians)
  angV:0,              // angular velocity
  offsetX:0,           // rolling offset from bowl center
  missed:false
};
// States: 'sitting' | 'flying' | 'approach' | 'rolling'
let eggState='sitting';

/* ── Slide animation ─────────────────────────────────────────────────── */
let slideAnim=null;   // {t, total, bgStart}

/* ── Hen intro animation ─────────────────────────────────────────────── */
let henAnim=null;     // {t} counts up; null = not playing

/* ── Background / FX ─────────────────────────────────────────────────── */
let bgOffset=0, bgCache={}, particles=[], curTheme='';
let scoreFxQueue=[];  // [{txt, col, x, y, life}]
let squishT=0;        // landing squish countdown

/* ── Speed helpers ───────────────────────────────────────────────────── */
const SPD_MULTS=[0.4, 0.55, 0.75, 0.95, 1.2, 1.55, 1.95, 2.4];
function randSpd(base){ return base*SPD_MULTS[Math.floor(Math.random()*SPD_MULTS.length)]; }
// Speed grows until L500 (cap 3.5), beyond that stays constant
function baseSpd(l){ return l<=5 ? 0.9 : Math.min(0.9+(l-5)*0.006, 3.5); }

function mkBowl(y, stat){
  const spd = stat ? 0 : randSpd(baseSpd(level));
  return{
    x: stat ? FL+FW/2-BOWL_W/2 : FL+Math.random()*(FW-BOWL_W),
    y, w:BOWL_W, h:BOWL_H,
    speed:spd, dir:Math.random()<.5?1:-1
  };
}

/* ── Egg sit position: center AT rim so bottom half is inside bowl ───── */
function seatY(b){ return b.y; }

/* ── Theme / egg ─────────────────────────────────────────────────────── */
function getTheme(l){
  if(l<25)   return 'beigewood';
  if(l<50)   return 'forest';
  if(l<100)  return 'flowers';
  if(l<200)  return 'mountains';
  if(l<250)  return 'clouds';
  if(l<275)  return 'fog';
  if(l<325)  return 'snow';
  if(l<400)  return 'rain';
  if(l<500)  return 'space';
  if(l<550)  return 'moon';
  // Planets cycle every 50 levels from 550 onwards; sun every 100, universe every 100
  const cycle=['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune','sun','universe'];
  return cycle[Math.floor((l-550)/50)%cycle.length];
}
const THEME_LABELS={
  beigewood:'🪵 Old Woodland',forest:'🌲 Forest',flowers:'🌸 Flower Fields',
  mountains:'⛰️ Mountains',clouds:'☁️ Above Clouds',fog:'🌫️ Foggy Valley',
  snow:'❄️ Snowfall',rain:'🌧️ Rainstorm',space:'🌌 Space Nebula',
  moon:'🌙 Moon',sun:'☀️ The Sun',universe:'🌌 Universe',
  mercury:'🪐 Mercury',venus:'🪐 Venus',earth:'🌍 Earth',mars:'🔴 Mars',
  jupiter:'🪐 Jupiter',saturn:'🪐 Saturn',uranus:'🪐 Uranus',neptune:'🔵 Neptune'
};
function getEggType(l){
  if(l>=5000) return 'cosmic';
  if(l>=2000) return 'rainbow';
  if(l>=1000) return 'diamond';
  if(l>=200)  return 'platinum';
  if(l>=100)  return 'gold';
  if(l>=50)   return 'silver';
  if(l>=25)   return 'bronze';
  return 'white';
}

/* ── Start ───────────────────────────────────────────────────────────── */
/* ── AUDIO ────────────────────────────────────────────────────────────── */
let _ac=null,_mgain=null,_mTimer=null;
function _getAC(){
  if(!_ac) _ac=new(window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==='suspended') _ac.resume();
  return _ac;
}
function _getMG(){
  if(!_mgain){_mgain=_getAC().createGain();_mgain.gain.value=0.36;_mgain.connect(_getAC().destination);}
  return _mgain;
}
function _n(freq,t0,dur,type,vol,dst){
  const a=_getAC(),o=a.createOscillator(),g=a.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.018);
  g.gain.setValueAtTime(vol,t0+Math.max(dur-0.05,0.01));
  g.gain.linearRampToValueAtTime(0,t0+dur);
  o.connect(g); g.connect(dst||a.destination);
  o.start(t0); o.stop(t0+dur+0.01);
}
// Smooth ambient loop — 24 beats @ 75bpm = 19.2s
const _B=60/75;
const _HZ={B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
           C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:784,A5:880};
// Gentle flowing melody (sine, slow sustained notes)
const _MEL=[
  [_HZ.E5,0,2.8],[_HZ.D5,3,1.8],[_HZ.C5,5,3.8],
  [_HZ.G5,9,2.8],[_HZ.F5,12,1.8],[_HZ.E5,14,3.8],
  [_HZ.D5,18,1.8],[_HZ.E5,20,1.2],[_HZ.C5,21.5,2.5],
];
// Soft harmony a third below melody
const _HARM=[
  [_HZ.C5,0,2.8],[_HZ.B4,3,1.8],[_HZ.A4,5,3.8],
  [_HZ.E5,9,2.8],[_HZ.D5,12,1.8],[_HZ.C5,14,3.8],
  [_HZ.B4,18,1.8],[_HZ.C5,20,1.2],[_HZ.A4,21.5,2.5],
];
// Gentle bass pulses
const _BASS=[
  [_HZ.C4,0,3.5],[_HZ.A3||_HZ.B3,4,3.5],[_HZ.F4,8,3.5],[_HZ.G4,12,3.5],
  [_HZ.C4,16,3.5],[_HZ.F4,20,4],
];
// Warm pad chords (stacked sine, long attack)
function _pad(freqs,t0,dur,vol){
  freqs.forEach(f=>{
    const a=_getAC(),o=a.createOscillator(),g=a.createGain(),mg=_getMG();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.4);
    g.gain.setValueAtTime(vol,t0+dur-0.5);
    g.gain.linearRampToValueAtTime(0,t0+dur);
    o.connect(g); g.connect(mg);
    o.start(t0); o.stop(t0+dur+0.01);
  });
}
function _schedMusic(){
  const now=_getAC().currentTime, mg=_getMG();
  // Melody and harmony — sine, soft attack
  _MEL.forEach(([f,b,d])=>_n(f,now+b*_B,d*_B,'sine',.13,mg));
  _HARM.forEach(([f,b,d])=>_n(f,now+b*_B,d*_B,'sine',.07,mg));
  // Bass — deep sine
  _BASS.forEach(([f,b,d])=>_n(f/2,now+b*_B,d*_B*.9,'sine',.07,mg));
  // Pad chords every 8 beats
  [[_HZ.C4,_HZ.E4,_HZ.G4],[_HZ.F4,_HZ.A4,_HZ.C5],
   [_HZ.G4,_HZ.B4,_HZ.D5],[_HZ.C4,_HZ.E4,_HZ.G4]].forEach((ch,i)=>{
    _pad(ch, now+i*6*_B, 6*_B*.95, .04);
  });
  _mTimer=setTimeout(_schedMusic,24*_B*1000-120);
}
function startMusic(){if(!_mTimer) _schedMusic();}
function stopMusic(){if(_mTimer){clearTimeout(_mTimer);_mTimer=null;}}

function sfxTap(){
  const a=_getAC(),o=a.createOscillator(),g=a.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(500,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(950,a.currentTime+0.07);
  g.gain.setValueAtTime(0.22,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.13);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+0.14);
}
function sfxLand(){
  const a=_getAC();
  [[240,.8],[160,.5],[100,.3]].forEach(([f,v])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*.42,a.currentTime+0.22);
    g.gain.setValueAtTime(v*.48,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.28);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+0.3);
  });
}
function sfxMiss(){
  const a=_getAC();
  [[440,0],[300,.12],[180,.24]].forEach(([f,t])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(f,a.currentTime+t);
    o.frequency.exponentialRampToValueAtTime(f*.45,a.currentTime+t+.12);
    g.gain.setValueAtTime(.17,a.currentTime+t);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+t+.15);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime+t); o.stop(a.currentTime+t+.17);
  });
}

function startGame(){
  initCv();
  if(score>hiScore) hiScore=score;
  level=1; lives=3; score=0; combo=0;
  milestonesEarned=new Set();
  bgOffset=0; bgCache={}; particles=[]; curTheme='';
  slideAnim=null; squishT=0; scoreFxQueue=[];

  document.getElementById('menu').style.display='none';
  document.getElementById('gameover').style.display='none';
  document.getElementById('hud').style.display='flex';
  stopMusic(); startMusic();

  bowls=[
    mkBowl(YPOS[0], true),
    mkBowl(YPOS[1], true),   // stationary until level > 10
    mkBowl(YPOS[2], true),   // stationary until level > 10
  ];
  curIdx=0; tgtIdx=1;

  egg.x=bowls[0].x+BOWL_W/2; egg.y=seatY(bowls[0]);
  egg.vx=0; egg.vy=0; egg.angle=0; egg.angV=0;
  egg.offsetX=0; egg.missed=false;
  eggState='intro';   // blocked until hen anim completes
  dying=false;
  henAnim={t:0};

  running=true;
  if(animId) cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
  updateHUD(); themeCheck(true);
}
function showMenu(){
  running=false; cancelAnimationFrame(animId);
  if(score>hiScore) hiScore=score;
  document.getElementById('menuHi').textContent=hiScore>0?'Best: '+hiScore:'';
  document.getElementById('gameover').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('menu').style.display='flex';
}

/* ── Main loop ───────────────────────────────────────────────────────── */
function loop(){ if(!running)return; try{update();render();}catch(e){console.error(e);} animId=requestAnimationFrame(loop); }

/* ── Update ──────────────────────────────────────────────────────────── */
function update(){
  squishT=Math.max(0,squishT-1);
  updateParticles();
  updateScoreFx();

  // ── Hen intro animation ──
  if(henAnim){
    henAnim.t++;
    if(henAnim.t>=200){ henAnim=null; eggState='sitting'; }
    return; // freeze game during intro
  }

  // ── Slide animation ──
  if(slideAnim){
    slideAnim.t++;
    const p=easeOut(slideAnim.t/slideAnim.total);
    bowls[0].y=YPOS[0]+p*(H*.25);
    bowls[1].y=YPOS[1]+p*(YPOS[0]-YPOS[1]);
    bowls[2].y=YPOS[2]+p*(YPOS[1]-YPOS[2]);
    // egg rides on curIdx bowl (was bowl[2] when top caught)
    const rb=bowls[curIdx];
    egg.y=rb.y; egg.x=rb.x+BOWL_W/2+egg.offsetX;
    bgOffset=slideAnim.bgStart+p*(YPOS[1]-YPOS[2]);
    if(slideAnim.t>=slideAnim.total) finishSlide();
    return;
  }

  // ── All bowls move ──
  bowls.forEach(b=>{
    if(!b.speed) return;
    b.x+=b.speed*b.dir;
    if(b.x+b.w>FL+FW){b.x=FL+FW-b.w;b.dir=-1;}
    if(b.x<FL){b.x=FL;b.dir=1;}
  });

  // ── States ──
  if(eggState==='sitting'){
    const cb=bowls[curIdx];
    egg.x=cb.x+BOWL_W/2;
    egg.y=seatY(cb);
    // Idle gentle sway
    egg.angle=Math.sin(Date.now()*.0018)*0.04;
    egg.angV=0;
  }

  else if(eggState==='flying'){
    const tb=bowls[tgtIdx];

    // Pure physics — no deceleration
    egg.vy+=G;
    egg.x+=egg.vx; egg.y+=egg.vy;
    egg.angle+=egg.angV;

    // Field wall bounce
    if(egg.x-EGG_R<FL){egg.x=FL+EGG_R;egg.vx=Math.abs(egg.vx)*0.45;}
    if(egg.x+EGG_R>FL+FW){egg.x=FL+FW-EGG_R;egg.vx=-Math.abs(egg.vx)*0.45;}

    // ── Catch: egg falling into bowl ──
    const catchW=tb.w-14;
    const catchL=tb.x+7;
    const inX=egg.x>=catchL && egg.x<=catchL+catchW;
    const inY=egg.y+EGG_R>=tb.y-4 && egg.y-EGG_R<=tb.y+tb.h*.5;
    if(inX && inY && egg.vy>0){ catchBowl(); return; }

    // ── Miss: fell past bowl while descending ──
    if(!egg.missed && egg.vy>0 && egg.y>tb.y+tb.h+16){
      egg.missed=true;
      egg.vx+=(Math.random()-0.5)*3;
      egg.angV=egg.vx*0.12;
      onMiss();
    }

    if(egg.missed){
      if(egg.y>H+60){
        const cb=bowls[curIdx];
        egg.x=cb.x+BOWL_W/2; egg.y=seatY(cb);
        egg.vx=0; egg.vy=0; egg.angV=0; egg.angle=0;
        egg.missed=false;
        eggState='sitting';
      }
      return;
    }
  }

  else if(eggState==='rolling'){
    const cb=bowls[curIdx];
    // Egg rolls to center of current bowl
    egg.offsetX*=0.82;
    egg.angV=egg.offsetX*0.038;
    egg.angle+=egg.angV;
    egg.x=cb.x+BOWL_W/2+egg.offsetX;
    egg.y=seatY(cb);

    if(Math.abs(egg.offsetX)<0.5){
      egg.offsetX=0; egg.angle=0;
      eggState='sitting';
      if(tgtIdx>2) startSlide();
    }
  }
}

function easeOut(t){return 1-(1-t)*(1-t)*(1-t);}

/* ── Catch ───────────────────────────────────────────────────────────── */
function catchBowl(){
  sfxLand();
  const tb=bowls[tgtIdx];
  const cx=tb.x+BOWL_W/2;
  const off=Math.abs(egg.x-cx)/(BOWL_W/2-7);  // 0=center,1=edge
  combo++;
  let pts, label, col;
  if(off<=0.25){pts=150;label='PERFECT ✦';col='#7af08a';}
  else if(off<=0.60){pts=80;label='GOOD ✓';col='#ffe46a';}
  else{pts=30;label='NICE';col='#f8c858';}
  const earned=pts*combo;
  score+=earned;
  hiScore=Math.max(hiScore,score);
  // Score fly-up FX
  addScoreFx((combo>1?'×'+combo+' ':'')+label+' +'+earned, col, W/2, tb.y-45);
  if(combo>=3) addScoreFx('COMBO ×'+combo+'!','#ff9a40',W/2,tb.y-75);

  egg.x=cx; egg.y=seatY(tb);
  egg.offsetX=egg.x-(tb.x+BOWL_W/2)+( egg.vx*2); // inertia into roll
  egg.vx=0; egg.vy=0;
  squishT=14; eggState='rolling';
  curIdx=tgtIdx; tgtIdx++;
  updateHUD();
}

/* ── Slide (top bowl caught → shift everything down) ─────────────────── */
function startSlide(){
  slideAnim={t:0, total:52, bgStart:bgOffset};
}
function finishSlide(){
  const nextL=level+1;
  let b1moves,b2moves;
  if(nextL<=2){       b1moves=false; b2moves=false; }
  else if(nextL<=11){ b1moves=false; b2moves=true;  }
  else{
    // Random mix: both still / top only / both move (weighted toward harder)
    const r=Math.random();
    if(r<0.15){      b1moves=false; b2moves=false; } // 15% — breather
    else if(r<0.45){ b1moves=false; b2moves=true;  } // 30% — top only
    else{            b1moves=true;  b2moves=true;  } // 55% — both move
  }
  const b0={...bowls[1],y:YPOS[0],speed:0,x:FL+FW/2-BOWL_W/2}; // always stationary
  const b1spd=b1moves?randSpd(baseSpd(nextL)):0;
  const b1x=b1moves?bowls[2].x:FL+FW/2-BOWL_W/2;
  const b1={...bowls[2],y:YPOS[1],speed:b1spd,x:b1x};
  const b2=mkBowl(YPOS[2],!b2moves);
  bowls=[b0,b1,b2];
  curIdx=1; tgtIdx=2;
  egg.y=seatY(bowls[1]); egg.x=bowls[1].x+BOWL_W/2;
  egg.offsetX=0; egg.angV=0;
  eggState='sitting'; slideAnim=null;
  level++; checkMilestones(); updateHUD(); themeCheck(false);
}

/* ── Miss / death ────────────────────────────────────────────────────── */
function onMiss(){
  sfxMiss();
  lives--; combo=0; updateHUD();
  // Guard: tgtIdx may be 3 after top-bowl catch sequence, use mid-Y as fallback
  const missY = bowls[tgtIdx] ? bowls[tgtIdx].y-40 : H*0.4;
  addScoreFx('MISSED','#ff4444',W/2,missY);
  if(lives<=0){
    dying=true; // prevent further taps immediately
    setTimeout(()=>{
      stopMusic();
      if(score>hiScore) hiScore=score;
      document.getElementById('goMsg').textContent='Reached Level '+level;
      document.getElementById('goScore').textContent='Score: '+score+(hiScore>0?' · Best: '+hiScore:'');
      document.getElementById('gameover').style.display='flex';
      running=false;
    },900);
  }
}

/* ── Milestones ──────────────────────────────────────────────────────── */
function checkMilestones(){
  for(const m of MILESTONES){
    if(level>=m.l&&!milestonesEarned.has(m.l)){
      milestonesEarned.add(m.l);
      lives=Math.min(lives+m.v,10);
      showToast('+'+m.v+' '+(m.v>1?'Lives':'Life')+'! Level '+m.l+' Bonus 🎉');
      updateHUD();
    }
  }
}
function themeCheck(force){
  const t=getTheme(level);
  if(t!==curTheme||force){
    curTheme=t;
    document.getElementById('themeLabel').textContent=THEME_LABELS[t]||t;
    spawnParticles(t);
    if(!bgCache[t]) bgCache[t]=makeBg(t);
  }
}

/* ── Input ───────────────────────────────────────────────────────────── */
document.addEventListener('touchstart',e=>{e.preventDefault();if(running)tap();},{passive:false});
document.addEventListener('mousedown',()=>{if(running)tap();});
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&running){e.preventDefault();tap();}});

function tap(){
  if(eggState!=='sitting'||slideAnim||dying||henAnim) return;
  const tb=bowls[tgtIdx]; if(!tb) return;
  const dy=tb.y-egg.y; if(dy>=0) return;
  // Arc ABOVE bowl — egg goes straight up, bowl must be aligned at landing
  const OVERSHOOT=90;
  const peakY=tb.y-OVERSHOOT;
  const peakDy=peakY-egg.y;
  const vy=-Math.sqrt(2*G*Math.abs(peakDy));
  egg.vx=0;          // straight up — player must time tap for alignment
  egg.vy=vy;
  egg.angV=0.04;     // small aesthetic spin
  egg.missed=false;
  eggState='flying';
  sfxTap();
}

/* ── Score FX ────────────────────────────────────────────────────────── */
function addScoreFx(txt,col,x,y){
  scoreFxQueue.push({txt,col,x,y,life:52,vy:-0.9});
}
function updateScoreFx(){
  scoreFxQueue.forEach(f=>{f.y+=f.vy;f.life--;});
  scoreFxQueue=scoreFxQueue.filter(f=>f.life>0);
}

/* ── Particles ───────────────────────────────────────────────────────── */
function spawnParticles(t){
  particles=[];
  if(t==='snow') for(let i=0;i<60;i++) particles.push({x:Math.random()*W,y:Math.random()*H,r:1.2+Math.random()*2.2,sy:.55+Math.random()*1.1,sx:(Math.random()-.5)*.38});
  if(t==='rain') for(let i=0;i<90;i++) particles.push({x:Math.random()*W,y:Math.random()*H,l:9+Math.random()*9,sy:9+Math.random()*6});
  if(t==='fog')  for(let i=0;i<14;i++) particles.push({x:Math.random()*W,y:Math.random()*H,r:50+Math.random()*85,a:.04+Math.random()*.05,sx:.35+Math.random()*.38});
}
function updateParticles(){
  if(curTheme==='snow') particles.forEach(p=>{p.y+=p.sy;p.x+=p.sx;if(p.y>H)p.y=-4;if(p.x>W)p.x=0;if(p.x<0)p.x=W;});
  if(curTheme==='rain') particles.forEach(p=>{p.y+=p.sy;p.x-=1.6;if(p.y>H){p.y=-p.l;p.x=Math.random()*W;}});
  if(curTheme==='fog')  particles.forEach(p=>{p.x+=p.sx;if(p.x>W+p.r)p.x=-p.r;});
}

/* ── Background maker ────────────────────────────────────────────────── */
function makeBg(theme){
  const bc=document.createElement('canvas'); bc.width=W; bc.height=H*3;
  const bx=bc.getContext('2d'); const w=bc.width,h=bc.height;
  const gfill=(a,b)=>{const g=bx.createLinearGradient(0,0,0,h);g.addColorStop(0,a);g.addColorStop(1,b);bx.fillStyle=g;bx.fillRect(0,0,w,h);};

  if(theme==='beigewood'){
    // Warm beige antique wood — planks in honey/amber tones
    gfill('#f0e2be','#d4b87a');
    const plH=54;
    for(let y=0;y<h;y+=plH){
      // Each plank a slightly different warm tone
      const hue=30+Math.random()*18, sat=35+Math.random()*20, lig=62+Math.random()*12;
      bx.fillStyle=`hsla(${hue},${sat}%,${lig}%,0.18)`;
      bx.fillRect(0,y,w,plH);

      // Horizontal wood grain — many thin lines, varying opacity
      for(let g=0;g<22;g++){
        const gy=y+g*(plH/22);
        const dark=Math.random()<0.35;
        bx.strokeStyle=dark?`rgba(90,52,18,${.07+Math.random()*.09})`:`rgba(60,35,10,${.03+Math.random()*.05})`;
        bx.lineWidth=dark?0.8:0.5;
        bx.beginPath(); bx.moveTo(0,gy);
        for(let x=0;x<=w;x+=28) bx.lineTo(x,gy+(Math.random()-.5)*1.8);
        bx.stroke();
      }
      // Age streaks (darker)
      if(Math.random()<0.5){
        const sy2=y+Math.random()*plH;
        bx.strokeStyle=`rgba(70,38,10,${.08+Math.random()*.10})`;
        bx.lineWidth=1.2+Math.random()*1.5;
        bx.beginPath(); bx.moveTo(0,sy2);
        for(let x=0;x<=w;x+=38) bx.lineTo(x,sy2+(Math.random()-.5)*3.5);
        bx.stroke();
      }
      // Knots
      if(Math.random()<0.32){
        const kx=Math.random()*w, ky=y+plH*.5, kr=7+Math.random()*13;
        for(let ring=3;ring>=0;ring--){
          const kg=bx.createRadialGradient(kx,ky,ring,kx,ky,kr+ring*3.5);
          kg.addColorStop(0,`rgba(80,42,10,${.22-ring*.04})`);
          kg.addColorStop(.7,`rgba(100,58,18,${.08-ring*.015})`);
          kg.addColorStop(1,'rgba(0,0,0,0)');
          bx.fillStyle=kg; bx.fillRect(kx-kr-ring*4,ky-kr-ring*4,(kr+ring*4)*2,(kr+ring*4)*2);
        }
      }
      // Plank separator seam
      bx.fillStyle='rgba(80,42,10,.32)'; bx.fillRect(0,y,w,2);
    }
    // Vertical seams
    let vx=FL;
    while(vx<FL+FW){
      bx.fillStyle='rgba(75,40,10,.25)'; bx.fillRect(vx-1,0,2,h);
      vx+=Math.round(FW/3+Math.random()*FW*.3);
    }
    // Very subtle light sheen (aged varnish)
    const shine=bx.createLinearGradient(0,0,w,0);
    shine.addColorStop(0,'rgba(255,230,160,.06)'); shine.addColorStop(.5,'rgba(255,240,180,.12)'); shine.addColorStop(1,'rgba(255,230,160,.06)');
    bx.fillStyle=shine; bx.fillRect(0,0,w,h);
    // Vignette
    const vl=bx.createLinearGradient(0,0,w*.2,0); vl.addColorStop(0,'rgba(30,12,2,.42)'); vl.addColorStop(1,'rgba(0,0,0,0)'); bx.fillStyle=vl; bx.fillRect(0,0,w*.2,h);
    const vr=bx.createLinearGradient(w*.8,0,w,0); vr.addColorStop(0,'rgba(0,0,0,0)'); vr.addColorStop(1,'rgba(30,12,2,.42)'); bx.fillStyle=vr; bx.fillRect(w*.8,0,w*.2,h);
  }
  else if(theme==='forest'){
    gfill('#071206','#0e2008');
    for(let i=0;i<14;i++){const tx=w*i/13,ty=h*.14+Math.random()*h*.18,th=h*.26+Math.random()*h*.14;bx.fillStyle=`hsl(${114+Math.random()*32},${36+Math.random()*20}%,${11+Math.random()*11}%)`;bx.beginPath();bx.moveTo(tx,ty);bx.lineTo(tx-30,ty+th);bx.lineTo(tx+30,ty+th);bx.closePath();bx.fill();bx.fillStyle='#1c0c04';bx.fillRect(tx-5,ty+th,10,h*.05);}
    bx.fillStyle='#0b1806';bx.fillRect(0,h*.86,w,h*.14);
  }
  else if(theme==='flowers'){
    gfill('#ffc0e4','#ffa8dc');
    bClouds(bx,w,h,'rgba(255,255,255,.50)');
    bx.fillStyle='#56a025';bx.fillRect(0,h*.76,w,h*.24);
    const fc=['#ff1870','#ff6500','#ffca00','#bb1efc','#ff0840','#1ec8ff'];
    for(let i=0;i<130;i++){const fx=Math.random()*w,fy=h*.77+Math.random()*h*.22,c=fc[i%fc.length];bx.fillStyle='#1e6808';bx.fillRect(fx-1,fy-12,2,14);bx.fillStyle=c;for(let p=0;p<5;p++){const a=p*Math.PI*2/5;bx.beginPath();bx.arc(fx+Math.cos(a)*5,fy-14+Math.sin(a)*5,4.5,0,Math.PI*2);bx.fill();}bx.fillStyle='#ffca30';bx.beginPath();bx.arc(fx,fy-14,3,0,Math.PI*2);bx.fill();}
  }
  else if(theme==='mountains'){gfill('#f04e14','#f09a28');[[h*.58,'#3e2614'],[h*.42,'#2e1c0e'],[h*.30,'#4c3824']].forEach(([my,c])=>{bx.fillStyle=c;bx.beginPath();bx.moveTo(0,h);for(let x=0;x<=w;x+=w/6)bx.lineTo(x,my-Math.random()*h*.10);bx.lineTo(w,h);bx.closePath();bx.fill();});bx.fillStyle='rgba(255,255,255,.62)';[[w*.18,h*.30,w*.06,h*.08],[w*.64,h*.22,w*.07,h*.09]].forEach(([px,py,pw,ph])=>{bx.beginPath();bx.moveTo(px,py);bx.lineTo(px+pw,py+ph);bx.lineTo(px-pw,py+ph);bx.closePath();bx.fill();});}
  else if(theme==='clouds'){gfill('#9cc6e6','#c6e2f5');for(let i=0;i<26;i++){const cx=Math.random()*w,cy=Math.random()*h,cw=56+Math.random()*115,ch=22+Math.random()*42;bx.fillStyle=`rgba(255,255,255,${.26+Math.random()*.52})`;bx.beginPath();bx.ellipse(cx,cy,cw/2,ch/2,0,0,Math.PI*2);bx.fill();bx.beginPath();bx.ellipse(cx-cw*.18,cy+5,cw*.28,ch*.34,0,0,Math.PI*2);bx.fill();bx.beginPath();bx.ellipse(cx+cw*.18,cy+5,cw*.28,ch*.34,0,0,Math.PI*2);bx.fill();}}
  else if(theme==='fog'){gfill('#869298','#9eb0b8');for(let i=0;i<12;i++){const fg=bx.createRadialGradient(w/2,h*i/11,0,w/2,h*i/11,w*.58);fg.addColorStop(0,`rgba(186,198,208,${.08+Math.random()*.07})`);fg.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=fg;bx.fillRect(0,0,w,h);}}
  else if(theme==='snow'){gfill('#b6c6d6','#dce8f4');bx.fillStyle='rgba(255,255,255,.86)';bx.beginPath();bx.moveTo(0,h);bx.quadraticCurveTo(w*.25,h*.82,w*.5,h*.86);bx.quadraticCurveTo(w*.78,h*.90,w,h*.84);bx.lineTo(w,h);bx.closePath();bx.fill();}
  else if(theme==='rain'){gfill('#0c1826','#182434');bx.fillStyle='rgba(26,34,46,.86)';for(let i=0;i<7;i++){bx.beginPath();bx.ellipse(w*i/6,h*.08,54+Math.random()*33,16,0,0,Math.PI*2);bx.fill();}}
  else if(theme==='space'){gfill('#020006','#040012');bStars(bx,w,h,155);[['rgba(100,0,180,.12)',w*.3,h*.3],['rgba(0,65,175,.10)',w*.7,h*.6],['rgba(175,0,55,.08)',w*.2,h*.7]].forEach(([c,nx,ny])=>{const g=bx.createRadialGradient(nx,ny,0,nx,ny,w*.52);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=g;bx.fillRect(0,0,w,h);});}
  else if(theme==='moon'){gfill('#050a10','#0a1416');bStars(bx,w,h,120);const eg=bx.createRadialGradient(w*.15,h*.09,0,w*.15,h*.09,34);eg.addColorStop(0,'#1466b8');eg.addColorStop(.4,'#145c12');eg.addColorStop(1,'#073280');bx.fillStyle=eg;bx.beginPath();bx.arc(w*.15,h*.09,34,0,Math.PI*2);bx.fill();bx.fillStyle='#888a8e';bx.fillRect(0,h*.84,w,h*.16);}
  else if(theme==='sun'){gfill('#f01600','#f05800');for(let i=0;i<6;i++){const sg=bx.createRadialGradient(w*.5,h*.08,10,w*.5,h*.08,w*(.28+i*.09));sg.addColorStop(0,`rgba(255,${118-i*18},0,.17)`);sg.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=sg;bx.fillRect(0,0,w,h);}}
  else if(theme==='universe'){gfill('#000002','#000009');bStars(bx,w,h,235);[['rgba(148,68,255,.12)',w*.2,h*.2],['rgba(38,128,255,.10)',w*.76,h*.56],['rgba(255,58,128,.08)',w*.42,h*.8],['rgba(0,178,132,.09)',w*.85,h*.28]].forEach(([c,nx,ny])=>{const g=bx.createRadialGradient(nx,ny,0,nx,ny,85);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');bx.fillStyle=g;bx.fillRect(0,0,w,h);});}
  else{
    const pd={mercury:['#141414','#222222'],venus:['#bc5e12','#da801c'],earth:['#144caa','#206ec5'],mars:['#7c1c00','#b63214'],jupiter:['#bc6a28','#d89635'],saturn:['#ac8635','#d0a64e'],uranus:['#30a6bc','#4accd8'],neptune:['#0a1650','#1230a8']};
    const d=pd[theme]||['#111','#222']; gfill(d[0],d[1]);
    if(theme==='jupiter'){['#904618','#c47624','#904618','#b66820'].forEach((s,i)=>{bx.fillStyle=s;bx.fillRect(0,h*i/4,w,h/4+1);});}
    if(theme==='saturn'){bx.strokeStyle='rgba(176,152,65,.44)';bx.lineWidth=9;bx.beginPath();bx.moveTo(0,h*.30);bx.bezierCurveTo(w*.28,h*.20,w*.72,h*.20,w,h*.30);bx.stroke();}
    if(theme==='earth'){bx.fillStyle='rgba(14,58,145,.5)';bx.fillRect(0,h*.62,w,h*.12);bClouds(bx,w,h,'rgba(255,255,255,.36)');}
    bStars(bx,w,h,22);
  }
  return bc;
}
function bClouds(bx,w,h,col){for(let i=0;i<6;i++){const cx=Math.random()*w,cy=h*(.04+Math.random()*.18),cw=44+Math.random()*78;bx.fillStyle=col;bx.beginPath();bx.ellipse(cx,cy,cw/2,10,0,0,Math.PI*2);bx.fill();bx.beginPath();bx.ellipse(cx-cw*.17,cy+5,cw*.26,7,0,0,Math.PI*2);bx.fill();bx.beginPath();bx.ellipse(cx+cw*.17,cy+5,cw*.26,7,0,0,Math.PI*2);bx.fill();}}
function bStars(bx,w,h,n){for(let i=0;i<n;i++){bx.fillStyle=`rgba(255,255,255,${.14+Math.random()*.86})`;bx.beginPath();bx.arc(Math.random()*w,Math.random()*h,.3+Math.random()*1.4,0,Math.PI*2);bx.fill();}}

/* ── Render ──────────────────────────────────────────────────────────── */
function render(){
  if(!ctx) return;
  ctx.clearRect(0,0,W,H);

  // Background
  const t=getTheme(level);
  if(!bgCache[t]) bgCache[t]=makeBg(t);
  const bg=bgCache[t]; const bh=bg.height;
  const off=((bgOffset%bh)+bh)%bh;
  ctx.drawImage(bg,0,-off);
  if(off>bh-H) ctx.drawImage(bg,0,-off+bh);

  // Side vignette (narrow field feel)
  const lv=ctx.createLinearGradient(0,0,FL,0); lv.addColorStop(0,'rgba(0,0,0,.58)'); lv.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=lv; ctx.fillRect(0,0,FL,H);
  const rv=ctx.createLinearGradient(FL+FW,0,W,0); rv.addColorStop(0,'rgba(0,0,0,0)'); rv.addColorStop(1,'rgba(0,0,0,.58)'); ctx.fillStyle=rv; ctx.fillRect(FL+FW,0,W-FL-FW,H);

  // Particles
  renderParticles();

  // ── Bowl bodies (behind egg) ──
  bowls.forEach((b,i)=>drawBowlBody(b,i===tgtIdx));

  // ── Aim arc ──
  if(eggState==='sitting'&&!slideAnim) drawAim();

  // ── Bowl rim BACK arc (behind egg) — top half of ellipse ──
  bowls.forEach((b,i)=>drawBowlRimArc(b,i===tgtIdx,false));

  // ── Hen intro (replaces egg during intro) ──
  if(henAnim){ renderHenIntro(); }

  // ── EGG (hidden during intro) ──
  if(!henAnim&&(eggState==='sitting'||eggState==='rolling')){
    // Clip to above bowl rim so only top half of egg is visible
    const cb=bowls[curIdx];
    ctx.save();
    ctx.beginPath();
    ctx.rect(0,0,W,cb.y+1);
    ctx.clip();
    drawEgg(egg.x,egg.y);
    ctx.restore();
  } else if(!henAnim){
    if(egg.missed && egg.y > H - 55){
      // Splat on the floor — squish flat and stay put
      const splat=Math.min(1,(egg.y-(H-55))/40);
      ctx.save();
      ctx.translate(egg.x, H-18);
      ctx.scale(1+splat*0.8, 1-splat*0.7);
      drawScrambledEgg(0, 0, egg.angle);
      ctx.restore();
    } else {
      drawEgg(egg.x, egg.y);
    }
  }

  // ── Bowl rim FRONT arc (in front of egg) — bottom half of ellipse ──
  bowls.forEach((b,i)=>drawBowlRimArc(b,i===tgtIdx,true));

  // ── Score FX ──
  ctx.save();
  scoreFxQueue.forEach(f=>{
    ctx.globalAlpha=Math.min(1,f.life/20);
    ctx.font='bold 20px Georgia'; ctx.textAlign='center';
    ctx.fillStyle=f.col; ctx.shadowColor=f.col; ctx.shadowBlur=12;
    ctx.fillText(f.txt,f.x,f.y);
  });
  ctx.shadowBlur=0; ctx.restore();

  // ── Combo display ──
  if(combo>=2){
    ctx.save(); ctx.font='bold 15px Georgia'; ctx.textAlign='right';
    ctx.fillStyle='rgba(255,200,80,.82)'; ctx.shadowColor='rgba(255,150,0,.5)'; ctx.shadowBlur=8;
    ctx.fillText('COMBO ×'+combo,FL+FW-8,bowls[tgtIdx]?bowls[tgtIdx].y-12:H*.18);
    ctx.shadowBlur=0; ctx.restore();
  }
}

function renderParticles(){
  if(curTheme==='snow'){ctx.fillStyle='rgba(255,255,255,.88)';particles.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});}
  if(curTheme==='rain'){ctx.strokeStyle='rgba(130,175,220,.50)';ctx.lineWidth=1;particles.forEach(p=>{ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-1.6,p.y+p.l);ctx.stroke();});}
  if(curTheme==='fog'){particles.forEach(p=>{ctx.fillStyle=`rgba(170,184,194,${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});}
}

/* ── BOWL BODY (dark wood, drawn behind egg) ─────────────────────────── */
function drawBowlBody(b,isTarget){
  const{x,y,w,h}=b, cx=x+w/2;
  ctx.save();
  if(isTarget){
    const p=.45+.55*Math.sin(Date.now()*.008);
    ctx.shadowColor=`rgba(255,208,48,${p})`; ctx.shadowBlur=26;
  }
  // Bowl shape
  ctx.beginPath();
  ctx.moveTo(x+7,y); ctx.lineTo(x+w-7,y);
  ctx.quadraticCurveTo(x+w+w*.11,y+h*.62,cx,y+h);
  ctx.quadraticCurveTo(x-w*.11,y+h*.62,x+7,y);
  ctx.closePath();
  const bg=ctx.createLinearGradient(x,y,cx,y+h);
  bg.addColorStop(0,'#4a2205');
  bg.addColorStop(.25,'#301602');
  bg.addColorStop(.6,'#1c0c01');
  bg.addColorStop(1,'#0e0600');
  ctx.fillStyle=bg; ctx.fill();
  // Inner depth gradient
  const ig=ctx.createRadialGradient(cx,y+h*.3,2,cx,y+h*.3,w*.44);
  ig.addColorStop(0,'rgba(82,40,10,.18)'); ig.addColorStop(.55,'rgba(8,3,0,.42)'); ig.addColorStop(1,'rgba(0,0,0,.68)');
  ctx.fillStyle=ig;
  ctx.beginPath();
  ctx.moveTo(x+7,y); ctx.lineTo(x+w-7,y);
  ctx.quadraticCurveTo(x+w+w*.11,y+h*.62,cx,y+h);
  ctx.quadraticCurveTo(x-w*.11,y+h*.62,x+7,y);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  drawLeaf(ctx,x-4,y+h*.40,-0.52,isTarget);
  drawLeaf(ctx,x+w+4,y+h*.40,Math.PI+0.52,isTarget);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(cx,y+h+5,w*.32,4,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ── BOWL RIM (drawn ON TOP of egg) ──────────────────────────────────── */
function drawBowlRimArc(b,isTarget,front){
  // front=true  → bottom arc (0..π)  drawn IN FRONT of egg
  // front=false → top arc   (π..2π) drawn BEHIND egg
  const{x,y,w,h}=b, cx=x+w/2;
  const s0=front?0:Math.PI, s1=front?Math.PI:Math.PI*2;
  ctx.save();
  if(isTarget&&front){
    const p=.45+.55*Math.sin(Date.now()*.008);
    ctx.shadowColor=`rgba(255,208,48,${p*.55})`; ctx.shadowBlur=14;
  }
  // Outer rim — dark aged wood
  ctx.strokeStyle='#6a3410'; ctx.lineWidth=4.5;
  ctx.beginPath(); ctx.ellipse(cx,y,w/2,h*.22,0,s0,s1); ctx.stroke();
  // Inner rim highlight — only on back arc (gives depth)
  if(!front){
    ctx.strokeStyle='rgba(155,88,30,.52)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(cx,y-1,w*.44,h*.13,0,Math.PI*.05,Math.PI*.95,true); ctx.stroke();
  }
  // Gold accent on target bowl (front arc only so it glows in front)
  if(isTarget&&front){
    const pa=.45+.55*Math.sin(Date.now()*.009);
    ctx.strokeStyle=`rgba(218,172,48,${pa})`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(cx,y,w*.49,h*.21,0,s0,s1); ctx.stroke();
  }
  ctx.shadowBlur=0; ctx.restore();
}

function drawLeaf(c,lx,ly,angle,bright){
  c.save(); c.translate(lx,ly); c.rotate(angle);
  const a=bright?'#3c8614':'#1e4e08', b=bright?'#5ea822':'#346012';
  c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-6,-14,-17,-17,-20,-11); c.bezierCurveTo(-18,-4,-7,1,0,0); c.closePath();
  const lg=c.createLinearGradient(-20,-17,0,0); lg.addColorStop(0,b); lg.addColorStop(1,a); c.fillStyle=lg; c.fill();
  c.strokeStyle='rgba(0,38,0,.32)'; c.lineWidth=.7; c.beginPath(); c.moveTo(0,0); c.lineTo(-18,-10); c.stroke();
  c.restore();
}

/* ── SCRAMBLED EGG (on miss) ──────────────────────────────────────────── */
function drawScrambledEgg(sx, sy, angle){
  const c=ctx, r=EGG_R;
  c.save();
  c.translate(sx, sy);
  c.rotate(angle);

  // White splat — irregular blob
  c.save(); c.scale(1.4, 1.0);
  const wg=c.createRadialGradient(0,0,1,0,0,r*1.6);
  wg.addColorStop(0,'#fffef0'); wg.addColorStop(0.7,'#f5f0d0'); wg.addColorStop(1,'rgba(245,240,200,0)');
  c.fillStyle=wg;
  c.beginPath();
  // Irregular splat shape
  const pts=[[r*1.5,0],[r*1.2,-r*0.9],[0,-r*1.4],[-r*1.1,-r*0.8],
             [-r*1.6,0.2],[-r*0.9,r*1.1],[0,r*1.5],[r*1.0,r*1.0]];
  c.moveTo(pts[0][0],pts[0][1]);
  for(let i=0;i<pts.length;i++){
    const n=pts[(i+1)%pts.length];
    const mx=(pts[i][0]+n[0])/2, my=(pts[i][1]+n[1])/2;
    c.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);
  }
  c.closePath(); c.fill();
  c.restore();

  // Shell fragments (two curved shards)
  [[-0.3, -r*0.3, '#e8e0c0','#c8c0a0'],
   [ 0.4,  r*0.2, '#ede5c5','#cdc5a5']].forEach(([rot,ty,c1,c2])=>{
    c.save(); c.translate(0, ty); c.rotate(rot);
    const sg=c.createLinearGradient(-r*0.7,-r*0.5,r*0.7,r*0.5);
    sg.addColorStop(0,c1); sg.addColorStop(1,c2);
    c.fillStyle=sg;
    c.beginPath();
    c.moveTo(-r*0.7, 0);
    c.bezierCurveTo(-r*0.4,-r*0.9, r*0.4,-r*0.9, r*0.7, 0);
    c.bezierCurveTo( r*0.3, r*0.15,-r*0.3, r*0.15,-r*0.7, 0);
    c.closePath(); c.fill();
    // Crack line on shard
    c.strokeStyle='rgba(160,140,90,.5)'; c.lineWidth=0.8;
    c.beginPath(); c.moveTo(-r*0.2,-r*0.5); c.lineTo(r*0.1,-r*0.2); c.lineTo(-r*0.05,0); c.stroke();
    c.restore();
  });

  // Yolk — bright orange circle
  const yg=c.createRadialGradient(-r*0.15,-r*0.15,r*0.05,0,0,r*0.62);
  yg.addColorStop(0,'#ffe84a'); yg.addColorStop(0.6,'#f5a800'); yg.addColorStop(1,'#d07000');
  c.fillStyle=yg;
  c.beginPath(); c.arc(0, 0, r*0.62, 0, Math.PI*2); c.fill();
  // Yolk highlight
  c.fillStyle='rgba(255,255,180,.55)';
  c.beginPath(); c.arc(-r*0.18,-r*0.22, r*0.22, 0, Math.PI*2); c.fill();

  c.restore();
}

/* ── DRAW EGG ─────────────────────────────────────────────────────────── */
function drawEgg(sx,sy){
  const r=EGG_R;
  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(egg.angle);

  // Squish on landing
  let sX=1, sY=1;
  if(squishT>0){ const s=squishT/14; sX=1+s*.16; sY=1-s*.12; }

  // Glow / trail
  if(eggState==='flying'){
    const tc=eggTrailRGB();
    [[0,30,.50,7],[0,52,.26,4.5],[0,76,.10,2.5]].forEach(([tx,ty,a,tr])=>{
      ctx.fillStyle=`rgba(${tc},${a})`;
      ctx.beginPath(); ctx.arc(tx,ty,tr,0,Math.PI*2); ctx.fill();
    });
    const gw=ctx.createRadialGradient(0,0,r*.2,0,0,r*3.0);
    gw.addColorStop(0,eggGlowColor()); gw.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gw; ctx.beginPath(); ctx.arc(0,0,r*3.0,0,Math.PI*2); ctx.fill();
  } else {
    const gw=ctx.createRadialGradient(0,0,r*.35,0,0,r*1.85);
    gw.addColorStop(0,eggGlowColor()); gw.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gw; ctx.beginPath(); ctx.arc(0,0,r*1.85,0,Math.PI*2); ctx.fill();
  }

  // Egg oval
  ctx.scale(sX, sY*1.28);
  const [c1,c2,c3,c4]=eggColors();
  // Main gradient — off-center for realism
  const eg=ctx.createRadialGradient(-r*.28,-r*.32,1.0,r*.08,r*.10,r*1.05);
  eg.addColorStop(0,c1); eg.addColorStop(.28,c2); eg.addColorStop(.62,c3); eg.addColorStop(1,c4);
  ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

  // Subsurface depth (shadow from light above)
  const ss=ctx.createRadialGradient(r*.10,r*.18,r*.25,r*.10,r*.18,r*.95);
  ss.addColorStop(0,'rgba(0,0,0,0)'); ss.addColorStop(.55,'rgba(0,0,0,.04)'); ss.addColorStop(1,'rgba(0,0,0,.20)');
  ctx.fillStyle=ss; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

  // Dark outline
  ctx.strokeStyle='rgba(0,0,0,.30)'; ctx.lineWidth=1.8/1.28;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();

  // Primary specular
  ctx.fillStyle='rgba(255,255,255,.90)';
  ctx.beginPath(); ctx.arc(-r*.26,-r*.32,r*.27,0,Math.PI*2); ctx.fill();
  // Secondary specular
  ctx.fillStyle='rgba(255,255,255,.50)';
  ctx.beginPath(); ctx.arc(-r*.08,-r*.54,r*.09,0,Math.PI*2); ctx.fill();
  // Bottom rim reflection
  ctx.fillStyle='rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.arc(r*.14,r*.52,r*.17,0,Math.PI*2); ctx.fill();

  // Diamond sparkles
  if(getEggType(level)==='diamond'){
    ['rgba(0,255,255,.88)','rgba(255,0,255,.72)','rgba(255,255,0,.78)'].forEach((dc,i)=>{
      const a=i*Math.PI*2/3+Date.now()*.003;
      ctx.fillStyle=dc; ctx.beginPath(); ctx.arc(Math.cos(a)*r*.45,Math.sin(a)*r*.34,3.2,0,Math.PI*2); ctx.fill();
    });
  }
  ctx.restore();
}

function eggColors(){
  const t=Date.now();
  if(getEggType(level)==='rainbow'){
    const h=t/20%360;
    return [`hsl(${h},100%,92%)`,`hsl(${(h+30)%360},100%,70%)`,`hsl(${(h+60)%360},90%,50%)`,`hsl(${(h+90)%360},80%,30%)`];
  }
  if(getEggType(level)==='cosmic'){
    const h=t/8%360;
    return [`hsl(${h},100%,96%)`,`hsl(${(h+45)%360},100%,75%)`,`hsl(${(h+90)%360},100%,55%)`,`hsl(${(h+180)%360},100%,35%)`];
  }
  return ({
    white:   ['#fffdf8','#f5eedd','#d2ccb5','#9a9280'],
    bronze:  ['#faba6e','#d87e2c','#9a5010','#5a2802'],
    silver:  ['#f8f8ff','#c8c8d8','#9898b2','#606076'],
    gold:    ['#fffaaa','#ffd600','#c88000','#7a4600'],
    platinum:['#f0f5fc','#d0d8e8','#98aac0','#606e80'],
    diamond: ['#e6fcff','#aeecff','#44bef5','#1878c0']
  })[getEggType(level)]||['#fff','#f0ead0','#c0b898','#888068'];
}
function eggGlowColor(){
  if(getEggType(level)==='rainbow') return `rgba(255,128,255,.70)`;
  if(getEggType(level)==='cosmic')  return `rgba(200,100,255,.85)`;
  return ({white:'rgba(255,248,205,.26)',bronze:'rgba(215,128,48,.55)',silver:'rgba(198,198,255,.40)',
    gold:'rgba(255,215,0,.56)',platinum:'rgba(198,222,240,.44)',diamond:'rgba(0,244,255,.62)'})[getEggType(level)]||'rgba(255,255,255,.24)';
}
function eggTrailRGB(){
  if(getEggType(level)==='rainbow') return '255,128,255';
  if(getEggType(level)==='cosmic')  return '180,80,255';
  return ({white:'255,248,205',bronze:'215,128,48',silver:'195,195,228',
    gold:'255,215,0',platinum:'198,224,240',diamond:'0,226,255'})[getEggType(level)]||'255,248,205';
}

/* ── Hen intro ───────────────────────────────────────────────────────── */
function drawHen(hx, hy, t, flying){
  const c=ctx;
  c.save();
  c.translate(hx, hy);

  // Wings: slow gentle float when airborne, tiny idle sway when perched
  const wingAngle = flying
    ? Math.sin(t * 0.07) * 0.55   // slow soaring float
    : Math.sin(t * 0.10) * 0.10;  // barely-moving idle

  // Body
  c.save(); c.scale(1, 0.78);
  const bg=c.createRadialGradient(-4,-4,2,0,0,22);
  bg.addColorStop(0,'#d4621a'); bg.addColorStop(1,'#7a2c05');
  c.fillStyle=bg;
  c.beginPath(); c.ellipse(0,0,22,20,0,0,Math.PI*2); c.fill();
  c.restore();

  // Wing — pivots at shoulder point
  c.save();
  c.translate(-4, 2);
  c.rotate(wingAngle);
  c.beginPath();
  c.moveTo(0,0);
  c.bezierCurveTo(-20,-4,-28,8,-18,20);
  c.bezierCurveTo(-8,26,10,14,6,4);
  c.closePath();
  const wg=c.createLinearGradient(-28,0,6,20);
  wg.addColorStop(0,'#c8500e'); wg.addColorStop(1,'#5a1a02');
  c.fillStyle=wg; c.fill();
  c.restore();

  // Tail feathers
  [[-0.5,0.9],[-0.3,0.7],[0,0.55]].forEach(([ra,rb])=>{
    c.save(); c.rotate(ra);
    c.beginPath(); c.moveTo(16,-2);
    c.quadraticCurveTo(32+rb*8,-14,28,-20);
    c.quadraticCurveTo(22,-14,16,-2);
    c.fillStyle='#a03008'; c.fill();
    c.restore();
  });

  // Head
  c.save(); c.translate(-14,-14);
  const hg=c.createRadialGradient(-2,-2,1,0,0,10);
  hg.addColorStop(0,'#e07030'); hg.addColorStop(1,'#8a2c08');
  c.fillStyle=hg;
  c.beginPath(); c.ellipse(0,0,10,9,0,0,Math.PI*2); c.fill();
  // Comb
  c.fillStyle='#e02020';
  [[0,-10,4,5],[4,-9,3.5,5],[-4,-9,3.5,5]].forEach(([cx2,cy2,rx2,ry2])=>{
    c.beginPath(); c.ellipse(cx2,cy2,rx2,ry2,0,0,Math.PI*2); c.fill();
  });
  // Wattle
  c.fillStyle='#d01818';
  c.beginPath(); c.ellipse(3,5,3.5,5,0.3,0,Math.PI*2); c.fill();
  // Beak
  c.fillStyle='#e8a020';
  c.beginPath(); c.moveTo(8,-2); c.lineTo(16,0); c.lineTo(8,3); c.closePath(); c.fill();
  // Eye
  c.fillStyle='#111'; c.beginPath(); c.arc(3,-3,2.2,0,Math.PI*2); c.fill();
  c.fillStyle='#fff'; c.beginPath(); c.arc(4,-4,0.9,0,Math.PI*2); c.fill();
  c.restore();

  c.restore();
}

function renderHenIntro(){
  if(!henAnim) return;
  const t=henAnim.t;
  const bowl=bowls[0];
  const bx=bowl.x+BOWL_W/2, by=bowl.y;

  // Timeline (200 frames total):
  //  0-50  : hen glides in from left and lands on bowl
  // 50-130 : hen crouches slowly, egg grows out from underneath
  // 130-200: hen gently rises upward with floating wings

  let hx, hy, flying=false;

  if(t < 50){
    const p=easeOut(t/50);
    hx = FL - 10 + (bx - FL + 10)*p;
    hy = by - 30;
  } else if(t < 130){
    const p=(t-50)/80;
    hx = bx;
    hy = by - 30 + p*10; // slow squat
  } else {
    flying=true;
    const p=easeOut((t-130)/70);
    hx = bx;
    hy = by - 20 - p*(by + 80); // smooth ascent off top of screen
  }

  // Egg: grows slowly from t=70 to t=130 (60 frames = 1 second)
  if(t >= 70 && t < 200){
    const ep=Math.min(1,(t-70)/60);
    const ey=by - 2;
    ctx.save();
    ctx.globalAlpha=Math.min(1, ep);
    ctx.save(); ctx.translate(bx, ey); ctx.scale(1, 1.28);
    const eg=ctx.createRadialGradient(-EGG_R*.25,-EGG_R*.3,1,0,0,EGG_R*ep);
    eg.addColorStop(0,'#fffdf8'); eg.addColorStop(1,'#d8caa8');
    ctx.fillStyle=eg;
    ctx.beginPath(); ctx.arc(0, 0, EGG_R*ep, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // Fade hen out in last 20 frames
  if(t > 180) ctx.globalAlpha=(200-t)/20;
  drawHen(hx, hy, t, flying);
  ctx.globalAlpha=1;
}

/* ── Aim arc ─────────────────────────────────────────────────────────── */
function drawAim(){
  const tb=bowls[tgtIdx]; if(!tb) return;
  const dy=tb.y-egg.y; if(dy>=0) return;
  const vy=-Math.sqrt(2*G*Math.abs(dy)*1.08), tUp=-vy/G, vx=(tb.x+BOWL_W/2-egg.x)/tUp;
  ctx.save(); ctx.setLineDash([5,12]); ctx.strokeStyle='rgba(255,235,100,.18)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  let px=egg.x,py=egg.y,pvx=vx,pvy=vy;
  ctx.moveTo(px,py);
  for(let st=0;st<tUp*1.05;st+=2){ px+=pvx*2; py+=pvy*2; pvy+=G*2; if(py<0)break; ctx.lineTo(px,py); }
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}

/* ── HUD ─────────────────────────────────────────────────────────────── */
function updateHUD(){
  document.getElementById('lvlTxt').textContent='LVL '+level;
  document.getElementById('scoreTxt').textContent=score.toLocaleString();
  document.getElementById('livesTxt').textContent='❤️'.repeat(Math.min(lives,10));
}
function showToast(m){
  const el=document.getElementById('toast');
  el.textContent=m; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',3200);
}

/* ── Boot ────────────────────────────────────────────────────────────── */
window.addEventListener('load',()=>{
  initCv();
  // Warm beige wood on menu
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#eeddb8'); g.addColorStop(1,'#c89e60');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(75,40,10,.28)'; ctx.lineWidth=.7;
  for(let y=8;y<H;y+=11){ctx.beginPath();ctx.moveTo(0,y);for(let x=0;x<=W;x+=32)ctx.lineTo(x,y+(Math.random()-.5)*1.8);ctx.stroke();}
  for(let y=54;y<H;y+=54){ctx.fillStyle='rgba(72,38,10,.30)';ctx.fillRect(0,y-1,W,2);}
});
