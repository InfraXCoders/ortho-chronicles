<style>
:root{
  --navy:#0F1D3A; --ink:#0b1424; --gold:#B8963E; --gold2:#d8b45c;
  --teal:#2DD4BF; --txt:#E8EDF6; --mut:#93A4C0; --line:rgba(255,255,255,.10);
  --film:#0a1220; --bone:#E7E2D4;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);color:var(--txt);
  overflow:hidden;-webkit-font-smoothing:antialiased;}
a{color:inherit;}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:40;display:flex;
  align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(180deg,rgba(15,29,58,.97),rgba(15,29,58,.88));
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px);}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;}
.brand img{height:30px;}
.brand span{font-weight:800;font-size:.95rem;white-space:nowrap;}
.brand span i{color:var(--gold);}
.tb-spacer{flex:1;}
.tb-btn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);
  padding:8px 12px;border-radius:9px;font-size:.82rem;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.18s;
  text-decoration:none;font-family:inherit;}
.tb-btn:hover{background:rgba(255,255,255,.13);}
.tb-btn.on{background:rgba(45,212,191,.22);border-color:rgba(45,212,191,.45);}
.tb-btn.home{background:var(--gold);border-color:var(--gold);color:#1a1204;}

/* ---------- layout ---------- */
#stage{position:fixed;inset:58px 0 0 0;display:flex;}
#rail{width:236px;flex-shrink:0;border-right:1px solid var(--line);
  background:rgba(11,20,36,.6);overflow-y:auto;}
.rail-h{padding:11px 14px 7px;font-size:.63rem;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--gold2);font-weight:800;}
.rgn{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
  border-left:3px solid transparent;transition:.15s;font-size:.84rem;}
.rgn:hover{background:rgba(255,255,255,.05);}
.rgn.active{background:rgba(45,212,191,.12);border-left-color:var(--teal);color:#fff;font-weight:600;}
.rgn i{width:18px;color:var(--mut);font-size:.8rem;}
.rgn.active i{color:var(--teal);}

#viewer{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
#viewhead{padding:14px 20px 10px;border-bottom:1px solid var(--line);}
#viewhead h1{font-family:'Playfair Display',serif;font-size:1.35rem;margin-bottom:3px;}
#viewhead p{font-size:.8rem;color:var(--mut);}
#filmwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;}
#film{background:var(--film);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 18px 50px rgba(0,0,0,.5);max-width:100%;max-height:100%;}
#film svg{display:block;width:min(560px,86vw);height:auto;}

/* diagram styling */
.bone{fill:var(--bone);stroke:#9d9584;stroke-width:1.2;}
.bone-2{fill:#cfc9b9;stroke:#9d9584;stroke-width:1.1;}
.soft{fill:rgba(190,205,225,.13);stroke:rgba(190,205,225,.30);stroke-width:1;}
.cart{fill:rgba(120,200,220,.18);stroke:rgba(120,200,220,.45);stroke-width:1;}
.ln{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:7 5;opacity:0;transition:opacity .25s;}
.ln.show{opacity:1;}
.ln.solid{stroke-dasharray:none;}
.ln.warn{stroke:#ff8f6b;}
.ang{fill:none;stroke:#ffd166;stroke-width:1.8;opacity:0;transition:opacity .25s;}
.ang.show{opacity:1;}
.lnlab{fill:var(--teal);font-size:11px;font-weight:700;opacity:0;transition:opacity .25s;
  font-family:'Inter',sans-serif;pointer-events:none;}
.lnlab.show{opacity:1;}
.lnlab.gold{fill:#ffd166;}
.hot{cursor:pointer;}
.hot circle{fill:var(--gold);stroke:#fff;stroke-width:1.5;transition:.16s;}
.hot:hover circle,.hot.sel circle{fill:var(--teal);r:9;}
.hot text{fill:#0b1424;font-size:9.5px;font-weight:800;pointer-events:none;
  font-family:'Inter',sans-serif;}
.viewtag{fill:var(--mut);font-size:11px;font-family:'Inter',sans-serif;letter-spacing:1px;}

/* ---------- panel ---------- */
#panel{width:380px;flex-shrink:0;border-left:1px solid var(--line);
  background:rgba(11,20,36,.72);display:flex;flex-direction:column;overflow:hidden;}
.pn-tabs{display:flex;gap:2px;padding:9px 10px 0;border-bottom:1px solid var(--line);
  overflow-x:auto;flex-shrink:0;}
.pn-tab{background:0;border:0;color:var(--mut);font-size:.75rem;font-weight:700;
  padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
  font-family:inherit;transition:.15s;}
.pn-tab:hover{color:var(--txt);}
.pn-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.pn-body{flex:1;overflow-y:auto;padding:15px 16px 26px;}
.pn-body::-webkit-scrollbar{width:7px;}
.pn-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px;}
.pane{display:none;} .pane.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.pn-body p{font-size:.86rem;line-height:1.72;color:#D3DCEC;margin-bottom:12px;}
.pn-body h4{font-size:.67rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold2);
  margin:18px 0 8px;font-weight:800;}
.pn-body h4:first-child{margin-top:0;}
.lmrow{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;margin-bottom:6px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;
  cursor:pointer;transition:.16s;}
.lmrow:hover,.lmrow.hot2{background:rgba(45,212,191,.13);border-color:rgba(45,212,191,.45);}
.lmn{width:21px;height:21px;border-radius:50%;background:var(--gold);color:#1a1204;
  font-size:.66rem;font-weight:800;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;}
.lmrow.hot2 .lmn{background:var(--teal);color:#04201c;}
.lmt{font-size:.83rem;font-weight:700;margin-bottom:2px;}
.lmd{font-size:.77rem;color:var(--mut);line-height:1.55;}
table.meas{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:.79rem;}
table.meas th{text-align:left;font-size:.63rem;letter-spacing:1px;text-transform:uppercase;
  color:var(--gold2);padding:6px 8px;border-bottom:1px solid var(--line);}
table.meas td{padding:8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top;
  color:#D3DCEC;line-height:1.5;}
table.meas td strong{color:#fff;}
table.meas td.val{color:var(--teal);font-weight:700;white-space:nowrap;}
.pitfall{background:rgba(255,90,90,.09);border:1px solid rgba(255,90,90,.28);
  border-left:3px solid #ff6b6b;border-radius:9px;padding:11px 13px;margin-bottom:11px;}
.pitfall strong{color:#ff9a9a;display:block;margin-bottom:4px;font-size:.79rem;}
.pitfall span{font-size:.83rem;line-height:1.65;color:#D3DCEC;}
.pearl{background:rgba(45,212,191,.09);border:1px solid rgba(45,212,191,.26);
  border-left:3px solid var(--teal);border-radius:9px;padding:11px 13px;margin-bottom:11px;}
.pearl strong{color:#8fe6d8;display:block;margin-bottom:4px;font-size:.79rem;}
.pearl span{font-size:.83rem;line-height:1.65;color:#D3DCEC;}

/* ---------- search ---------- */
#searchWrap{position:relative;padding:10px 12px;border-bottom:1px solid var(--line);}
#search{width:100%;padding:9px 12px 9px 32px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--txt);font-size:.82rem;font-family:inherit;outline:0;}
#search:focus{border-color:rgba(45,212,191,.5);}
#searchWrap .si{position:absolute;left:23px;top:20px;color:var(--mut);font-size:.8rem;}
#results{position:absolute;left:12px;right:12px;top:52px;z-index:30;background:#0d1727;
  border:1px solid var(--line);border-radius:10px;max-height:52vh;overflow-y:auto;display:none;}
#results.show{display:block;}
.res{padding:9px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);font-size:.81rem;}
.res:last-child{border-bottom:0;}
.res:hover{background:rgba(45,212,191,.14);}
.res small{display:block;color:var(--mut);font-size:.7rem;margin-top:1px;}

/* ---------- disclaimer ---------- */
#note{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  font-size:.68rem;color:var(--mut);background:rgba(11,20,36,.85);border:1px solid var(--line);
  padding:5px 12px;border-radius:8px;white-space:nowrap;}

/* ---------- mobile ---------- */
#mobBtn{display:none;}
@media(max-width:1080px){ #panel{width:330px;} }
@media(max-width:900px){
  /* Stacked panes cannot all fit a phone screen, so the page scrolls
     normally instead of trapping the detail panel below the fold. */
  body{overflow:auto;}
  #stage{position:static;display:block;margin-top:58px;}
  #rail{width:100%;max-height:none;border-right:0;border-bottom:1px solid var(--line);}
  #regionList{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 12px;}
  .rail-h{width:100%;padding:6px 4px 2px;}
  .rgn{border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:7px 10px;font-size:.78rem;}
  #viewer{display:block;}
  #filmwrap{padding:12px;}
  #film svg{width:min(460px,92vw);}
  #panel{width:100%;border-left:0;border-top:1px solid var(--line);max-height:none;display:block;}
  .pn-body{overflow:visible;}
  #note{display:none;}
}
</style>
</head>

<div id="topbar">
  <a href="index.html" class="brand">
    <img src="assets/logo.png" alt="OrthoChronicles" onerror="this.style.display='none'"/>
    <span><i class="fas fa-x-ray"></i> Radiological Anatomy</span>
  </a>
  <div class="tb-spacer"></div>
  <button class="tb-btn on" id="btnLines"><i class="fas fa-ruler-combined"></i> Lines &amp; Angles</button>
  <a class="tb-btn" href="anatomy.html"><i class="fas fa-cube"></i> 3D Anatomy</a>
  <a class="tb-btn home" href="index.html"><i class="fas fa-house"></i> Site Home</a>
</div>

<div id="stage">

  <!-- region rail -->
  <div id="rail">
    <div id="searchWrap">
      <i class="fas fa-magnifying-glass si"></i>
      <input id="search" type="text" placeholder="Search a line, angle or value…" autocomplete="off"/>
      <div id="results"></div>
    </div>
    <div id="regionList"></div>
  </div>

  <!-- viewer -->
  <div id="viewer">
    <div id="viewhead">
      <h1 id="vTitle">—</h1>
      <p id="vSub"></p>
    </div>
    <div id="filmwrap"><div id="film"></div></div>
    <div id="note">Schematic diagrams — drawn for teaching, not radiographs of real patients</div>
  </div>

  <!-- detail panel -->
  <div id="panel">
    <div class="pn-tabs" id="pnTabs"></div>
    <div class="pn-body" id="pnBody"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   RADIOLOGICAL ANATOMY
   Every diagram below is an original schematic drawn in SVG. No patient
   radiographs are used — that keeps this both lawful and clearer, since a
   diagram can show the construction lines a real film cannot.
   ══════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* Small SVG helpers so each region reads as anatomy, not path soup */
const S = {
  open: (w,h)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`,
  close: '</svg>',
  /** dashed construction line + label */
  line: (id,x1,y1,x2,y2,label,cls='')=>
    `<line class="ln ${cls}" data-ln="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`+
    (label?`<text class="lnlab ${cls.includes('warn')?'':''}" data-ln="${id}" x="${(x1+x2)/2+6}" y="${(y1+y2)/2-6}">${label}</text>`:''),
  path: (id,d,label,lx,ly,cls='')=>
    `<path class="ln ${cls}" data-ln="${id}" d="${d}"/>`+
    (label?`<text class="lnlab" data-ln="${id}" x="${lx}" y="${ly}">${label}</text>`:''),
  ang: (id,d,label,lx,ly)=>
    `<path class="ang" data-ln="${id}" d="${d}"/>`+
    (label?`<text class="lnlab gold" data-ln="${id}" x="${lx}" y="${ly}">${label}</text>`:''),
  hot: (i,x,y)=>`<g class="hot" data-hot="${i}"><circle cx="${x}" cy="${y}" r="8"/>`+
                `<text x="${x}" y="${y+3.4}" text-anchor="middle">${i+1}</text></g>`,
  tag: (x,y,t)=>`<text class="viewtag" x="${x}" y="${y}">${t}</text>`
};

/* ══════════════════════════════════════════════════════════════════
   REGION DATA
   ══════════════════════════════════════════════════════════════════ */
const REGIONS = [

/* ─────────────── CERVICAL SPINE ─────────────── */
{
  id:'cspine', icon:'fa-bone', group:'Spine',
  name:'Cervical Spine — Lateral',
  sub:'The three alignment lines, the atlanto-dental interval and the prevertebral soft tissues',
  svg:(()=>{
    const bodies=[[150,70,52,30],[146,108,54,30],[144,146,56,30],[144,184,58,30],
                  [146,222,60,30],[150,260,62,32]];
    let g=S.open(400,400);
    g+=`<rect x="0" y="0" width="400" height="400" fill="none"/>`;
    g+=S.tag(20,26,'LATERAL C-SPINE');
    // occiput + prevertebral soft tissue band
    g+=`<path class="soft" d="M120 40 Q210 34 250 46 L250 300 Q200 306 120 300 Z" opacity=".5"/>`;
    g+=`<path class="soft" d="M206 60 L214 106 L216 300 L120 300 L120 60 Z"/>`;
    // C1 arch + dens
    g+=`<rect class="bone" x="152" y="44" width="46" height="18" rx="6"/>`;
    g+=`<path class="bone-2" d="M158 62 L158 40 Q168 30 178 40 L178 62 Z"/>`;
    // vertebral bodies + spinous processes
    bodies.forEach(([x,y,w,h])=>{
      g+=`<rect class="bone" x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/>`;
      g+=`<rect class="bone-2" x="${x-46}" y="${y+8}" width="42" height="13" rx="5"/>`;
      g+=`<rect class="cart" x="${x}" y="${y+h}" width="${w}" height="8" rx="3"/>`;
    });
    // three alignment lines
    g+=S.path('ant','M198 46 L200 70 L200 108 L200 146 L202 184 L206 222 L212 292','Anterior vertebral',216,120);
    g+=S.path('post','M152 46 L150 70 L146 108 L144 146 L144 184 L146 222 L150 292','Posterior vertebral',60,150,'');
    g+=S.path('spino','M110 52 L106 78 L102 116 L100 154 L100 192 L102 230 L106 270','Spinolaminar',18,200);
    // ADI
    g+=S.line('adi',158,52,152,52,'ADI','warn solid');
    // prevertebral soft tissue markers
    g+=S.line('pvst1',216,96,250,96,'','solid');
    g+=S.line('pvst2',216,250,272,250,'','solid');
    [[200,60],[155,52],[104,120],[233,96],[244,250],[176,300]].forEach((p,i)=>{ g+=S.hot(i,p[0],p[1]); });
    return g+S.close;
  })(),
  landmarks:[
    {n:'Anterior vertebral line', d:'A smooth curve along the anterior margins of the vertebral bodies. A step of more than 2 mm suggests ligamentous injury or subluxation.'},
    {n:'Atlanto-dental interval (ADI)', d:'The gap between the anterior arch of C1 and the dens. Widening indicates transverse ligament failure — the reason a child with Down syndrome or rheumatoid disease needs this checked before intubation.'},
    {n:'Spinolaminar line', d:'Joins the junctions of lamina and spinous process. It is the most reliable of the three lines because it is unaffected by degenerative osteophytes at the body margins.'},
    {n:'Prevertebral soft tissue (upper)', d:'Measured at C2–C3. Widening here is often the only sign of an occult fracture or a retropharyngeal abscess.'},
    {n:'Prevertebral soft tissue (lower)', d:'Measured at C6. The normal step-up occurs where the oesophagus begins.'},
    {n:'C7–T1 junction', d:'The single most commonly missed level on a cervical film, because shoulders obscure it. An inadequate film is not a normal film — obtain a swimmer\'s view or CT.'}
  ],
  meas:[
    {n:'ADI — adult', v:'< 3 mm', how:'Anterior arch of C1 to anterior dens, mid-height, on lateral view', why:'Widening means transverse ligament rupture and atlantoaxial instability'},
    {n:'ADI — child', v:'< 5 mm', how:'Same technique; laxity is physiological in children', why:'Applying the adult limit to a child causes false alarms'},
    {n:'Prevertebral soft tissue at C2', v:'< 7 mm', how:'Anterior vertebral body cortex to the air column', why:'Haematoma from an occult fracture; retropharyngeal abscess'},
    {n:'Prevertebral soft tissue at C6', v:'< 22 mm (adult)', how:'Same, at the C6 level below the oesophageal inlet', why:'Roughly the width of a vertebral body is the quick bedside check'},
    {n:'Interspinous distance', v:'No abrupt widening', how:'Compare with the levels above and below', why:'Fanning indicates posterior ligamentous complex disruption'},
    {n:'Adequate film', v:'C1 to T1 visible', how:'Count down and confirm the C7–T1 disc is seen', why:'The commonest cause of a missed cervical injury is an inadequate film'}
  ],
  pitfalls:[
    {t:'Pseudosubluxation in children', d:'Up to 4 mm of anterior displacement of C2 on C3 is normal below about 8 years. Use the posterior cervical line of Swischuk: if the spinolaminar line of C2 lies within 2 mm of a line joining C1 and C3, it is physiological.'},
    {t:'The film that stops at C6', d:'Shoulders routinely obscure C7–T1, exactly where injuries cluster in the adult. Never clear a neck on a film that does not show the top of T1.'},
    {t:'A normal X-ray does not exclude injury', d:'Plain films miss a significant proportion of cervical fractures. Follow validated rules — Canadian C-Spine or NEXUS — and go to CT when they are met, particularly in the elderly and in the obtunded patient.'}
  ],
  pearls:[
    {t:'Read it in a fixed order', d:'Adequacy → alignment (the three lines) → bones (each body, each posterior element) → cartilage/disc spaces → soft tissues. Doing it the same way every time is what stops you missing the second injury.'},
    {t:'Look for the second fracture', d:'Around 10–15% of cervical spine injuries are non-contiguous. Finding one fracture increases, not decreases, the need to image the whole spine.'}
  ]
},

/* ─────────────── SHOULDER ─────────────── */
{
  id:'shoulder', icon:'fa-user-injured', group:'Upper limb',
  name:'Shoulder — AP &amp; Scapular Y',
  sub:'Glenohumeral alignment, the acromiohumeral interval and Maloney\'s arch',
  svg:(()=>{
    let g=S.open(400,400);
    g+=S.tag(20,26,'AP SHOULDER');
    // clavicle
    g+=`<path class="bone" d="M40 96 Q120 78 190 96 L192 108 Q120 92 40 108 Z"/>`;
    // acromion + scapular spine
    g+=`<path class="bone" d="M186 92 L246 96 L252 118 L192 116 Z"/>`;
    g+=`<path class="bone-2" d="M246 100 L318 128 L316 148 L244 122 Z"/>`;
    // coracoid
    g+=`<path class="bone-2" d="M196 122 L226 132 L222 148 L192 140 Z"/>`;
    // glenoid + scapula body
    g+=`<path class="bone" d="M236 138 L252 150 L258 200 L242 214 Q226 190 230 160 Z"/>`;
    g+=`<path class="bone-2" d="M252 160 L330 230 L300 268 L246 208 Z"/>`;
    // humeral head + shaft
    g+=`<ellipse class="bone" cx="206" cy="176" rx="44" ry="42"/>`;
    g+=`<path class="bone" d="M170 206 Q186 250 176 330 L232 336 Q238 250 244 200 Z"/>`;
    g+=`<rect class="cart" x="166" y="140" width="10" height="72" rx="5" transform="rotate(-8 171 176)"/>`;
    // greater tuberosity
    g+=`<path class="bone-2" d="M232 148 Q252 162 246 190 L228 186 Z"/>`;
    // lines
    g+=S.line('ahi',204,132,204,110,'AHI','solid');
    g+=S.path('arch','M150 250 Q180 210 214 200 Q244 192 252 152','Maloney arch (scapulohumeral)',44,268);
    g+=S.line('joint',238,146,238,212,'Glenohumeral space','');
    [[204,120],[186,240],[240,178],[214,96],[222,140],[236,158]].forEach((p,i)=>{g+=S.hot(i,p[0],p[1]);});
    return g+S.close;
  })(),
  landmarks:[
    {n:'Acromiohumeral interval', d:'The gap between the undersurface of the acromion and the top of the humeral head. Narrowing is the radiographic signature of a chronic, retracted rotator cuff tear.'},
    {n:'Maloney\'s arch', d:'A smooth curve running from the medial border of the humeral metaphysis onto the inferior border of the glenoid and scapular neck. A break in this arch is the most reliable sign of a shoulder dislocation.'},
    {n:'Glenohumeral joint space', d:'Should be uniform, roughly 4–5 mm. Loss of the space with osteophytes and a posteriorly worn glenoid is the picture of glenohumeral osteoarthritis.'},
    {n:'Acromioclavicular joint', d:'Normally 5–8 mm wide with the inferior cortices of clavicle and acromion aligned. A step here indicates AC joint separation.'},
    {n:'Coracoid process', d:'The "lighthouse of the shoulder" — the guide to the neurovascular bundle, and a landmark for judging coracoclavicular distance.'},
    {n:'Greater tuberosity', d:'Look specifically at its profile: an isolated greater tuberosity fracture behaves functionally like an acute cuff tear and is easily overlooked.'}
  ],
  meas:[

    {n:'Talar tilt', v:'< 2°', how:'Plafond line vs talar dome line on mortise', why:'Any tilt indicates an incongruent, unstable mortise'},
    {n:'Talocrural angle', v:'83° ± 4', how:'Intermalleolar line vs the plafond line', why:'Confirms fibular length is restored after fixation'}
  ],
  pitfalls:[
    {t:'Weber B with a normal-looking medial side', d:'A fibular fracture at the syndesmosis may be stable or unstable depending on the deltoid. If the medial clear space is equivocal, weight-bearing or gravity-stress views reveal the instability that a supine film hides.'},
    {t:'Maisonneuve fracture', d:'Always palpate and, if tender, image the proximal fibula in any ankle injury with a medial-sided finding. The ankle film alone will look deceptively minor.'},
    {t:'Ottawa ankle rules', d:'X-ray only if there is pain in the malleolar zone plus bony tenderness at the posterior edge or tip of either malleolus, or inability to weight-bear four steps. Applied properly this safely reduces imaging by around a third.'}
  ],
  pearls:[
    {t:'Restore fibular length first', d:'The fibula is the key to the mortise. Getting its length and rotation right — checked by the talocrural angle and Shenton line of the ankle — is what makes the reduction anatomical.'}
  ]
},

/* ─────────────── FOOT ─────────────── */
{

    {t:'Calcaneal fracture means look elsewhere', d:'Axial loading from a fall causes associated lumbar spine fractures in about 10% and contralateral calcaneal fractures. Examine the back and the other heel deliberately.'},

  pearls:[

/* ─────────────── PAEDIATRIC ─────────────── */
{
  id:'paeds', icon:'fa-child', group:'Paediatric',
  name:'Paediatric — Physis &amp; Ossification',
  sub:'Salter-Harris classification, CRITOE and the growing skeleton',
  svg:(()=>{
    let g=S.open(400,400);
    g+=S.tag(20,26,'SALTER-HARRIS TYPES');
    const bone=(x,label,type)=>{
      let s='';
      s+=`<path class="bone" d="M${x-26} 90 L${x+26} 90 L${x+22} 176 L${x-22} 176 Z"/>`;   // metaphysis
      s+=`<rect class="cart" x="${x-26}" y="176" width="52" height="13" rx="4"/>`;         // physis
      s+=`<path class="bone-2" d="M${x-30} 189 L${x+30} 189 L${x+26} 232 L${x-26} 232 Z"/>`; // epiphysis
      // fracture lines by type
      const F=`stroke="#ff8f6b" stroke-width="3" fill="none" stroke-linecap="round"`;
      if(type===1) s+=`<line ${F} x1="${x-26}" y1="182" x2="${x+26}" y2="182"/>`;
      if(type===2){ s+=`<line ${F} x1="${x-26}" y1="182" x2="${x+8}" y2="182"/>`;
                    s+=`<line ${F} x1="${x+8}" y1="182" x2="${x+24}" y2="150"/>`; }
      if(type===3){ s+=`<line ${F} x1="${x-26}" y1="182" x2="${x+4}" y2="182"/>`;
                    s+=`<line ${F} x1="${x+4}" y1="182" x2="${x+4}" y2="232"/>`; }
      if(type===4) s+=`<line ${F} x1="${x+2}" y1="146" x2="${x+2}" y2="232"/>`;
      if(type===5){ s+=`<line ${F} x1="${x-22}" y1="180" x2="${x+22}" y2="180"/>`;
                    s+=`<path ${F} d="M${x-14} 168 L${x-14} 158 M${x+14} 168 L${x+14} 158"/>`; }
      s+=`<text class="viewtag" x="${x}" y="258" text-anchor="middle">${label}</text>`;
      return s;
    };
    g+=bone(70,'I — Straight',1);
    g+=bone(148,'II — Above',2);
    g+=bone(226,'III — Lower',3);
    g+=bone(304,'IV — Through',4);
    g+=`<g transform="translate(0,110)">${bone(148,'V — Crush (ERasure)',5)}</g>`;
    g+=`<text class="viewtag" x="200" y="300" text-anchor="middle">SALTR: Straight · Above · Lower · Through · Rammed</text>`;
    [[70,182],[148,168],[226,206],[304,190],[148,292]].forEach((p,i)=>{g+=S.hot(i,p[0],p[1]);});
    return g+S.close;
  })(),
  landmarks:[
    {n:'Type I — through the physis', d:'A pure separation through the growth plate. Often radiographically invisible, diagnosed clinically by tenderness directly over the physis. Excellent prognosis.'},
    {n:'Type II — above (metaphyseal)', d:'Through the physis and out through the metaphysis, leaving the Thurston-Holland fragment. The commonest type, around 75%, and usually managed closed.'},
    {n:'Type III — lower (epiphyseal)', d:'Through the physis and out through the epiphysis into the joint. Being intra-articular it needs anatomical reduction, often with fixation.'},
    {n:'Type IV — through both', d:'A vertical split crossing metaphysis, physis and epiphysis. Highest risk of bony bridge and growth arrest; requires anatomical open reduction.'},
    {n:'Type V — crush', d:'Axial compression of the physis. Usually diagnosed retrospectively when growth arrest appears; the initial film may look normal.'}
  ],
  meas:[
    {n:'CRITOE — elbow ossification', v:'1, 3, 5, 7, 9, 11 years', how:'Capitellum, Radial head, Internal epicondyle, Trochlea, Olecranon, External epicondyle', why:'Seeing trochlea without medial epicondyle = entrapped epicondyle in the joint'},
    {n:'Physeal widening', v:'Symmetrical with the other side', how:'Compare with a contralateral film when in doubt', why:'Asymmetric widening indicates a Salter-Harris I or chronic stress (gymnast wrist, Little League shoulder)'},
    {n:'Bone age (Greulich &amp; Pyle)', v:'Within 2 SD of chronological', how:'Left hand and wrist PA against the atlas', why:'Guides timing of limb-length and deformity surgery'},
    {n:'Acetabular index', v:'< 30° at 6 months', how:'Hilgenreiner line vs acetabular roof', why:'Screening for developmental dysplasia before the head ossifies'},
    {n:'Southwick slip angle (SCFE)', v:'Mild < 30°, Severe > 50°', how:'Epiphyseal-shaft angle on frog-lateral, compared with the normal side', why:'Grades slip severity and guides treatment'}
  ],
  pitfalls:[
    {t:'A child\'s ligament is stronger than the physis', d:'What would be a sprain in an adult is a physeal injury in a child. Tenderness over the growth plate with a normal film is a Salter-Harris I — splint it and review, do not discharge it as a sprain.'},
    {t:'The growth plate is not a fracture', d:'Physes and accessory ossicles are the commonest source of false-positive paediatric reads. When unsure, a comparison view of the other side settles it more cheaply than a CT.'},
    {t:'Suspect non-accidental injury', d:'Metaphyseal corner (bucket-handle) fractures, posterior rib fractures, fractures in a non-ambulant infant, and injuries of differing ages together demand a formal safeguarding pathway and a skeletal survey.'}
  ],
  pearls:[
    {t:'Remodelling buys forgiveness', d:'Angulation in the plane of joint motion, close to the physis, in a young child, remodels remarkably. Anatomical reduction matters far more for intra-articular Salter-Harris III and IV injuries.'}
  ]
},

/* ─────────────── MODALITIES ─────────────── */
{
  id:'modalities', icon:'fa-magnet', group:'Modalities',
  name:'Modalities &amp; Signal Characteristics',
  sub:'What each investigation actually shows, and when to ask for it',
  svg:(()=>{
    let g=S.open(400,400);
    g+=S.tag(20,26,'TISSUE SIGNAL BY MODALITY');
    const row=(y,label,xr,ct,t1,t2)=>{
      let s=`<text class="viewtag" x="18" y="${y+5}" style="font-size:12px;fill:#D3DCEC">${label}</text>`;
      const cell=(x,v,tone)=>{
        const fill = tone==='w'?'#E7E2D4':tone==='g'?'#8d95a5':'#1b2536';
        const txt  = tone==='w'?'#0b1424':tone==='g'?'#0b1424':'#93A4C0';
        s+=`<rect x="${x}" y="${y-13}" width="62" height="26" rx="6" fill="${fill}" stroke="rgba(255,255,255,.14)"/>`;
        s+=`<text x="${x+31}" y="${y+4}" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:${txt};font-family:Inter,sans-serif">${v}</text>`;
      };
      cell(150,xr[0],xr[1]); cell(216,ct[0],ct[1]); cell(282,t1[0],t1[1]); cell(348,t2[0],t2[1]);
      return s;
    };
    g+=`<text class="viewtag" x="150" y="58">X-RAY</text><text class="viewtag" x="222" y="58">CT</text>`;
    g+=`<text class="viewtag" x="292" y="58">T1</text><text class="viewtag" x="356" y="58">T2</text>`;
    g+=row(90,'Cortical bone',['white','w'],['white','w'],['dark','d'],['dark','d']);
    g+=row(130,'Marrow fat',['grey','g'],['dark','d'],['bright','w'],['grey','g']);
    g+=row(170,'Muscle',['grey','g'],['grey','g'],['grey','g'],['grey','g']);
    g+=row(210,'Fluid / oedema',['grey','g'],['dark','d'],['dark','d'],['bright','w']);
    g+=row(250,'Cartilage',['lucent','d'],['grey','g'],['grey','g'],['grey','g']);
    g+=row(290,'Ligament/tendon',['unseen','d'],['grey','g'],['dark','d'],['dark','d']);
    g+=row(330,'Fat',['dark','d'],['dark','d'],['bright','w'],['grey','g']);
    [[181,90],[181,210],[313,130],[379,210],[313,290]].forEach((p,i)=>{g+=S.hot(i,p[0],p[1]);});
    return g+S.close;
  })(),
  landmarks:[
    {n:'Cortical bone', d:'Dense on X-ray and CT; signal void (black) on both T1 and T2 because it contains almost no mobile protons. CT remains the gold standard for cortical detail and fracture configuration.'},
    {n:'Fluid and oedema', d:'Bright on T2 and STIR, dark on T1. This is why STIR is the sequence that reveals occult fractures, bone bruising and early infection long before X-ray changes appear.'},
    {n:'Marrow fat', d:'Bright on T1. Its replacement by anything — tumour, infection, oedema — makes marrow dark on T1, which is why T1 is the workhorse for detecting marrow pathology.'},
    {n:'Fat suppression', d:'STIR or fat-saturated T2 removes the bright fat signal so that oedema stands out. Ordering "MRI" without fat suppression risks missing exactly what you were looking for.'},
    {n:'Ligament and tendon', d:'Low signal on all sequences when normal. Increased internal signal, thickening or discontinuity indicates degeneration or tear.'}
  ],
  meas:[
    {n:'X-ray', v:'First line', how:'Two orthogonal views minimum; include the joint above and below', why:'Fracture, alignment, arthritis, bone lesions. Cheap, fast, low dose'},
    {n:'CT', v:'Bone detail', how:'Thin slices with multiplanar and 3D reconstruction', why:'Fracture configuration, articular depression, surgical planning, non-union'},
    {n:'MRI', v:'Soft tissue and marrow', how:'T1 + fluid-sensitive (STIR / fat-sat T2), at least two planes', why:'Occult fracture, AVN, tumour, infection, ligament and meniscal tears, cord compression'},
    {n:'Ultrasound', v:'Dynamic soft tissue', how:'High-frequency linear probe, compare with the other side', why:'Cuff tears, tendinopathy, effusion, DDH screening under 6 months, guided injection'},
    {n:'Bone scan', v:'Whole-body survey', how:'Technetium-99m, three-phase if infection suspected', why:'Metastases, stress fracture, loosening — sensitive but not specific'},
    {n:'DEXA', v:'T-score', how:'Hip and lumbar spine', why:'≤ −2.5 diagnoses osteoporosis; the reason a fragility fracture must trigger a scan'}
  ],
  pitfalls:[
    {t:'MRI is not always the answer', d:'For cortical bone detail, articular depression and implant assessment, CT beats MRI. Asking for the wrong test delays treatment as surely as asking for none.'},
    {t:'Radiation dose is not trivial', d:'A CT abdomen-pelvis carries several hundred times the dose of a chest film. In children and in young women of reproductive age, justify each scan and prefer ultrasound or MRI where they answer the question.'},
    {t:'Metalwork degrades MRI', d:'Susceptibility artefact around implants obscures exactly the region of interest. Use metal artefact reduction sequences, or choose CT with metal artefact reduction instead.'}
  ],
  pearls:[
    {t:'The occult hip fracture', d:'An elderly patient who cannot weight bear with a normal X-ray needs an MRI, not a repeat film. MRI is close to 100% sensitive within 24 hours and changes management the same day.'},
    {t:'Always request the clinical question', d:'"?scaphoid fracture, snuffbox tender" gets a targeted, correctly-sequenced study. "Wrist pain" gets a generic one. The request is part of the investigation.'}
  ]
}
];

/* ══════════════════════════════════════════════════════════════════
   UI
   ══════════════════════════════════════════════════════════════════ */
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/&(?!(amp|lt|gt|#\d+);)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let current=null, showLines=true;

/* ---- rail ---- */
(function buildRail(){
  const byGroup={};
  REGIONS.forEach(r=>{ (byGroup[r.group]=byGroup[r.group]||[]).push(r); });
  let html='';
  Object.keys(byGroup).forEach(g=>{
    html+=`<div class="rail-h">${g}</div>`;
    byGroup[g].forEach(r=>{
      html+=`<div class="rgn" data-id="${r.id}"><i class="fas ${r.icon}"></i><span>${r.name}</span></div>`;
    });
  });
  $('regionList').innerHTML=html;
  $('regionList').addEventListener('click',e=>{
    const row=e.target.closest('.rgn'); if(row) show(row.dataset.id);
  });
})();

/* ---- render a region ---- */
function show(id, focusLm){
  const r=REGIONS.find(x=>x.id===id); if(!r) return;
  current=r;
  document.querySelectorAll('.rgn').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
  $('vTitle').innerHTML=r.name;
  $('vSub').textContent=r.sub;
  $('film').innerHTML=r.svg;
  applyLines();

  // hotspot ↔ list wiring
  $('film').querySelectorAll('.hot').forEach(h=>{
    h.addEventListener('mouseenter',()=>highlight(+h.dataset.hot));
    h.addEventListener('mouseleave',()=>highlight(-1));
    h.addEventListener('click',()=>{ selectTab('landmarks'); highlight(+h.dataset.hot,true); });
  });

  const tabs=[{k:'landmarks',l:'Landmarks'},{k:'meas',l:'Measurements'},
              {k:'pitfalls',l:'Pitfalls'},{k:'pearls',l:'Pearls'}];
  $('pnTabs').innerHTML=tabs.map((t,i)=>
    `<button class="pn-tab${i===0?' active':''}" data-k="${t.k}">${t.l}</button>`).join('');

  let html='';
  html+=`<div class="pane active" data-k="landmarks"><h4>Numbered on the diagram</h4>`+
    r.landmarks.map((l,i)=>
      `<div class="lmrow" data-lm="${i}"><div class="lmn">${i+1}</div>
        <div><div class="lmt">${l.n}</div><div class="lmd">${l.d}</div></div></div>`).join('')+`</div>`;

  html+=`<div class="pane" data-k="meas"><h4>Normal values &amp; how to measure</h4>
    <table class="meas"><tr><th>Measurement</th><th>Normal</th></tr>`+
    r.meas.map(m=>`<tr><td><strong>${m.n}</strong><br><span style="color:var(--mut)">${m.how}</span>
      <br><span style="color:#9fd8cf">Why: ${m.why}</span></td><td class="val">${m.v}</td></tr>`).join('')+
    `</table></div>`;

  html+=`<div class="pane" data-k="pitfalls">`+
    r.pitfalls.map(p=>`<div class="pitfall"><strong>${p.t}</strong><span>${p.d}</span></div>`).join('')+`</div>`;

  html+=`<div class="pane" data-k="pearls">`+
    (r.pearls||[]).map(p=>`<div class="pearl"><strong>${p.t}</strong><span>${p.d}</span></div>`).join('')+`</div>`;

  $('pnBody').innerHTML=html;
  $('pnBody').scrollTop=0;

  $('pnBody').querySelectorAll('.lmrow').forEach(row=>{
    row.addEventListener('mouseenter',()=>highlight(+row.dataset.lm));
    row.addEventListener('mouseleave',()=>highlight(-1));
  });
  if(focusLm!=null){ selectTab('landmarks'); highlight(focusLm,true); }
}

function selectTab(k){
  $('pnTabs').querySelectorAll('.pn-tab').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
  $('pnBody').querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.dataset.k===k));
}
$('pnTabs').addEventListener('click',e=>{
  const b=e.target.closest('.pn-tab'); if(b) selectTab(b.dataset.k);
});

/** Light up a numbered landmark on the diagram and its row together. */
function highlight(i,scroll){
  $('film').querySelectorAll('.hot').forEach(h=>h.classList.toggle('sel',+h.dataset.hot===i));
  $('pnBody').querySelectorAll('.lmrow').forEach(r=>r.classList.toggle('hot2',+r.dataset.lm===i));
  if(scroll && i>=0){
    const row=$('pnBody').querySelector(`.lmrow[data-lm="${i}"]`);
    if(row) row.scrollIntoView({block:'nearest'});
  }
}

/* ---- lines toggle ---- */
function applyLines(){
  $('film').querySelectorAll('.ln,.ang,.lnlab').forEach(el=>el.classList.toggle('show',showLines));
}
$('btnLines').addEventListener('click',()=>{
  showLines=!showLines;
  $('btnLines').classList.toggle('on',showLines);
  applyLines();
});

/* ---- search across landmarks, measurements and pitfalls ---- */
/* Strip diacritics so "bohler" finds Böhler and "tonnis" finds Tönnis —
   nobody types the umlaut when searching. */
const fold = s => String(s).toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[’']/g,"'");

const INDEX=[];
REGIONS.forEach(r=>{
  INDEX.push({rid:r.id,label:r.name,sub:'Region',hay:fold(r.name+' '+r.sub)});
  r.landmarks.forEach((l,i)=>INDEX.push({rid:r.id,lm:i,label:l.n,sub:'Landmark · '+r.name,
    hay:fold(l.n+' '+l.d)}));
  r.meas.forEach(m=>INDEX.push({rid:r.id,tab:'meas',label:m.n+' — '+m.v,sub:'Measurement · '+r.name,
    hay:fold(m.n+' '+m.v+' '+m.why+' '+m.how)}));
  r.pitfalls.forEach(p=>INDEX.push({rid:r.id,tab:'pitfalls',label:p.t,sub:'Pitfall · '+r.name,
    hay:fold(p.t+' '+p.d)}));
  (r.pearls||[]).forEach(p=>INDEX.push({rid:r.id,tab:'pearls',label:p.t,sub:'Pearl · '+r.name,
    hay:fold(p.t+' '+p.d)}));
});
$('search').addEventListener('input',()=>{
  const q=fold($('search').value.trim());
  const box=$('results');
  if(q.length<2){ box.classList.remove('show'); return; }
  const hits=INDEX.filter(x=>x.hay.includes(q)).slice(0,16);
  box.innerHTML = hits.length
    ? hits.map((h,i)=>`<div class="res" data-i="${INDEX.indexOf(h)}">${esc(h.label)}<small>${esc(h.sub)}</small></div>`).join('')
    : '<div class="res">Nothing found</div>';
  box.classList.add('show');
});
$('results').addEventListener('click',e=>{
  const el=e.target.closest('.res'); if(!el||!el.dataset.i) return;
  const h=INDEX[+el.dataset.i];
  show(h.rid, h.lm);
  if(h.tab) selectTab(h.tab);
  $('results').classList.remove('show'); $('search').value='';
});
document.addEventListener('click',e=>{ if(!e.target.closest('#searchWrap')) $('results').classList.remove('show'); });

/* keyboard */
window.addEventListener('keydown',e=>{
  if(e.target===$('search')){ if(e.key==='Escape') $('search').blur(); return; }
  if(e.key==='/'){ e.preventDefault(); $('search').focus(); }
  if(e.key==='l'||e.key==='L') $('btnLines').click();
  const i=REGIONS.findIndex(r=>r.id===(current&&current.id));
  if(e.key==='ArrowDown'&&i<REGIONS.length-1) show(REGIONS[i+1].id);
  if(e.key==='ArrowUp'&&i>0) show(REGIONS[i-1].id);
});

/* debug handle for automated checks */
if(/debug=1/.test(location.search+location.hash)){
  window.__radio = {REGIONS, show, selectTab, highlight, count:()=>REGIONS.length};
}

show(REGIONS[0].id);
})();
</script>
