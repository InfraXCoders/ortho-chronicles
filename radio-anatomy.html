<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Anatomy + Radiology — 3D Anatomy, Radiographs, MRI, CT &amp; Diagrams | OrthoChronicles</title>
<meta name="description" content="Interactive radiological anatomy for orthopaedics: the alignment lines, angles and normal values on every standard view — cervical spine, shoulder, elbow, wrist, pelvis, hip, knee, ankle and foot — with measurement technique, clinical significance and the classic pitfalls. By Dr. Maninder Singh, MS Orthopedics, GMCH Amritsar." />
<link rel="canonical" href="https://www.orthochronicles.info/radio-anatomy.html" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Radiological Anatomy | OrthoChronicles" />
<meta property="og:description" content="The lines, angles and normal values of orthopaedic radiology — interactive, region by region." />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7931867777885907" crossorigin="anonymous"></script>
<style>
:root{
  --navy:#0F1D3A; --ink:#0b1424; --gold:#B8963E; --gold2:#d8b45c;
  --teal:#2DD4BF; --txt:#E8EDF6; --mut:#93A4C0; --line:rgba(255,255,255,.10);
  --film:#0a1220; --bone:#E7E2D4;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);color:var(--txt);
  overflow:hidden;-webkit-font-smoothing:antialiased;}
a{color:inherit;}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:40;display:flex;
  align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(180deg,rgba(15,29,58,.97),rgba(15,29,58,.88));
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px);}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;}
.brand img{height:30px;}
.brand span{font-weight:800;font-size:.95rem;white-space:nowrap;}
.brand span i{color:var(--gold);}
.tb-spacer{flex:1;}
.tb-btn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);
  padding:8px 12px;border-radius:9px;font-size:.82rem;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.18s;
  text-decoration:none;font-family:inherit;}
.tb-btn:hover{background:rgba(255,255,255,.13);}
.tb-btn.on{background:rgba(45,212,191,.22);border-color:rgba(45,212,191,.45);}
.tb-btn.home{background:var(--gold);border-color:var(--gold);color:#1a1204;}

/* three-way subsection switch */
#sectionTabs{display:inline-flex;gap:4px;padding:4px;border-radius:11px;
  background:rgba(0,0,0,.28);border:1px solid var(--line);}
.sec-tab{background:transparent;border:0;color:var(--mut);font-family:inherit;
  padding:8px 14px;border-radius:8px;font-size:.83rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.16s;}
.sec-tab:hover{color:var(--txt);}
.sec-tab.on{background:rgba(45,212,191,.24);color:#eafaf7;
  box-shadow:0 1px 0 rgba(45,212,191,.35) inset;}

/* 3D anatomy embed. An iframe is a replaced element, so top+bottom will
   NOT stretch it — its height falls back to the 150px intrinsic default.
   Give it an explicit height that fills below the 58px top bar. */
#anatomyFrame{position:fixed;top:58px;left:0;border:0;width:100%;
  height:calc(100vh - 58px);display:none;background:#0a0f18;}
body.sec-anatomy #stage{display:none;}
body.sec-anatomy #anatomyFrame{display:block;}

/* Tighten the bar so three sections, Lines and Home all fit narrow screens.
   Under 760px the section tabs collapse to icons; the brand text hides too. */
@media(max-width:760px){
  #topbar{gap:7px;padding:0 8px;}
  .brand span{display:none;}
  #sectionTabs .lbl{display:none;}
  .sec-tab{padding:8px 11px;}
  #btnLines{padding:8px 10px;}
}
@media(max-width:420px){
  .tb-btn.home span,.tb-btn.home{font-size:0;}
  .tb-btn.home i{font-size:.82rem;}
}

/* ---------- layout ---------- */
#stage{position:fixed;inset:58px 0 0 0;display:flex;}
#rail{width:236px;flex-shrink:0;border-right:1px solid var(--line);
  background:rgba(11,20,36,.6);overflow-y:auto;}
.rail-h{padding:11px 14px 7px;font-size:.63rem;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--gold2);font-weight:800;}
.rgn{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
  border-left:3px solid transparent;transition:.15s;font-size:.84rem;}
.rgn:hover{background:rgba(255,255,255,.05);}
.rgn.active{background:rgba(45,212,191,.12);border-left-color:var(--teal);color:#fff;font-weight:600;}
.rgn i{width:18px;color:var(--mut);font-size:.8rem;}
.rgn.active i{color:var(--teal);}

#viewer{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
#viewhead{padding:14px 20px 10px;border-bottom:1px solid var(--line);}
#viewhead h1{font-family:'Playfair Display',serif;font-size:1.35rem;margin-bottom:3px;}
#viewhead p{font-size:.8rem;color:var(--mut);}
#filmwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;}
#film{background:var(--film);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 18px 50px rgba(0,0,0,.5);max-width:100%;max-height:100%;}
/* Slice atlases need the whole column; shrink-to-fit would starve the gutters. */
#film.stackmode{width:100%;}
#film svg{display:block;width:min(560px,86vw);height:auto;}

/* diagram styling */
.bone{fill:var(--bone);stroke:#9d9584;stroke-width:1.2;}
.bone-2{fill:#cfc9b9;stroke:#9d9584;stroke-width:1.1;}
.soft{fill:rgba(190,205,225,.13);stroke:rgba(190,205,225,.30);stroke-width:1;}
.cart{fill:rgba(120,200,220,.18);stroke:rgba(120,200,220,.45);stroke-width:1;}
.ln{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:7 5;opacity:0;transition:opacity .25s;}
.ln.show{opacity:1;}
.ln.solid{stroke-dasharray:none;}
.ln.warn{stroke:#ff8f6b;}
.ang{fill:none;stroke:#ffd166;stroke-width:1.8;opacity:0;transition:opacity .25s;}
.ang.show{opacity:1;}
.lnlab{fill:var(--teal);font-size:11px;font-weight:700;opacity:0;transition:opacity .25s;
  font-family:'Inter',sans-serif;pointer-events:none;}
.lnlab.show{opacity:1;}
.lnlab.gold{fill:#ffd166;}
.hot{cursor:pointer;}
.hot circle{fill:var(--gold);stroke:#fff;stroke-width:1.5;transition:.16s;}
.hot:hover circle,.hot.sel circle{fill:var(--teal);r:9;}
.hot text{fill:#0b1424;font-size:9.5px;font-weight:800;pointer-events:none;
  font-family:'Inter',sans-serif;}
.viewtag{fill:var(--mut);font-size:11px;font-family:'Inter',sans-serif;letter-spacing:1px;}

/* ---------- panel ---------- */
#panel{width:380px;flex-shrink:0;border-left:1px solid var(--line);
  background:rgba(11,20,36,.72);display:flex;flex-direction:column;overflow:hidden;}
.pn-tabs{display:flex;gap:2px;padding:9px 10px 0;border-bottom:1px solid var(--line);
  overflow-x:auto;flex-shrink:0;}
.pn-tab{background:0;border:0;color:var(--mut);font-size:.75rem;font-weight:700;
  padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
  font-family:inherit;transition:.15s;}
.pn-tab:hover{color:var(--txt);}
.pn-tab.active{color:var(--teal);border-bottom-color:var(--teal);}
.pn-body{flex:1;overflow-y:auto;padding:15px 16px 26px;}
.pn-body::-webkit-scrollbar{width:7px;}
.pn-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px;}
.pane{display:none;} .pane.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.pn-body p{font-size:.86rem;line-height:1.72;color:#D3DCEC;margin-bottom:12px;}
.pn-body h4{font-size:.67rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold2);
  margin:18px 0 8px;font-weight:800;}
.pn-body h4:first-child{margin-top:0;}
.lmrow{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;margin-bottom:6px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;
  cursor:pointer;transition:.16s;}
.lmrow:hover,.lmrow.hot2{background:rgba(45,212,191,.13);border-color:rgba(45,212,191,.45);}
.lmn{width:21px;height:21px;border-radius:50%;background:var(--gold);color:#1a1204;
  font-size:.66rem;font-weight:800;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;}
.lmrow.hot2 .lmn{background:var(--teal);color:#04201c;}
.lmt{font-size:.83rem;font-weight:700;margin-bottom:2px;}
.lmd{font-size:.77rem;color:var(--mut);line-height:1.55;}
table.meas{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:.79rem;}
table.meas th{text-align:left;font-size:.63rem;letter-spacing:1px;text-transform:uppercase;
  color:var(--gold2);padding:6px 8px;border-bottom:1px solid var(--line);}
table.meas td{padding:8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top;
  color:#D3DCEC;line-height:1.5;}
table.meas td strong{color:#fff;}
table.meas td.val{color:var(--teal);font-weight:700;white-space:nowrap;}
.pitfall{background:rgba(255,90,90,.09);border:1px solid rgba(255,90,90,.28);
  border-left:3px solid #ff6b6b;border-radius:9px;padding:11px 13px;margin-bottom:11px;}
.pitfall strong{color:#ff9a9a;display:block;margin-bottom:4px;font-size:.79rem;}
.pitfall span{font-size:.83rem;line-height:1.65;color:#D3DCEC;}
.pearl{background:rgba(45,212,191,.09);border:1px solid rgba(45,212,191,.26);
  border-left:3px solid var(--teal);border-radius:9px;padding:11px 13px;margin-bottom:11px;}
.pearl strong{color:#8fe6d8;display:block;margin-bottom:4px;font-size:.79rem;}
.pearl span{font-size:.83rem;line-height:1.65;color:#D3DCEC;}

/* ---------- search ---------- */
#searchWrap{position:relative;padding:10px 12px;border-bottom:1px solid var(--line);}
#search{width:100%;padding:9px 12px 9px 32px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--txt);font-size:.82rem;font-family:inherit;outline:0;}
#search:focus{border-color:rgba(45,212,191,.5);}
#searchWrap .si{position:absolute;left:23px;top:20px;color:var(--mut);font-size:.8rem;}
#results{position:absolute;left:12px;right:12px;top:52px;z-index:30;background:#0d1727;
  border:1px solid var(--line);border-radius:10px;max-height:52vh;overflow-y:auto;display:none;}
#results.show{display:block;}
.res{padding:9px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);font-size:.81rem;}
.res:last-child{border-bottom:0;}
.res:hover{background:rgba(45,212,191,.14);}
.res small{display:block;color:var(--mut);font-size:.7rem;margin-top:1px;}

/* ---------- radiograph gallery ---------- */
#films{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start;padding:4px;}
.filmcard{background:#05090f;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.5);}
.filmcard img{display:block;width:100%;height:auto;background:#000;}
.filmcap{padding:8px 10px;font-size:.76rem;color:#D3DCEC;border-top:1px solid var(--line);}
.filmcred{font-size:.64rem;color:var(--mut);margin-top:3px;line-height:1.45;}
.filmcred a{color:var(--teal);text-decoration:none;}
.filmcred a:hover{text-decoration:underline;}
.nofilm{color:var(--mut);font-size:.85rem;text-align:center;padding:40px 20px;max-width:420px;line-height:1.7;}

/* ---------- slice stack viewer ---------- */
/* Wider than the image itself: the extra width is the label gutters. */
/* Explicit width, not shrink-to-fit: the gutters only exist if the viewer
   claims the space, and a flex item sized by its content will not. */
#stackview{background:#05090f;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  width:min(820px,100%);box-shadow:0 14px 40px rgba(0,0,0,.55);}
.stackimg{background:#000;display:flex;align-items:center;justify-content:center;cursor:ns-resize;
  min-height:240px;position:relative;}
/* Label overlay. The layer spans the whole stage, not just the image, so
   captions can sit in the gutters either side and reach the structure with
   a leader line. Anchors stay in image-fraction coordinates. */
.slabels{position:absolute;inset:0;pointer-events:none;}
.slabels svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.lead-line{fill:none;stroke:rgba(45,212,191,.75);stroke-width:1.1;}
.lead-dot{fill:var(--teal);stroke:rgba(0,0,0,.6);stroke-width:1.4;}
/* caption chips in the gutters */
/* Wraps rather than overflowing the gutter; the layout measures the
   resulting height so stacked captions still clear each other. */
.cap{position:absolute;font-size:.62rem;font-weight:700;
  color:#CFFAF3;background:rgba(4,14,26,.9);border:1px solid rgba(45,212,191,.45);
  padding:2px 6px;border-radius:5px;line-height:1.25;}
.cap.L{text-align:right;}
.cap i{font-style:normal;color:var(--teal);font-weight:800;margin-right:4px;}
.cap.L{transform:translate(-100%,-50%);}
.cap.R{transform:translateY(-50%);}
/* Narrow stages have no room for gutters, so the pin sits beside the
   structure instead. The dot is positioned at the anchor and the caption
   offset from it — centring dot+text together would drag the dot off. */
.spin{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  width:0;height:0;display:block;}
.spin b{position:absolute;left:-8.5px;top:-8.5px;}
.spin em{position:absolute;left:12px;top:-9px;}
.spin.flip em{left:auto;right:12px;}
.spin b{width:17px;height:17px;border-radius:50%;background:var(--teal);color:#04201c;
  font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 9px rgba(45,212,191,.9);}
.spin em{font-style:normal;font-size:.63rem;font-weight:700;color:#CFFAF3;
  background:rgba(4,14,26,.82);border:1px solid rgba(45,212,191,.45);
  padding:2px 6px;border-radius:5px;}
.sbtn.lab.on{background:rgba(45,212,191,.28);border-color:rgba(45,212,191,.55);color:#8fe6d8;}
/* The stage box is the fixed viewport onto the slice: 54% leaves ~23%
   either side for captions. Zooming scales the image inside this box, so
   the gutters never move. Below 720px there is no room for gutters and the
   script falls back to pins beside the structure. */
.stagebox{position:relative;overflow:hidden;width:54%;max-width:440px;flex-shrink:0;}
@media(max-width:720px){ .stagebox{width:100%;max-width:100%;} }
.stackimg img{display:block;width:100%;height:100%;user-select:none;
  -webkit-user-drag:none;transform-origin:center center;}
.stagebox.zoomed{cursor:grab;}
.stagebox.zoomed.grabbing{cursor:grabbing;}
.zlabel{font-size:.68rem;color:var(--mut);min-width:38px;text-align:center;
  font-variant-numeric:tabular-nums;}
.stackctl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);}
.sbtn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt);
  width:30px;height:30px;border-radius:8px;cursor:pointer;flex-shrink:0;font-size:.78rem;
  display:flex;align-items:center;justify-content:center;transition:.15s;}
.sbtn:hover{background:rgba(45,212,191,.25);border-color:rgba(45,212,191,.5);}
#sRange{flex:1;accent-color:var(--teal);cursor:pointer;}
.scount{font-size:.76rem;color:var(--teal);font-weight:700;white-space:nowrap;min-width:52px;text-align:right;}
.stackhint{padding:0 12px 9px;font-size:.7rem;color:var(--mut);}
.stackhint i{margin-right:5px;}

/* ---------- disclaimer ---------- */
#note{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  font-size:.68rem;color:var(--mut);background:rgba(11,20,36,.85);border:1px solid var(--line);
  padding:5px 12px;border-radius:8px;white-space:nowrap;}

/* ---------- mobile ---------- */
#mobBtn{display:none;}
@media(max-width:1080px){ #panel{width:330px;} }
@media(max-width:900px){
  /* Stacked panes cannot all fit a phone screen, so the page scrolls
     normally instead of trapping the detail panel below the fold. */
  body{overflow:auto;}
  #stage{position:static;display:block;margin-top:58px;}
  #rail{width:100%;max-height:none;border-right:0;border-bottom:1px solid var(--line);}
  #regionList{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 12px;}
  .rail-h{width:100%;padding:6px 4px 2px;}
  .rgn{border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:7px 10px;font-size:.78rem;}
  #viewer{display:block;}
  #filmwrap{padding:12px;}
  #film svg{width:min(460px,92vw);}
  #panel{width:100%;border-left:0;border-top:1px solid var(--line);max-height:none;display:block;}
  .pn-body{overflow:visible;}
  #note{display:none;}
}
</style>
</head>
<body>

<div id="topbar">
  <a href="index.html" class="brand">
    <img src="assets/logo.png" alt="OrthoChronicles" onerror="this.style.display='none'"/>
    <span><i class="fas fa-layer-group"></i> Anatomy + Radiology</span>
  </a>
  <div class="tb-spacer"></div>
  <div id="sectionTabs">
    <button class="sec-tab" id="secAnatomy"><i class="fas fa-cube"></i> <span class="lbl">Anatomy</span></button>
    <button class="sec-tab on" id="secRadiology"><i class="fas fa-x-ray"></i> <span class="lbl">Radiology</span></button>
    <button class="sec-tab" id="secDiagram"><i class="fas fa-draw-polygon"></i> <span class="lbl">Diagram Anatomy</span></button>
  </div>
  <button class="tb-btn on" id="btnLines"><i class="fas fa-ruler-combined"></i> Lines &amp; Angles</button>
  <a class="tb-btn home" href="index.html"><i class="fas fa-house"></i> Site Home</a>
</div>

<div id="stage">

  <!-- region rail -->
  <div id="rail">
    <div id="searchWrap">
      <i class="fas fa-magnifying-glass si"></i>
      <input id="search" type="text" placeholder="Search a line, angle or value…" autocomplete="off"/>
      <div id="results"></div>
    </div>
    <div id="regionList"></div>
  </div>

  <!-- viewer -->
  <div id="viewer">
    <div id="viewhead">
      <h1 id="vTitle">—</h1>
      <p id="vSub"></p>
    </div>
    <div id="filmwrap"><div id="film"></div></div>
    <div id="note">Schematics are original teaching diagrams · Radiographs are openly-licensed (CC0 / public domain / CC BY-SA) and credited under each image</div>
  </div>

  <!-- detail panel -->
  <div id="panel">
    <div class="pn-tabs" id="pnTabs"></div>
    <div class="pn-body" id="pnBody"></div>
  </div>
</div>

<!-- Anatomy subsection: the 3D explorer, loaded on demand -->
<iframe id="anatomyFrame" title="3D Anatomy Explorer" loading="lazy"></iframe>

<script>
/* ══════════════════════════════════════════════════════════════════
   RADIOLOGICAL ANATOMY
   Every diagram below is an original schematic drawn in SVG. No patient
   radiographs are used — that keeps this both lawful and clearer, since a
   diagram can show the construction lines a real film cannot.
   ══════════════════════════════════════════════════════════════════ */
(function(){
'use strict';

/* Small SVG helpers so each region reads as anatomy, not path soup */
const S = {
  open: (w,h)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`,
  close: '</svg>',
  /** dashed construction line + label */
  line: (id,x1,y1,x2,y2,label,cls='')=>
    `<line class="ln ${cls}" data-ln="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`+
    (label?`<text class="lnlab ${cls.includes('warn')?'':''}" data-ln="${id}" x="${(x1+x2)/2+6}" y="${(y1+y2)/2-6}">${label}</text>`:''),
  path: (id,d,label,lx,ly,cls='')=>
    `<path class="ln ${cls}" data-ln="${id}" d="${d}"/>`+
    (label?`<text class="lnlab" data-ln="${id}" x="${lx}" y="${ly}">${label}</text>`:''),
  ang: (id,d,label,lx,ly)=>
    `<path class="ang" data-ln="${id}" d="${d}"/>`+
    (label?`<text class="lnlab gold" data-ln="${id}" x="${lx}" y="${ly}">${label}</text>`:''),
  hot: (i,x,y)=>`<g class="hot" data-hot="${i}"><circle cx="${x}" cy="${y}" r="8"/>`+
                `<text x="${x}" y="${y+3.4}" text-anchor="middle">${i+1}</text></g>`,
  tag: (x,y,t)=>`<text class="viewtag" x="${x}" y="${y}">${t}</text>`
};

/* ══════════════════════════════════════════════════════════════════
   REGION DATA
   ══════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   REAL RADIOGRAPHS
   Self-hosted from Wikimedia Commons. Every file was licence-checked
   programmatically before download: 13 CC0, 1 public domain, 1 CC BY-SA.
   Nothing non-commercial or no-derivatives is used, because this site
   carries advertising. Attribution renders under each image.
   ══════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════
   UI
   ══════════════════════════════════════════════════════════════════ */
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/&(?!(amp|lt|gt|#\d+);)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let current=null, showLines=true, mode='film', section='radiology';

/* ---- how each region is filed into the two rail sections ----
   Radiology = anything with a radiograph or a slice stack.
   Diagram Anatomy = the musculoskeletal teaching schematics.
   Joint regions carry both, so they appear in each — the schematic under
   Diagram Anatomy, the radiographs under Radiology. */
const MSK_GROUPS=['Spine','Upper limb','Lower limb','Paediatric'];
const isRadiology = r => !!(r.stack || (r.films && r.films.length));
const isDiagram   = r => MSK_GROUPS.includes(r.group);
const SECTION_FILTER={ radiology:isRadiology, diagram:isDiagram };

/* ---- rail (rebuilt per section) ---- */
function buildRail(pred){
  const byGroup={};
  REGIONS.filter(pred).forEach(r=>{ (byGroup[r.group]=byGroup[r.group]||[]).push(r); });
  let html='';
  Object.keys(byGroup).forEach(g=>{
    html+=`<div class="rail-h">${g}</div>`;
    byGroup[g].forEach(r=>{
      html+=`<div class="rgn" data-id="${r.id}"><i class="fas ${r.icon}"></i><span>${r.name}</span></div>`;
    });
  });
  $('regionList').innerHTML=html;
}
$('regionList').addEventListener('click',e=>{
  const row=e.target.closest('.rgn'); if(row) show(row.dataset.id);
});

/* ---- render a region ---- */
function show(id, focusLm){
  const r=REGIONS.find(x=>x.id===id); if(!r) return;
  current=r;
  document.querySelectorAll('.rgn').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
  $('vTitle').innerHTML=r.name;
  $('vSub').textContent=r.sub;
  // A slice atlas exists to be scrolled, so open it in the viewer directly.
  // Set the mode without re-entering show(), which would skip the panel build.
  if(r.stack && mode!=='film'){ mode='film'; syncModeButtons(); }
  renderStage(r);


  const tabs=[{k:'landmarks',l:'Landmarks'},{k:'meas',l:'Measurements'},
              {k:'pitfalls',l:'Pitfalls'},{k:'pearls',l:'Pearls'}];
  $('pnTabs').innerHTML=tabs.map((t,i)=>
    `<button class="pn-tab${i===0?' active':''}" data-k="${t.k}">${t.l}</button>`).join('');

  let html='';
  html+=`<div class="pane active" data-k="landmarks"><h4>Numbered on the diagram</h4>`+
    r.landmarks.map((l,i)=>
      `<div class="lmrow" data-lm="${i}"><div class="lmn">${i+1}</div>
        <div><div class="lmt">${l.n}</div><div class="lmd">${l.d}</div></div></div>`).join('')+`</div>`;

  html+=`<div class="pane" data-k="meas"><h4>Normal values &amp; how to measure</h4>
    <table class="meas"><tr><th>Measurement</th><th>Normal</th></tr>`+
    r.meas.map(m=>`<tr><td><strong>${m.n}</strong><br><span style="color:var(--mut)">${m.how}</span>
      <br><span style="color:#9fd8cf">Why: ${m.why}</span></td><td class="val">${m.v}</td></tr>`).join('')+
    `</table></div>`;

  html+=`<div class="pane" data-k="pitfalls">`+
    r.pitfalls.map(p=>`<div class="pitfall"><strong>${p.t}</strong><span>${p.d}</span></div>`).join('')+`</div>`;

  html+=`<div class="pane" data-k="pearls">`+
    (r.pearls||[]).map(p=>`<div class="pearl"><strong>${p.t}</strong><span>${p.d}</span></div>`).join('')+`</div>`;

  $('pnBody').innerHTML=html;
  $('pnBody').scrollTop=0;

  $('pnBody').querySelectorAll('.lmrow').forEach(row=>{
    row.addEventListener('mouseenter',()=>highlight(+row.dataset.lm));
    row.addEventListener('mouseleave',()=>highlight(-1));
  });
  if(focusLm!=null){ selectTab('landmarks'); highlight(focusLm,true); }
}

/**
 * Draw either the schematic (with its numbered hotspots and construction
 * lines) or the real radiographs for this region. Films are lazy-loaded so
 * switching regions never fetches images the reader has not asked for.
 */
function renderStage(r){
  const wrap=$('film');
  // A slice stack behaves like a workstation: scroll through the series
  if(mode==='film' && r.stack && STACKS[r.stack]){
    wrap.classList.add('stackmode');   // claim the full column for the gutters
    renderStack(wrap, STACKS[r.stack]);
    return;
  }
  wrap.classList.remove('stackmode');
  if(mode==='diagram' || !((r.films&&r.films.length) || r.stack)){
    wrap.innerHTML=r.svg;
    applyLines();
    wrap.querySelectorAll('.hot').forEach(h=>{
      h.addEventListener('mouseenter',()=>highlight(+h.dataset.hot));
      h.addEventListener('mouseleave',()=>highlight(-1));
      h.addEventListener('click',()=>{ selectTab('landmarks'); highlight(+h.dataset.hot,true); });
    });
    if(mode==='film' && !((r.films&&r.films.length)||r.stack)){
      wrap.insertAdjacentHTML('afterbegin',
        `<div class="nofilm"><i class="fas fa-circle-info"></i> No openly-licensed radiograph of this
         view was available, so the schematic is shown. Only images that permit commercial reuse are
         published here.</div>`);
    }
    return;
  }
  wrap.innerHTML=`<div id="films">`+r.films.map(k=>{
    const f=FILMS[k]; if(!f) return '';
    return `<figure class="filmcard">
      <img src="radiographs/${f.f}" alt="${esc(f.t)}" loading="lazy"/>
      <figcaption class="filmcap">${esc(f.t)}
        <div class="filmcred">${esc(f.by)} · ${esc(f.lic)} · via
          <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a>
        </div>
      </figcaption></figure>`;
  }).join('')+`</div>`;
}

/* ---- slice stack viewer ---- */
let stackState=null, sLabelsOn=true;
/* Aspect ratio per series, learned once and reused. Slices in a series all
   share a size, so this keeps the viewer from collapsing between slices or
   when a region is reopened. */
const SERIES_RATIO={};

/**
 * Draw the labels for the current slice, if any were authored for it.
 * Positions are fractions of the image box, so they track any resize.
 * A slice with no entry simply shows nothing — never a guessed pin.
 */
/**
 * Stack captions vertically so none overlap: push each below its neighbour,
 * shift the whole column up if it overruns the bottom, then re-resolve and
 * clamp at the top. Order follows the anatomy down the image, so leaders
 * rarely cross.
 */
function stackColumn(list, top, bottom){
  const gap=(a,b)=>(a.h+b.h)/2+3;          // half each height, plus breathing room
  list.sort((a,b)=>a.ay-b.ay);
  list.forEach(o=>o.cy=o.ay);
  for(let k=1;k<list.length;k++)
    if(list[k].cy-list[k-1].cy<gap(list[k-1],list[k]))
      list[k].cy=list[k-1].cy+gap(list[k-1],list[k]);
  const last=list[list.length-1];
  const over=list.length ? (last.cy+last.h/2)-bottom : 0;
  if(over>0) list.forEach(o=>o.cy-=over);
  for(let k=1;k<list.length;k++)
    if(list[k].cy-list[k-1].cy<gap(list[k-1],list[k]))
      list[k].cy=list[k-1].cy+gap(list[k-1],list[k]);
  if(list.length && list[0].cy-list[0].h/2<top){
    const d=top-(list[0].cy-list[0].h/2); list.forEach(o=>o.cy+=d);
  }
  return list;
}

/**
 * Draw the labels for the current slice, if any were authored for it.
 * Anchors are fractions of the image box, so they track any resize; the
 * captions live in the gutters either side and reach their structure with
 * a leader line and arrowhead. A slice with no entry shows nothing —
 * never a guessed pin.
 */
function drawSliceLabels(){
  const host=$('sLabels'); if(!host||!stackState) return;
  const set=SLICE_LABELS[stackState.st.dir];
  const pins=(set && set[stackState.i+1]) || null;
  const hint=$('sLabHint');
  if(!pins || !sLabelsOn){
    host.innerHTML='';
    if(hint) hint.textContent = pins ? ' · labels hidden' : '';
    return;
  }
  if(hint) hint.textContent=' · '+pins.length+' structures labelled on this slice';

  const im=$('sliceImg'), box=$('sStage'); if(!im||!box) return;
  const stage=host.getBoundingClientRect();
  const ib=im.getBoundingClientRect();     // includes the zoom transform
  const bb=box.getBoundingClientRect();    // the fixed viewport onto the slice
  // The box is zero while a new series' first slice decodes; the load
  // handler calls back in. Bail rather than divide by zero.
  if(!ib.width || !bb.width || !stage.width) return;

  // Gutters are measured from the stage box, which zoom never moves.
  const bx=bb.left-stage.left, by=bb.top-stage.top, W=stage.width, H=stage.height;
  const gutter=Math.min(bx, W-(bx+bb.width));

  // Not enough gutter to be readable — fall back to a pin beside the structure.
  if(gutter<96){
    const vis=pins.map((p,i)=>({p,i,
      ax:(ib.left-stage.left)+p.x*ib.width, ay:(ib.top-stage.top)+p.y*ib.height}))
      .filter(o=>o.ax>=bx-1&&o.ax<=bx+bb.width+1&&o.ay>=by-1&&o.ay<=by+bb.height+1);
    host.innerHTML=vis.map(o=>
      `<span class="spin${o.p.x>0.52?' flip':''}" style="left:${o.ax.toFixed(1)}px;top:${o.ay.toFixed(1)}px">
         <b>${o.i+1}</b><em>${esc(o.p.t)}</em></span>`).join('');
    if(hint && vis.length<pins.length)
      hint.textContent=' · '+vis.length+' of '+pins.length+' structures in view';
    return;
  }

  // Anchors come from the transformed image rect, so they follow the zoom.
  // Anything scrolled out of the viewport is dropped rather than drawn
  // pointing at empty space.
  const items=pins.map((p,i)=>({
    n:i+1, t:p.t,
    ax:(ib.left-stage.left)+p.x*ib.width,
    ay:(ib.top-stage.top)+p.y*ib.height,
    side:p.x<0.5?'L':'R'
  })).filter(o=>o.ax>=bx-1 && o.ax<=bx+bb.width+1 && o.ay>=by-1 && o.ay<=by+bb.height+1);

  if(!items.length){ host.innerHTML=''; if(hint) hint.textContent=' · no labelled structure in view'; return; }
  if(hint && items.length<pins.length)
    hint.textContent=' · '+items.length+' of '+pins.length+' structures in view';

  // Captions hug the stage box, not the zoomed image, so they hold still.
  const capL=bx-16, capR=bx+bb.width+16;   // caption edge nearest the image
  const bendL=bx-7,  bendR=bx+bb.width+7;  // where the leader turns
  const capMax=Math.max(60, gutter-22);    // wrap rather than overflow the stage

  // Pass 1: render the captions off-layout to measure how tall each ends up
  // once wrapped, so pass 2 can stack them without collisions.
  host.innerHTML=items.map(o=>
    `<div class="cap ${o.side}" data-n="${o.n}" style="left:${(o.side==='L'?capL:capR).toFixed(1)}px;top:-999px;max-width:${capMax.toFixed(0)}px">
       <i>${o.n}</i>${esc(o.t)}</div>`).join('');
  const nodes=host.querySelectorAll('.cap');
  items.forEach((o,k)=>{ o.h=nodes[k].getBoundingClientRect().height||18; });

  // Pass 2: place them.
  ['L','R'].forEach(s=>stackColumn(items.filter(o=>o.side===s), 8, H-8));

  const paths=items.map(o=>{
    const cx=o.side==='L'?capL:capR, bx=o.side==='L'?bendL:bendR;
    // Leader runs from the caption edge, turns once at the image edge, and
    // ends on the anchor dot — no arrowhead.
    return `<path class="lead-line" d="M${cx.toFixed(1)},${o.cy.toFixed(1)} L${bx.toFixed(1)},${o.cy.toFixed(1)} L${o.ax.toFixed(1)},${o.ay.toFixed(1)}"/>`
      + `<circle class="lead-dot" cx="${o.ax.toFixed(1)}" cy="${o.ay.toFixed(1)}" r="2.4"/>`;
  }).join('');

  const caps=items.map(o=>
    `<div class="cap ${o.side}" style="left:${(o.side==='L'?capL:capR).toFixed(1)}px;top:${o.cy.toFixed(1)}px;max-width:${capMax.toFixed(0)}px">
       <i>${o.n}</i>${esc(o.t)}</div>`).join('');

  host.innerHTML=`<svg viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" preserveAspectRatio="none">${paths}</svg>${caps}`;
}

function renderStack(wrap, st){
  const base='radiographs/stacks/'+st.dir+'/';
  wrap.innerHTML=
   `<div id="stackview">
      <div class="stackimg">
        <div class="stagebox" id="sStage">
          <img id="sliceImg" src="${base+st.slices[0]}" alt="${esc(st.caption)} — slice 1"/>
        </div>
        <div class="slabels" id="sLabels"></div>
      </div>
      <div class="stackctl">
        <button class="sbtn" id="sPrev" aria-label="Previous slice"><i class="fas fa-chevron-up"></i></button>
        <input type="range" id="sRange" min="1" max="${st.slices.length}" value="1"/>
        <button class="sbtn" id="sNext" aria-label="Next slice"><i class="fas fa-chevron-down"></i></button>
        <span class="scount" id="sCount">1 / ${st.slices.length}</span>
        <button class="sbtn" id="sZoomOut" title="Zoom out"><i class="fas fa-magnifying-glass-minus"></i></button>
        <span class="zlabel" id="sZoomLbl">100%</span>
        <button class="sbtn" id="sZoomIn" title="Zoom in"><i class="fas fa-magnifying-glass-plus"></i></button>
        <button class="sbtn" id="sZoomReset" title="Reset zoom"><i class="fas fa-compress"></i></button>
        <button class="sbtn lab ${sLabelsOn?'on':''}" id="sLabBtn" title="Toggle labels"><i class="fas fa-tags"></i></button>
      </div>
      <div class="stackhint"><i class="fas fa-computer-mouse"></i> Scroll on the image, drag the slider, or use ↑ ↓
        <span id="sLabHint"></span></div>
      <div class="filmcap">${esc(st.caption)}
        <div class="filmcred">${esc(st.by)} · ${esc(st.lic)} · via
          <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a></div>
      </div>
    </div>`;

  const img=$('sliceImg'), range=$('sRange'), count=$('sCount');
  stackState={st, base, i:0, ratios:[]};
  // Per-slice aspect ratios. Cross-sectional series share one shape, but an
  // X-ray view stack mixes portrait and landscape films, so each slice needs
  // its own ratio or the box would distort. Seed slice 0 from the cached
  // series ratio so the viewer never opens collapsed.
  const stageEl=$('sStage');
  if(SERIES_RATIO[st.dir]) stageEl.style.aspectRatio=SERIES_RATIO[st.dir];
  st.slices.forEach((s,k)=>{
    const p=new Image();
    p.onload=()=>{
      if(p.naturalWidth && p.naturalHeight){
        stackState.ratios[k]=p.naturalWidth+' / '+p.naturalHeight;
        if(k===0 && !SERIES_RATIO[st.dir]) SERIES_RATIO[st.dir]=stackState.ratios[k];
        if(k===stackState.i){ stageEl.style.aspectRatio=stackState.ratios[k]; drawSliceLabels(); }
      }
    };
    p.src=base+s;
  });

  function go(i){
    i=Math.max(0,Math.min(st.slices.length-1,i));
    stackState.i=i;
    if(stackState.ratios[i]) stageEl.style.aspectRatio=stackState.ratios[i];  // set before src so no collapse
    img.src=base+st.slices[i];
    img.alt=st.caption+' — slice '+(i+1);
    range.value=i+1;
    count.textContent=(i+1)+' / '+st.slices.length;
    drawSliceLabels();
  }
  stackState.go=go;
  $('sPrev').onclick=()=>go(stackState.i-1);
  $('sNext').onclick=()=>go(stackState.i+1);
  range.oninput=()=>go(+range.value-1);
  $('sLabBtn').onclick=()=>{
    sLabelsOn=!sLabelsOn;
    $('sLabBtn').classList.toggle('on',sLabelsOn);
    drawSliceLabels();
  };
  // Every slice in a series shares one size, so pin the aspect ratio from
  // the first one. Without it the box collapses to zero height while each
  // new slice decodes — the labels lose their reference and the whole
  // viewer jumps on every scroll step.
  /* ---- zoom & pan ------------------------------------------------------
     Zoom scales the image inside a fixed stage box, so the gutters and the
     caption columns never move. Anchors are read from the image's live
     rect, which already includes the transform, so labels track the
     anatomy as it grows; those pushed outside the box are dropped. */
  const stage=$('sStage'), ZMIN=1, ZMAX=6;
  let z=1, tx=0, ty=0;

  function clampPan(){
    const b=stage.getBoundingClientRect();
    const mx=Math.max(0,(z-1)*b.width/2), my=Math.max(0,(z-1)*b.height/2);
    tx=Math.max(-mx,Math.min(mx,tx));
    ty=Math.max(-my,Math.min(my,ty));
  }
  function applyZoom(){
    clampPan();
    img.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${z})`;
    stage.classList.toggle('zoomed',z>1);
    const lbl=$('sZoomLbl'); if(lbl) lbl.textContent=Math.round(z*100)+'%';
    drawSliceLabels();
  }
  function setZoom(nz,cx,cy){
    const b=stage.getBoundingClientRect();
    nz=Math.max(ZMIN,Math.min(ZMAX,nz));
    // Keep the point under the cursor (or the centre) fixed while scaling.
    if(cx!=null){
      const ox=cx-b.left-b.width/2, oy=cy-b.top-b.height/2;
      tx=ox-(ox-tx)*(nz/z); ty=oy-(oy-ty)*(nz/z);
    }
    z=nz; if(z===1){tx=0;ty=0;}
    applyZoom();
  }
  stackState.setZoom=setZoom;
  stackState.getZoom=()=>({z,tx,ty});

  $('sZoomIn').onclick =()=>setZoom(z*1.4);
  $('sZoomOut').onclick=()=>setZoom(z/1.4);
  $('sZoomReset').onclick=()=>{ z=1; tx=0; ty=0; applyZoom(); };

  // Ctrl/⌘ + wheel zooms about the cursor; plain wheel still steps slices.
  stage.addEventListener('wheel',e=>{
    if(!(e.ctrlKey||e.metaKey)) return;
    e.preventDefault(); e.stopPropagation();
    setZoom(z*(e.deltaY<0?1.18:1/1.18), e.clientX, e.clientY);
  },{passive:false});

  let drag=null;
  stage.addEventListener('pointerdown',e=>{
    if(z<=1) return;
    drag={x:e.clientX,y:e.clientY,tx,ty};
    stage.setPointerCapture(e.pointerId); stage.classList.add('grabbing');
  });
  stage.addEventListener('pointermove',e=>{
    if(!drag) return;
    tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y);
    applyZoom();
  });
  ['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,e=>{
    if(!drag) return;
    drag=null; stage.classList.remove('grabbing');
    try{ stage.releasePointerCapture(e.pointerId); }catch(_){}
  }));

  function pinRatio(){
    if(img.naturalWidth && img.naturalHeight){
      const r=img.naturalWidth+' / '+img.naturalHeight;
      stackState.ratios[stackState.i]=r;
      if(!SERIES_RATIO[st.dir]) SERIES_RATIO[st.dir]=r;
      stage.style.aspectRatio=r;   // the on-screen image is the source of truth for its slice
    }
  }
  img.addEventListener('load',()=>{ pinRatio(); drawSliceLabels(); });
  if(img.complete) pinRatio();          // already cached: no load event coming
  stackState.pinRatio=pinRatio;
  if(!renderStack._resizeBound){
    renderStack._resizeBound=true;
    let t; addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(drawSliceLabels,120); });
  }
  drawSliceLabels();
  wrap.querySelector('.stackimg').addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey) return;   // that gesture is zoom, handled above
    e.preventDefault();
    go(stackState.i + (e.deltaY>0?1:-1));
  },{passive:false});
}

function selectTab(k){
  $('pnTabs').querySelectorAll('.pn-tab').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
  $('pnBody').querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.dataset.k===k));
}
$('pnTabs').addEventListener('click',e=>{
  const b=e.target.closest('.pn-tab'); if(b) selectTab(b.dataset.k);
});

/** Light up a numbered landmark on the diagram and its row together. */
function highlight(i,scroll){
  $('film').querySelectorAll('.hot').forEach(h=>h.classList.toggle('sel',+h.dataset.hot===i));
  $('pnBody').querySelectorAll('.lmrow').forEach(r=>r.classList.toggle('hot2',+r.dataset.lm===i));
  if(scroll && i>=0){
    const row=$('pnBody').querySelector(`.lmrow[data-lm="${i}"]`);
    if(row) row.scrollIntoView({block:'nearest'});
  }
}

/* ---- lines toggle ---- */
function applyLines(){
  $('film').querySelectorAll('.ln,.ang,.lnlab').forEach(el=>el.classList.toggle('show',showLines));
}
$('btnLines').addEventListener('click',()=>{
  showLines=!showLines;
  $('btnLines').classList.toggle('on',showLines);
  applyLines();
});

/* syncModeButtons is kept because renderStage/show still call it, but the
   only per-mode control left is the Lines toggle, meaningful on schematics. */
function syncModeButtons(){
  const onDiagram = section==='diagram';
  $('btnLines').style.display = onDiagram ? '' : 'none';
  $('btnLines').style.opacity = onDiagram ? '1' : '.4';
  $('btnLines').disabled = !onDiagram;
}

/* ---- Anatomy | Radiology | Diagram Anatomy ---- */
function setSection(sec){
  section=sec;
  ['secAnatomy','secRadiology','secDiagram'].forEach(id=>
    $(id).classList.toggle('on',
      (id==='secAnatomy'&&sec==='anatomy3d')||
      (id==='secRadiology'&&sec==='radiology')||
      (id==='secDiagram'&&sec==='diagram')));

  if(sec==='anatomy3d'){
    document.body.classList.add('sec-anatomy');
    const f=$('anatomyFrame'); if(!f.getAttribute('src')) f.setAttribute('src','anatomy.html');
    $('btnLines').style.display='none';
    return;
  }
  document.body.classList.remove('sec-anatomy');
  mode = sec==='radiology' ? 'film' : 'diagram';
  syncModeButtons();
  buildRail(SECTION_FILTER[sec]);
  // Open the first region of this section (or keep the current one if it
  // still belongs here).
  const list=REGIONS.filter(SECTION_FILTER[sec]);
  const keep = current && list.some(r=>r.id===current.id) ? current.id : (list[0]&&list[0].id);
  if(keep) show(keep);
}
$('secAnatomy').addEventListener('click',()=>setSection('anatomy3d'));
$('secRadiology').addEventListener('click',()=>setSection('radiology'));
$('secDiagram').addEventListener('click',()=>setSection('diagram'));

/* ---- search across landmarks, measurements and pitfalls ---- */
/* Strip diacritics so "bohler" finds Böhler and "tonnis" finds Tönnis —
   nobody types the umlaut when searching. */
const fold = s => String(s).toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[’']/g,"'");

const INDEX=[];
REGIONS.forEach(r=>{
  INDEX.push({rid:r.id,label:r.name,sub:'Region',hay:fold(r.name+' '+r.sub)});
  r.landmarks.forEach((l,i)=>INDEX.push({rid:r.id,lm:i,label:l.n,sub:'Landmark · '+r.name,
    hay:fold(l.n+' '+l.d)}));
  r.meas.forEach(m=>INDEX.push({rid:r.id,tab:'meas',label:m.n+' — '+m.v,sub:'Measurement · '+r.name,
    hay:fold(m.n+' '+m.v+' '+m.why+' '+m.how)}));
  r.pitfalls.forEach(p=>INDEX.push({rid:r.id,tab:'pitfalls',label:p.t,sub:'Pitfall · '+r.name,
    hay:fold(p.t+' '+p.d)}));
  (r.pearls||[]).forEach(p=>INDEX.push({rid:r.id,tab:'pearls',label:p.t,sub:'Pearl · '+r.name,
    hay:fold(p.t+' '+p.d)}));
});
$('search').addEventListener('input',()=>{
  const q=fold($('search').value.trim());
  const box=$('results');
  if(q.length<2){ box.classList.remove('show'); return; }
  const hits=INDEX.filter(x=>x.hay.includes(q)).slice(0,16);
  box.innerHTML = hits.length
    ? hits.map((h,i)=>`<div class="res" data-i="${INDEX.indexOf(h)}">${esc(h.label)}<small>${esc(h.sub)}</small></div>`).join('')
    : '<div class="res">Nothing found</div>';
  box.classList.add('show');
});
$('results').addEventListener('click',e=>{
  const el=e.target.closest('.res'); if(!el||!el.dataset.i) return;
  const h=INDEX[+el.dataset.i];
  const r=REGIONS.find(x=>x.id===h.rid);
  // Landmarks and measurements live on the schematic; jump to the section
  // that actually holds this region.
  const sec = isDiagram(r) ? 'diagram' : 'radiology';
  if(section!==sec) setSection(sec);
  show(h.rid, h.lm);
  if(h.tab) selectTab(h.tab);
  $('results').classList.remove('show'); $('search').value='';
});
document.addEventListener('click',e=>{ if(!e.target.closest('#searchWrap')) $('results').classList.remove('show'); });

/* keyboard */
window.addEventListener('keydown',e=>{
  if(e.target===$('search')){ if(e.key==='Escape') $('search').blur(); return; }
  if(e.key==='/'){ e.preventDefault(); $('search').focus(); }
  if(e.key==='l'||e.key==='L') $('btnLines').click();
  // In a slice stack the arrows drive the slices, not the region list
  if(stackState && stackState.go && document.getElementById('sliceImg')){
    if(e.key==='ArrowDown'){ e.preventDefault(); stackState.go(stackState.i+1); return; }
    if(e.key==='ArrowUp'){   e.preventDefault(); stackState.go(stackState.i-1); return; }
  }
  // Arrow keys walk the current section's rail, not the full region list.
  if(section==='anatomy3d') return;
  const list=REGIONS.filter(SECTION_FILTER[section]);
  const i=list.findIndex(r=>r.id===(current&&current.id));
  if(e.key==='ArrowDown'&&i<list.length-1) show(list[i+1].id);
  if(e.key==='ArrowUp'&&i>0) show(list[i-1].id);
});

/* debug handle for automated checks */
if(/debug=1/.test(location.search+location.hash)){
  window.__radio = {REGIONS, SLICE_LABELS, show, selectTab, highlight,
    setSection, getSection:()=>section, isRadiology, isDiagram, count:()=>REGIONS.length};
}

/* Deep links: #anatomy / #diagram / #radiology pick the opening section. */
const hashSec = /anatomy3d|3d|anatomy/.test(location.hash) ? 'anatomy3d'
              : /diagram/.test(location.hash) ? 'diagram' : 'radiology';
setSection(hashSec);
})();
</script>
